[[permission]]
identifier = "launcher-commands"
description = "Launcher window"
commands.allow = [
  "play",
  "capture_show",
  "capture_info",
  "capture_choose_folder",
  "capture_set_gnome_shortcuts",
  "capture_set_remember_authorization",
  "capture_open_folder",
  "capture_screenshot",
  "capture_start",
  "capture_stop",
  "extensions_list",
  "extensions_install",
  "extensions_change",
  "extensions_action",
  "extensions_restart",
  "engines",
  "preferred_engine",
  "open_site",
  "open_tool",
  "ruffle_settings",
  "set_ruffle_settings",
  "launcher_settings",
  "set_hide_launcher",
  "set_show_menu_bar",
  "get_shell_pages",
  "launcher_model",
  "play_game",
  "launcher_search",
  "set_startup",
  "get_profile_preferences",
  "change_profile_preference",
  "get_custom_swf_status",
  "choose_custom_swf",
  "remove_custom_swf",
  "restart_app"
]

[[permission]]
identifier = "about-commands"
description = "About window"
commands.allow = ["open_project_page"]

[[permission]]
identifier = "studio-commands"
description = "Char Page Studio window"
commands.allow = [
  "studio_defaults",
  "studio_messages",
  "studio_load_character",
  "studio_render",
  "studio_capture",
  "studio_close_preview"
]

[[permission]]
identifier = "reminders-commands"
description = "Reminders window"
commands.allow = ["get_reminders", "get_reminders_messages", "save_reminders"]

[[permission]]
identifier = "todo-commands"
description = "To-do window"
commands.allow = ["get_todo", "get_todo_messages", "save_todo", "open_todo_link"]

[[permission]]
identifier = "inventory-commands"
description = "Inventory window"
commands.allow = [
  "get_inventory",
  "get_inventory_messages",
  "save_inventory_labels",
  "sync_inventory_now",
  "open_account_for_sync",
  "set_inventory_active_char",
  "open_inventory_item_wiki",
  "fetch_wiki_page",
  "match_wiki_items"
]

[[permission]]
identifier = "account-commands"
description = "Account window"
commands.allow = [
  "sync_inventory_now",
  "fetch_wiki_page",
  "get_wiki_messages",
  "get_inventory",
  "set_inventory_active_char",
  "match_wiki_item",
  "match_wiki_items"
]

[[permission]]
identifier = "wiki-commands"
description = "Wiki window"
commands.allow = [
  "fetch_wiki_page",
  "get_wiki_messages",
  "get_inventory",
  "set_inventory_active_char",
  "match_wiki_item",
  "match_wiki_items"
]

[[permission]]
identifier = "strategy-commands"
description = "Strategy window"
commands.allow = [
  "get_strategy",
  "get_strategy_messages",
  "save_strategy",
  "get_inventory_item_counts",
  "set_strategy_timer_shortcut",
  "clear_strategy_timer_shortcut"
]

[[permission]]
identifier = "capture-controls"
description = "Built-in capture control window"
commands.allow = ["capture_info", "capture_choose_folder", "capture_set_gnome_shortcuts", "capture_set_remember_authorization", "capture_open_folder", "capture_screenshot", "capture_start", "capture_stop"]

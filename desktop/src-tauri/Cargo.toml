[package]
name = "aquastar-lite"
version = "3.0.0-rc.4"
edition = "2021"
description = "AquaStar launcher"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
ureq = "2"
chrono = "0.4"
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
tauri-plugin-single-instance = "2.4.5"
zip = { version = "2", default-features = false, features = ["deflate"] }
rfd = "0.15"
tauri-plugin-global-shortcut = "2"

[profile.release]
panic = "abort"
strip = true
lto = true
codegen-units = 1
opt-level = "s"

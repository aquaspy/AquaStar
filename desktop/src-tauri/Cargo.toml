[package]
name = "aquastar-lite"
version = "3.0.0-rc.5"
edition = "2021"
description = "AquaStar launcher"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
ureq = "2"
chrono = "0.4"
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
tauri-plugin-single-instance = "2.4.5"
zip = { version = "2", default-features = false, features = ["deflate"] }
rfd = "0.15"
png = "0.17"
gif = "0.13"
color_quant = "1"
xcap = { version = "=0.9.8", features = ["wgc"] }
tauri-plugin-global-shortcut = "2"

[profile.release]
panic = "abort"
strip = true
lto = true
codegen-units = 1
opt-level = "s"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
libpulse-binding = "2.30"
ashpd = { version = "0.11.1", default-features = false, features = ["async-std"] }
pipewire = "0.10"
x11rb = { version = "0.13.2", features = ["composite"] }

[target.'cfg(target_os = "windows")'.dependencies]
wasapi = "=0.23.0"
windows-capture = "=1.5.0"

[patch.crates-io]
libspa = { path = "../vendor/libspa" }

[target.'cfg(not(target_os = "linux"))'.dependencies]
tauri-plugin-notification = "=2.4.0"

name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    if: ${{ !startsWith(github.ref, 'refs/tags/v3.') }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: bash scripts/build-arch.sh linux x64
      - run: |
          mkdir -p artifacts
          cp dist/*.AppImage dist/*.deb artifacts/
      - run: bash scripts/build-arch.sh linux ia32
      - run: cp dist/*.AppImage artifacts/
      - run: bash scripts/build-arch.sh linux armv7l
      - run: cp dist/*.AppImage artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: aquastar-linux
          path: artifacts/*
          if-no-files-found: error

  build-windows:
    if: ${{ !startsWith(github.ref, 'refs/tags/v3.') }}
    runs-on: windows-latest
    env:
      GH_TOKEN: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: bash scripts/build-arch.sh win x64
      - run: |
          mkdir artifacts
          Copy-Item -Path work-win-x64\dist\*.exe -Destination artifacts\AquaStar-Setup-x64.exe
      # Build from the x64 staging directory so the portable executable receives
      # the same x64 PPAPI Flash binary as the NSIS installer.
      - run: |
          Push-Location work-win-x64
          npx electron-builder --win portable --x64 --publish never --config.artifactName='AquaStar-Portable-x64-${version}.${ext}'
          Pop-Location
          Copy-Item -Path work-win-x64\dist\AquaStar-Portable-x64-*.exe -Destination artifacts\
      - run: bash scripts/build-arch.sh win ia32
      - run: Copy-Item -Path work-win-ia32\dist\*.exe -Destination artifacts\AquaStar-Setup-ia32.exe
      # The ia32 staging directory contains pepflashplayer32bits.dll.
      - run: |
          Push-Location work-win-ia32
          npx electron-builder --win portable --ia32 --publish never --config.artifactName='AquaStar-Portable-ia32-${version}.${ext}'
          Pop-Location
          Copy-Item -Path work-win-ia32\dist\AquaStar-Portable-ia32-*.exe -Destination artifacts\
      - uses: actions/upload-artifact@v4
        with:
          name: aquastar-windows
          path: artifacts/*
          if-no-files-found: error

  build-mac:
    if: ${{ !startsWith(github.ref, 'refs/tags/v3.') }}
    runs-on: macos-latest
    env:
      GH_TOKEN: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: bash scripts/build-arch.sh mac x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Smoke the mac zip on this Apple Silicon runner
        run: |
          set -euo pipefail
          zip=$(echo dist/AquaStar-*-mac-x64.zip)
          python3 scripts/smoke/electron_mac.py --zip "$zip" --out smoke-electron --require-wrapper
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: electron-mac-smoke
          path: smoke-electron/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: aquastar-macos-x64
          path: dist/*.zip
          if-no-files-found: error

  publish:
    needs: [build-linux, build-windows, build-mac]
    if: ${{ !startsWith(github.ref, 'refs/tags/v3.') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aquastar-linux
          path: release/linux
      - uses: actions/download-artifact@v4
        with:
          name: aquastar-windows
          path: release/windows
      - uses: actions/download-artifact@v4
        with:
          name: aquastar-macos-x64
          path: release/mac
      # A '-' after the version (v2.1.1-rc.1, -beta, -alpha, ...) is a prerelease:
      # publish it as a prerelease and never as Latest. Stable tags leave both
      # outputs empty. action-gh-release treats an empty prerelease input as
      # unset, so a new stable release stays a full release and a release that
      # already exists as a prerelease keeps that flag. Passing prerelease: false
      # would republish that existing prerelease as a full release.
      - name: Classify release
        id: release-kind
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$TAG_NAME" == *-* ]]; then
            echo "Tag ${TAG_NAME} has a prerelease suffix."
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          existing="$(gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease 2>/dev/null || true)"
          if [[ "$existing" == "true" ]]; then
            echo "Release ${TAG_NAME} already exists as a prerelease; keeping it a prerelease and not Latest."
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "Tag ${TAG_NAME} is stable; leaving prerelease and make_latest unset."
          fi
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ steps.release-kind.outputs.prerelease }}
          make_latest: ${{ steps.release-kind.outputs.make_latest }}
          files: |
            release/linux/**
            release/windows/**
            release/mac/**

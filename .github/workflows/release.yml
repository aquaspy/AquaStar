name: Release

on:
  push:
    tags:
      - 'v*'
      - '!v3'
      - '!v3.*'
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: bash scripts/build-arch.sh linux x64
      - run: |
          mkdir -p artifacts
          cp dist/*.AppImage dist/*.deb artifacts/
      - run: bash scripts/build-arch.sh linux ia32
      - run: cp dist/*.AppImage artifacts/
      - run: bash scripts/build-arch.sh linux armv7l
      - run: cp dist/*.AppImage artifacts/
      - name: Check Linux artifacts
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/expect-one.sh artifacts 'AquaStar-!(*-i386|*-armv7l).AppImage'
          bash scripts/ci/expect-one.sh artifacts 'AquaStar-*-i386.AppImage'
          bash scripts/ci/expect-one.sh artifacts 'AquaStar-*-armv7l.AppImage'
          bash scripts/ci/expect-one.sh artifacts 'AquaStar_*_amd64.deb'
      - uses: actions/upload-artifact@v4
        with:
          name: aquastar-linux
          path: artifacts/*
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
        shell: bash
      - run: bash scripts/build-arch.sh win x64
        shell: bash
      - run: bash scripts/build-arch.sh win ia32
        shell: bash
      - name: Build Windows portables
        shell: bash
        run: |
          set -euo pipefail
          # electron-builder substitutes ${version} and ${ext}. Bash must leave them alone.
          # shellcheck disable=SC2016
          x64_name='AquaStar-Portable-x64-${version}.${ext}'
          # shellcheck disable=SC2016
          ia32_name='AquaStar-Portable-ia32-${version}.${ext}'
          (
            cd work-win-x64
            npx electron-builder --win portable --x64 --publish never --config.artifactName="$x64_name"
          )
          (
            cd work-win-ia32
            npx electron-builder --win portable --ia32 --publish never --config.artifactName="$ia32_name"
          )
      - name: Copy Windows artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          x64=$(bash scripts/ci/expect-one.sh work-win-x64/dist 'AquaStar Setup*.exe')
          ia32=$(bash scripts/ci/expect-one.sh work-win-ia32/dist 'AquaStar Setup*.exe')
          px64=$(bash scripts/ci/expect-one.sh work-win-x64/dist 'AquaStar-Portable-x64-*.exe')
          pia32=$(bash scripts/ci/expect-one.sh work-win-ia32/dist 'AquaStar-Portable-ia32-*.exe')
          cp "$x64" artifacts/AquaStar-Setup-x64.exe
          cp "$ia32" artifacts/AquaStar-Setup-ia32.exe
          cp "$px64" artifacts/
          cp "$pia32" artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: aquastar-windows
          path: artifacts/*
          if-no-files-found: error

  build-mac:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: bash scripts/build-arch.sh mac x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Check the mac zip
        shell: bash
        run: bash scripts/ci/expect-one.sh dist 'AquaStar-*-mac-x64.zip'
      - name: Smoke the mac zip on this Apple Silicon runner
        run: |
          set -euo pipefail
          zip=$(echo dist/AquaStar-*-mac-x64.zip)
          python3 scripts/smoke/electron_mac.py --zip "$zip" --out smoke-electron --require-wrapper
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: electron-mac-smoke
          path: smoke-electron/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: aquastar-macos-x64
          path: dist/*.zip
          if-no-files-found: error

  publish:
    needs: [build-linux, build-windows, build-mac]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: aquastar-linux
          path: release/linux
      - uses: actions/download-artifact@v4
        with:
          name: aquastar-windows
          path: release/windows
      - uses: actions/download-artifact@v4
        with:
          name: aquastar-macos-x64
          path: release/mac
      - name: Check the nine release files
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/expect-one.sh release/linux 'AquaStar-!(*-i386|*-armv7l).AppImage'
          bash scripts/ci/expect-one.sh release/linux 'AquaStar-*-i386.AppImage'
          bash scripts/ci/expect-one.sh release/linux 'AquaStar-*-armv7l.AppImage'
          bash scripts/ci/expect-one.sh release/linux 'AquaStar_*_amd64.deb'
          bash scripts/ci/expect-one.sh release/windows 'AquaStar-Setup-x64.exe'
          bash scripts/ci/expect-one.sh release/windows 'AquaStar-Setup-ia32.exe'
          bash scripts/ci/expect-one.sh release/windows 'AquaStar-Portable-x64-*.exe'
          bash scripts/ci/expect-one.sh release/windows 'AquaStar-Portable-ia32-*.exe'
          bash scripts/ci/expect-one.sh release/mac 'AquaStar-*-mac-x64.zip'
      - name: Classify release
        id: release-kind
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$TAG_NAME" == *-* ]]; then
            echo "Tag ${TAG_NAME} is a prerelease."
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          errfile=$(mktemp)
          set +e
          view=$(gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease 2>"$errfile")
          status=$?
          set -e
          if [[ $status -ne 0 ]]; then
            err=$(cat "$errfile")
            if [[ "$err" == *"release not found"* ]]; then
              echo "Tag ${TAG_NAME} is a new stable release and becomes Latest."
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
              echo "make_latest=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            printf '%s\n' "$err" >&2
            exit "$status"
          fi
          if [[ "$view" == "true" ]]; then
            echo "Release ${TAG_NAME} is already a prerelease. Keeping that, and not Latest."
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "Tag ${TAG_NAME} is stable and becomes Latest."
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "make_latest=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ steps.release-kind.outputs.prerelease }}
          make_latest: ${{ steps.release-kind.outputs.make_latest }}
          files: |
            release/linux/**
            release/windows/**
            release/mac/**

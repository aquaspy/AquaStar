name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run dist-l
      - uses: actions/upload-artifact@v4
        with:
          name: aquastar-linux-x64
          path: |
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    env:
      GH_TOKEN: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run dist-w
      - uses: actions/upload-artifact@v4
        with:
          name: aquastar-windows-x64
          path: dist/*.exe
          if-no-files-found: error

  build-mac:
    runs-on: macos-latest
    env:
      GH_TOKEN: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx electron-builder --mac zip --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: aquastar-macos-x64
          path: dist/*.zip
          if-no-files-found: error

  publish:
    needs: [build-linux, build-windows, build-mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aquastar-linux-x64
          path: release/linux
      - uses: actions/download-artifact@v4
        with:
          name: aquastar-windows-x64
          path: release/windows
      - uses: actions/download-artifact@v4
        with:
          name: aquastar-macos-x64
          path: release/mac
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/linux/**
            release/windows/**
            release/mac/**
name: AquaStar NEO Release Overlap Probe

on:
  push:
    branches: [neo-dev]
    paths:
      - '.github/workflows/desktop-release-probe.yml'

permissions:
  contents: write
  actions: write

jobs:
  call:
    permissions:
      contents: write
      actions: write
    uses: ./.github/workflows/desktop-release.yml
    secrets: inherit

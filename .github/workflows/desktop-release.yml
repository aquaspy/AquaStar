name: AquaStar NEO Desktop Release

on:
  push:
    tags:
      - 'neo-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
      kind: ${{ steps.decide.outputs.kind }}
    steps:
      - id: decide
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          publish=false
          kind=prerelease
          case "$REF" in
            refs/tags/neo-v*-rc.*|refs/tags/neo-v*-alpha.*|refs/tags/neo-v*-beta.*)
              publish=true
              kind=prerelease
              ;;
            refs/tags/neo-v*)
              publish=true
              kind=stable
              ;;
          esac
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin --bundles app'
    runs-on: ${{ matrix.platform }}
    env:
      # linuxdeploy's bundled strip exits on .relr.dyn in current webkit2gtk, and
      # Tauri reports only "failed to run linuxdeploy". Extract-and-run starts
      # that AppImage when the runner has no FUSE mount.
      NO_STRIP: 'true'
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          # Flash Player is linked to GTK 2. linuxdeploy aborts the AppImage when that library is missing.
          # libnss3 is a projector dependency that WebKit does not pull in.
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk2.0-0 libnss3 libpipewire-0.3-dev libxcb-randr0-dev libgbm-dev libclang-dev nasm
      - name: Bundle Flash GTK 2 libraries for the AppImage
        if: matrix.platform == 'ubuntu-22.04'
        run: bash scripts/bundle-flash-gtk2.sh
      - name: Media build tools on Windows
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: make nasm pkgconf git mingw-w64-x86_64-gcc mingw-w64-x86_64-python mingw-w64-x86_64-pkgconf
      - name: Build offline recording component
        if: runner.os != 'Windows'
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            python3 scripts/build-media.py --source-bundle
          else
            python3 scripts/build-media.py
          fi
          if [[ "$RUNNER_OS" == macOS ]]; then
            python3 scripts/build-media.py --arch x86_64
          fi
      - name: Build offline recording component on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: python scripts/build-media.py
      - name: Unpack pinned players
        if: matrix.platform != 'windows-latest'
        run: bash scripts/fetch-players.sh
      - name: Unpack pinned players
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: ./scripts/fetch-players.ps1
      - name: Build and publish release (tag push)
        if: needs.gate.outputs.publish == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: '.'
          tauriScript: npx -y @tauri-apps/cli@2
          tagName: ${{ github.ref_name }}
          releaseName: ${{ needs.gate.outputs.kind == 'stable' && 'AquaStar NEO v__VERSION__' || 'AquaStar NEO v__VERSION__ - Pre-release' }}
          releaseDraft: false
          # An rc, alpha, or beta tag stays a prerelease. A stable neo-v tag is
          # not a prerelease. No NEO tag becomes Latest. Latest stays the classic release.
          prerelease: ${{ needs.gate.outputs.kind != 'stable' }}
          args: ${{ matrix.args }}
      # Manual runs only build and upload workflow artifacts, so the bundles can be
      # tested before tagging. They never create or touch a release.
      - name: Build only (manual run)
        if: needs.gate.outputs.publish != 'true'
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: '.'
          tauriScript: npx -y @tauri-apps/cli@2
          args: ${{ matrix.args }}
      - name: Attach corresponding media sources
        if: runner.os == 'Linux' && needs.gate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" ../AquaStar-workspace/builds/media/AquaStar-media-sources.tar.xz --repo "$GITHUB_REPOSITORY" --clobber
      - name: Normalize Debian prerelease versions
        if: matrix.platform == 'ubuntu-22.04'
        run: python3 scripts/normalize-deb-version.py --package-name aquastar-neo src-tauri/target/release/bundle/deb/*.deb
      - name: Rename AppImage package
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          ver=$(python3 -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["version"])')
          python3 scripts/rename-tauri-artifacts.py \
            --bundle-dir src-tauri/target/release/bundle/appimage \
            --version "$ver" --platform linux
      - name: Replace Linux release assets with normalized package names
        if: matrix.platform == 'ubuntu-22.04' && needs.gate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while IFS= read -r asset; do
            [ -z "$asset" ] || gh release delete-asset "$GITHUB_REF_NAME" "$asset" --yes --repo "$GITHUB_REPOSITORY"
          done < <(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name | select((endswith(".deb") or endswith(".AppImage")) and (startswith("aquastar-neo_") | not))')
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
            src-tauri/target/release/bundle/deb/aquastar-neo_*.deb \
            src-tauri/target/release/bundle/appimage/aquastar-neo_*.AppImage
      - name: Sign nested apps and seal the DMG
        if: matrix.platform == 'macos-latest'
        run: bash scripts/finish-macos-app.sh
      - name: Attach macOS disk image to the pre-release
        if: matrix.platform == 'macos-latest' && needs.gate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dmg=$(find src-tauri/target -path '*/release/bundle/dmg/*.dmg' -type f | head -n 1)
          if [[ -z "$dmg" ]]; then
            echo "no disk image under src-tauri/target" >&2
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber "$dmg"
      - name: Rename Windows installer package
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $ver = (Get-Content -Raw src-tauri/tauri.conf.json | ConvertFrom-Json).version
          python scripts/rename-tauri-artifacts.py --bundle-dir src-tauri/target/release/bundle/nsis --version $ver --platform windows
      - name: Replace Windows installer release asset
        if: matrix.platform == 'windows-latest' && needs.gate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while IFS= read -r asset; do
            [ -z "$asset" ] || gh release delete-asset "$GITHUB_REF_NAME" "$asset" --yes --repo "$GITHUB_REPOSITORY"
          done < <(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name | select(endswith("-setup.exe") and (startswith("aquastar-neo_") | not))')
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber src-tauri/target/release/bundle/nsis/aquastar-neo_*-setup.exe
      - name: Package Windows portable
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $ver = (Get-Content -Raw src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ($ver -notmatch '^[0-9A-Za-z][0-9A-Za-z._+-]*$') { throw "tauri.conf.json version is not a single path segment: $ver" }
          $exe = "src-tauri/target/release/aquastar-neo.exe"
          if (-not (Test-Path $exe)) { throw "missing $exe" }
          $stage = Join-Path $env:RUNNER_TEMP "aquastar-neo-portable"
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item $exe (Join-Path $stage "aquastar-neo.exe")
          Set-Content -Encoding ascii -Path (Join-Path $stage "portable.txt") -Value "AquaStar NEO stores its data in the data folder next to this file.`r`n"
          $players = "src-tauri/players"
          if (-not (Test-Path $players)) { throw "missing $players" }
          Copy-Item -Recurse $players (Join-Path $stage "players")
          Copy-Item -Recurse "src-tauri/media" (Join-Path $stage "media")
          $zip = "src-tauri/target/release/aquastar-neo_${ver}_x64-portable.zip"
          if (Test-Path $zip) { Remove-Item -Force $zip }
          tar.exe -a -cf $zip -C $stage aquastar-neo.exe portable.txt players media
      - name: Attach portable zip to the pre-release
        if: matrix.platform == 'windows-latest' && needs.gate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ver = (Get-Content -Raw src-tauri/tauri.conf.json | ConvertFrom-Json).version
          gh release upload "$env:GITHUB_REF_NAME" --repo "$env:GITHUB_REPOSITORY" --clobber `
            "src-tauri/target/release/aquastar-neo_${ver}_x64-portable.zip"
      - name: Upload portable zip (manual run)
        if: matrix.platform == 'windows-latest' && needs.gate.outputs.publish != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: aquastar-neo-desktop-windows-portable
          path: src-tauri/target/release/aquastar-neo_*_x64-portable.zip
          if-no-files-found: error
      - name: Upload bundles (manual run)
        if: needs.gate.outputs.publish != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: aquastar-neo-desktop-${{ matrix.platform }}
          path: |
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/dmg/*.dmg
          if-no-files-found: error

  native-arch:
    needs: [build, gate]
    permissions:
      contents: write
    uses: ./.github/workflows/desktop-arch.yml
    with:
      release_tag: ${{ needs.gate.outputs.publish == 'true' && github.ref_name || '' }}

  # tauri-action cannot mark a release as Latest, and its update of an
  # existing release does not send prerelease. Reassert both after every
  # platform has uploaded. Stable and prerelease tags stay off Latest.
  keep-prerelease:
    needs: [build, native-arch, gate]
    if: ${{ always() && needs.gate.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Keep the release off Latest
        env:
          GH_TOKEN: ${{ github.token }}
          KIND: ${{ needs.gate.outputs.kind }}
        run: |
          if [ "$KIND" = "stable" ]; then
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest=false
          else
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --prerelease --latest=false
          fi

  # workflow_dispatch only works from the default branch. main is the classic
  # Electron line and does not carry this file, so a dispatch can return 403.
  # A push of the smoke file to neo-dev runs the same jobs.
  smoke:
    needs: [build, keep-prerelease, gate]
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Start the Desktop smoke test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api --silent "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/desktop-smoke.yml?ref=main" >/dev/null 2>&1; then
            echo "main has desktop-smoke.yml, so workflow_run starts the smoke test"
            exit 0
          fi
          if gh workflow run desktop-smoke.yml --repo "$GITHUB_REPOSITORY" --ref neo-dev -f tag="$GITHUB_REF_NAME"; then
            echo "dispatched desktop-smoke.yml for $GITHUB_REF_NAME"
            exit 0
          fi
          echo "desktop-smoke.yml is not dispatchable until it is on the default branch. A push of that file to neo-dev runs the same test."

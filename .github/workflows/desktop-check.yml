name: AquaStar NEO Desktop Check

# Compiles and unit-tests the Tauri app on pull requests that touch it.
# desktop-release.yml only runs on release tags or by hand, so without this job a
# broken launcher change is first noticed when a release is cut.
on:
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'ui/**'
      - 'scripts/**'
      - 'plugins/**'
      - 'native/**'
      - 'vendor/**'
      - 'packaging/**'
      - 'players.json'
      - '.github/workflows/desktop-*.yml'
  push:
    branches: [main, dev]
    paths:
      - 'src-tauri/**'
      - 'ui/**'
      - 'scripts/**'
      - 'plugins/**'
      - 'native/**'
      - 'vendor/**'
      - 'packaging/**'
      - 'players.json'
      - '.github/workflows/desktop-*.yml'

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libpipewire-0.3-dev libxcb-randr0-dev libgbm-dev libclang-dev
      - name: Debian package migration check
        run: python3 scripts/smoke/test_deb_version.py
      - name: Tauri release artifact naming check
        run: python3 scripts/smoke/test_tauri_artifacts.py
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked
      - name: Unpack pinned players
        if: always()
        run: bash scripts/fetch-players.sh

  macos-check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: cargo check
        working-directory: src-tauri
        run: cargo check --locked
      - name: Unpack pinned players
        if: always()
        run: bash scripts/fetch-players.sh

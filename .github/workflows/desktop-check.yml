name: AquaStar Desktop Check

# Compiles and unit-tests the Tauri app in desktop/ on pull requests that touch it.
# desktop-release.yml only runs on lite-v* tags or by hand, so without this job a
# broken desktop/ change is first noticed when a release is cut.
on:
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-*.yml'
  push:
    branches: [main, dev]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-*.yml'

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - name: Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev
      - name: cargo test
        working-directory: desktop/src-tauri
        run: cargo test --locked
      - name: Unpack pinned players
        if: always()
        run: bash desktop/scripts/fetch-players.sh

  macos-check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - name: cargo check
        working-directory: desktop/src-tauri
        run: cargo check --locked
      - name: Unpack pinned players
        if: always()
        run: bash desktop/scripts/fetch-players.sh

name: AquaStar Capture Check
on:
  push:
    branches: [neo-dev]
    paths:
      - 'src-tauri/**'
      - 'ui/**'
      - 'scripts/**'
      - 'plugins/**'
      - 'native/**'
      - 'vendor/**'
      - '.github/workflows/capture-check.yml'
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'ui/**'
      - 'scripts/**'
      - 'plugins/**'
      - 'native/**'
      - 'vendor/**'
      - '.github/workflows/capture-check.yml'
  workflow_dispatch:

concurrency:
  group: capture-check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch') }}

permissions:
  contents: read
jobs:
  capture:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    timeout-minutes: 50
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libdbus-1-dev libpipewire-0.3-dev libxcb-randr0-dev libgbm-dev libclang-dev nasm xvfb dbus-x11 python3-gi python3-cairo python3-gi-cairo openbox x11-utils
      - name: Windows media compiler
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: make nasm pkgconf git mingw-w64-x86_64-gcc mingw-w64-x86_64-python mingw-w64-x86_64-pkgconf
      - name: Build native media
        if: runner.os != 'Windows'
        run: python3 scripts/build-media.py
      - name: Build native media on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: python scripts/build-media.py
      - name: Capture regressions
        run: 'cargo test --manifest-path src-tauri/Cargo.toml --locked capture:: -- --test-threads=1'
      - name: Build native capture probe
        run: cargo build --manifest-path src-tauri/Cargo.toml --locked --example capture-probe
      - name: Fixture validator
        if: runner.os != 'macOS'
        run: python -m pip install pillow
      - name: Probe Linux window capture
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a dbus-run-session -- sh -c '
            mkdir -p capture-smoke
            : > /tmp/aquastar-capture-wm.log
            openbox >/tmp/aquastar-capture-wm.log 2>&1 &
            wm_pid=$!
            if ! bash scripts/smoke/wait-for-wm.sh; then
              cat /tmp/aquastar-capture-wm.log >&2 || true
              exit 1
            fi
            if python scripts/smoke/capture.py \
              --binary src-tauri/target/debug/examples/capture-probe \
              --encoder src-tauri/media/ffmpeg-linux-x86_64 \
              --ffprobe ../AquaStar-workspace/builds/media/linux-x86_64/ffmpeg-8.1.3/ffprobe \
              --output capture-smoke; then
              probe_status=0
            else
              probe_status=$?
            fi
            wm_state=$(ps -o stat= -p "$wm_pid" 2>/dev/null | tr -d " ")
            if [ -n "$wm_state" ] && [ "${wm_state#Z}" = "$wm_state" ]; then
              wm_observation=running-before-cleanup
              kill "$wm_pid" 2>/dev/null
              wait "$wm_pid" 2>/dev/null
              wm_status=$?
            else
              wait "$wm_pid"
              wm_status=$?
              wm_observation=exited-before-cleanup
            fi
            printf "pid=%s observation=%s exit_status=%s\\n" "$wm_pid" "$wm_observation" "$wm_status" > capture-smoke/openbox-status.txt
            cp /tmp/aquastar-capture-wm.log capture-smoke/openbox.log
            exit "$probe_status"
          '
      - name: Probe Windows window capture
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          python scripts/smoke/capture.py
          --binary src-tauri/target/debug/examples/capture-probe.exe
          --encoder src-tauri/media/ffmpeg-windows-x86_64.exe
          --ffprobe ../AquaStar-workspace/builds/media/windows-x86_64/ffmpeg-8.1.3/ffprobe.exe
          --output capture-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capture-${{ runner.os }}
          path: |
            capture-smoke/
            src-tauri/media/licenses-*/
          if-no-files-found: ignore

name: AquaStar Capture Check
on:
  push:
    branches: [dev]
    paths: ['desktop/**', '.github/workflows/capture-check.yml']
  pull_request:
    paths: ['desktop/**', '.github/workflows/capture-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libdbus-1-dev libpipewire-0.3-dev libpulse-dev libxcb-randr0-dev libgbm-dev libclang-dev nasm xvfb dbus-x11 python3-gi python3-cairo python3-gi-cairo openbox
      - name: Windows media compiler
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: make nasm pkgconf git mingw-w64-x86_64-gcc mingw-w64-x86_64-python mingw-w64-x86_64-pkgconf
      - name: Build native media
        if: runner.os != 'Windows'
        run: python3 desktop/scripts/build-media.py
      - name: Build native media on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: python desktop/scripts/build-media.py
      - name: Capture regressions
        run: 'cargo test --manifest-path desktop/src-tauri/Cargo.toml --locked capture:: -- --test-threads=1'
      - name: Build native capture probe
        run: cargo build --manifest-path desktop/src-tauri/Cargo.toml --locked --example capture-probe
      - name: Fixture validator
        if: runner.os != 'macOS'
        run: python -m pip install pillow
      - name: Probe Linux window capture
        if: runner.os == 'Linux'
        run: >-
          xvfb-run -a dbus-run-session -- sh -c 'openbox >/tmp/aquastar-capture-wm.log 2>&1 & exec python desktop/scripts/smoke/capture.py
          --binary desktop/src-tauri/target/debug/examples/capture-probe
          --encoder desktop/src-tauri/media/ffmpeg-linux-x86_64
          --ffprobe ../AquaStar-workspace/builds/media/linux-x86_64/ffmpeg-8.1.3/ffprobe
          --output capture-smoke'
      - name: Probe Windows window capture
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          python desktop/scripts/smoke/capture.py
          --binary desktop/src-tauri/target/debug/examples/capture-probe.exe
          --encoder desktop/src-tauri/media/ffmpeg-windows-x86_64.exe
          --ffprobe ../AquaStar-workspace/builds/media/windows-x86_64/ffmpeg-8.1.3/ffprobe.exe
          --output capture-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capture-${{ runner.os }}
          path: |
            capture-smoke/
            desktop/src-tauri/media/licenses-*/
          if-no-files-found: ignore

name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: bash scripts/build-arch.sh linux x64
      - run: |
          mkdir -p artifacts
          cp dist/*.AppImage dist/*.deb artifacts/
      - run: bash scripts/build-arch.sh linux ia32
      - run: cp dist/*.AppImage artifacts/
      - run: bash scripts/build-arch.sh linux armv7l
      - run: cp dist/*.AppImage artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: aquastar-linux
          path: artifacts/*
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    env:
      GH_TOKEN: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: bash scripts/build-arch.sh win x64
      - run: |
          mkdir artifacts
          Copy-Item -Path dist\*.exe -Destination artifacts\
      - run: bash scripts/build-arch.sh win ia32
      - run: Copy-Item -Path dist\*.exe -Destination artifacts\ -Force
      - uses: actions/upload-artifact@v4
        with:
          name: aquastar-windows
          path: artifacts/*
          if-no-files-found: error

  build-mac:
    runs-on: macos-latest
    env:
      GH_TOKEN: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx electron-builder --mac zip --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: aquastar-macos-x64
          path: dist/*.zip
          if-no-files-found: error
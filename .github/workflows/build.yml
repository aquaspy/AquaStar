name: Build

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.cursor/**'
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.cursor/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: bash scripts/build-arch.sh linux x64
      - run: |
          mkdir -p artifacts
          cp dist/*.AppImage dist/*.deb artifacts/
      - run: bash scripts/build-arch.sh linux ia32
      - run: cp dist/*.AppImage artifacts/
      - run: bash scripts/build-arch.sh linux armv7l
      - run: cp dist/*.AppImage artifacts/
      - name: Check Linux artifacts
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/expect-one.sh artifacts 'AquaStar-+([0-9]).+([0-9]).+([0-9]).AppImage'
          bash scripts/ci/expect-one.sh artifacts 'AquaStar-*-i386.AppImage'
          bash scripts/ci/expect-one.sh artifacts 'AquaStar-*-armv7l.AppImage'
          bash scripts/ci/expect-one.sh artifacts 'AquaStar_*_amd64.deb'
      - uses: actions/upload-artifact@v4
        with:
          name: aquastar-linux
          path: artifacts/*
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
        shell: bash
      - run: bash scripts/build-arch.sh win x64
        shell: bash
      - run: bash scripts/build-arch.sh win ia32
        shell: bash
      - name: Copy Windows setup exes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          x64=$(bash scripts/ci/expect-one.sh work-win-x64/dist 'AquaStar Setup*.exe')
          ia32=$(bash scripts/ci/expect-one.sh work-win-ia32/dist 'AquaStar Setup*.exe')
          cp "$x64" artifacts/AquaStar-Setup-x64.exe
          cp "$ia32" artifacts/AquaStar-Setup-ia32.exe
      - uses: actions/upload-artifact@v4
        with:
          name: aquastar-windows
          path: artifacts/*
          if-no-files-found: error

  build-mac:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: bash scripts/build-arch.sh mac x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Check the mac zip
        shell: bash
        run: bash scripts/ci/expect-one.sh dist 'AquaStar-*-mac-x64.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: aquastar-macos-x64
          path: dist/*.zip
          if-no-files-found: error

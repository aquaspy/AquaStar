name: AquaStar Lite Release

# Builds the Tauri app in lite/. Triggered only by lite-v* tags, so it never
# collides with the Electron release workflow (release.yml, v* tags).
on:
  push:
    tags:
      - 'lite-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin --bundles app'
    runs-on: ${{ matrix.platform }}
    env:
      # linuxdeploy's bundled strip exits on .relr.dyn in current webkit2gtk, and
      # Tauri reports only "failed to run linuxdeploy". Extract-and-run starts
      # that AppImage when the runner has no FUSE mount.
      NO_STRIP: 'true'
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: lite/src-tauri -> target
      - name: Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          # Flash Player is linked to GTK 2. linuxdeploy aborts the AppImage when that library is missing.
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk2.0-0
      - name: Unpack pinned players
        if: matrix.platform != 'windows-latest'
        run: bash lite/scripts/fetch-players.sh
      - name: Unpack pinned players
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: ./lite/scripts/fetch-players.ps1
      - name: Build and publish release (tag push)
        if: startsWith(github.ref, 'refs/tags/lite-v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: lite
          tauriScript: npx -y @tauri-apps/cli@2
          tagName: ${{ github.ref_name }}
          releaseName: 'AquaStar Lite v__VERSION__ - Pre-release'
          releaseDraft: false
          # Create the release as a prerelease. A later matrix leg updates that
          # release without resending this flag; keep-prerelease reasserts it.
          prerelease: true
          args: ${{ matrix.args }}
      # Manual runs only build and upload workflow artifacts, so the bundles can be
      # tested before tagging. They never create or touch a release.
      - name: Build only (manual run)
        if: "!startsWith(github.ref, 'refs/tags/lite-v')"
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: lite
          tauriScript: npx -y @tauri-apps/cli@2
          args: ${{ matrix.args }}
      - name: Sign nested apps and seal the DMG
        if: matrix.platform == 'macos-latest'
        run: bash lite/scripts/finish-macos-app.sh
      - name: Attach macOS disk image to the pre-release
        if: matrix.platform == 'macos-latest' && startsWith(github.ref, 'refs/tags/lite-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dmg=$(find lite/src-tauri/target -path '*/release/bundle/dmg/*.dmg' -type f | head -n 1)
          if [[ -z "$dmg" ]]; then
            echo "no disk image under lite/src-tauri/target" >&2
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber "$dmg"
      - name: Package Windows portable
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $ver = (Get-Content -Raw lite/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ($ver -notmatch '^[0-9A-Za-z][0-9A-Za-z._+-]*$') { throw "tauri.conf.json version is not a single path segment: $ver" }
          $exe = "lite/src-tauri/target/release/aquastar-lite.exe"
          if (-not (Test-Path $exe)) { throw "missing $exe" }
          $stage = Join-Path $env:RUNNER_TEMP "aquastar-lite-portable"
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item $exe (Join-Path $stage "aquastar-lite.exe")
          Set-Content -Encoding ascii -Path (Join-Path $stage "portable.txt") -Value "AquaStar Lite stores its data in the data folder next to this file.`r`n"
          $players = "lite/src-tauri/players"
          if (-not (Test-Path $players)) { throw "missing $players" }
          Copy-Item -Recurse $players (Join-Path $stage "players")
          $zip = "lite/src-tauri/target/release/AquaStar.Lite_${ver}_x64-portable.zip"
          if (Test-Path $zip) { Remove-Item -Force $zip }
          tar.exe -a -cf $zip -C $stage aquastar-lite.exe portable.txt players
      - name: Attach portable zip to the pre-release
        if: matrix.platform == 'windows-latest' && startsWith(github.ref, 'refs/tags/lite-v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ver = (Get-Content -Raw lite/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          gh release upload "$env:GITHUB_REF_NAME" --repo "$env:GITHUB_REPOSITORY" --clobber `
            "lite/src-tauri/target/release/AquaStar.Lite_${ver}_x64-portable.zip"
      - name: Upload portable zip (manual run)
        if: matrix.platform == 'windows-latest' && !startsWith(github.ref, 'refs/tags/lite-v')
        uses: actions/upload-artifact@v4
        with:
          name: aquastar-lite-windows-portable
          path: lite/src-tauri/target/release/AquaStar.Lite_*_x64-portable.zip
          if-no-files-found: error
      - name: Upload bundles (manual run)
        if: "!startsWith(github.ref, 'refs/tags/lite-v')"
        uses: actions/upload-artifact@v4
        with:
          name: aquastar-lite-${{ matrix.platform }}
          path: |
            lite/src-tauri/target/**/release/bundle/appimage/*.AppImage
            lite/src-tauri/target/**/release/bundle/deb/*.deb
            lite/src-tauri/target/**/release/bundle/nsis/*.exe
            lite/src-tauri/target/**/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # Lite stays a prerelease and is never Latest. tauri-action has no make_latest
  # input, and its update of an existing release does not send prerelease, so
  # set both after every platform has uploaded.
  keep-prerelease:
    needs: build
    if: startsWith(github.ref, 'refs/tags/lite-v')
    runs-on: ubuntu-latest
    steps:
      - name: Mark Lite release as prerelease and not latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --prerelease --latest=false

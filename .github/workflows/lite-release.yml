name: AquaStar Lite Release

# Builds the Tauri app in lite/. Triggered only by lite-v* tags, so it never
# collides with the Electron release workflow (release.yml, v* tags).
on:
  push:
    tags:
      - 'lite-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: lite/src-tauri -> target
      - name: Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Build and publish release (tag push)
        if: startsWith(github.ref, 'refs/tags/lite-v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: lite
          tauriScript: npx -y @tauri-apps/cli@2
          tagName: ${{ github.ref_name }}
          releaseName: 'AquaStar Lite v__VERSION__ - Pre-release'
          releaseDraft: false
          prerelease: true
          args: ${{ matrix.args }}
      # Manual runs only build and upload workflow artifacts, so the bundles can be
      # tested before tagging. They never create or touch a release.
      - name: Build only (manual run)
        if: "!startsWith(github.ref, 'refs/tags/lite-v')"
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: lite
          tauriScript: npx -y @tauri-apps/cli@2
          args: ${{ matrix.args }}
      - name: Upload bundles (manual run)
        if: "!startsWith(github.ref, 'refs/tags/lite-v')"
        uses: actions/upload-artifact@v4
        with:
          name: aquastar-lite-${{ matrix.platform }}
          path: |
            lite/src-tauri/target/**/release/bundle/appimage/*.AppImage
            lite/src-tauri/target/**/release/bundle/deb/*.deb
            lite/src-tauri/target/**/release/bundle/nsis/*.exe
            lite/src-tauri/target/**/release/bundle/dmg/*.dmg
          if-no-files-found: error

[package]
name = "aquastar-lite"
version = "3.0.0-alpha.3"
edition = "2021"
description = "AquaStar launcher"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
tauri-plugin-single-instance = "2.4.5"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
panic = "abort"
strip = true
lto = true
codegen-units = 1
opt-level = "s"

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Injection demo</title>
<link rel="stylesheet" href="../../../../res/features/common/focus.css">
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; padding: 24px; background: #121212; color: #e6e6e6;
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; font-size: 14px;
  }
  h1 { font-size: 18px; margin: 0 0 8px; }
  p { color: #9a9a9a; line-height: 1.45; max-width: 40rem; }
  #inject-status {
    margin-top: 16px; padding: 12px 14px; border-radius: 8px;
    border: 1px solid #333; background: #1b1b1b; color: #e6c07b;
  }
  #inject-status.ok { color: #7fd08a; border-color: #2f5d3a; }
  code { color: #cfcfcf; }
</style>
</head>
<body>
  <h1 id="heading">Injection demo page</h1>
  <p id="body">Loading…</p>
  <div id="inject-status">Waiting for navigation hook…</div>
<script>
(function () {
  // Filled by the plugin navigation hook with localized strings.
  window.__aquastarInjectDemoApply = function (msg) {
    msg = msg || {};
    if (msg.title) document.title = msg.title;
    if (msg.heading) document.getElementById('heading').textContent = msg.heading;
    if (msg.body) document.getElementById('body').textContent = msg.body;
    var status = document.getElementById('inject-status');
    if (msg.waiting && status && !status.classList.contains('ok')) {
      status.textContent = msg.waiting;
    }
  };
})();
</script>
</body>
</html>

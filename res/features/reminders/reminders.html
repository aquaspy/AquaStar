<!DOCTYPE html>
<html style="margin:0;padding:0;width:100%;height:100%;">
<head>
<meta charset="UTF-8">
<title>AquaStar - Reminders</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #121212; color: #e6e6e6;
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    font-size: 13px;
  }
  #app { display: flex; flex-direction: column; height: 100%; box-sizing: border-box; }

  header { padding: 14px 18px 8px 18px; border-bottom: 1px solid #2c2c2c; flex: 0 0 auto; }
  .header-row { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
  header h1 { margin: 0 0 4px 0; font-size: 16px; }
  header p#description { margin: 0; color: #9a9a9a; line-height: 1.4; }
  #serverTime { flex:0 0 auto; font-size:12px; color:#9cc9ff; white-space:nowrap; font-family:"Consolas","Courier New",monospace; padding-top:2px; text-align:right; }
  #serverTime .label { display:block; color:#6f6f6f; font-family:inherit; font-size:10px; text-transform:uppercase; letter-spacing:.03em; }
  #nextFriday13Row { margin-top:6px; color:#e0a3f0; }

  #workspaceBar { display:flex; align-items:center; gap:12px; padding:10px 18px 0; border-bottom:1px solid #2c2c2c; flex:0 0 auto; }
  #tabs { display:flex; align-items:center; gap:6px; flex:1 1 auto; min-width:0; flex-wrap:wrap; }
  .workspace-actions { flex:0 0 auto; padding-bottom:10px; }
  .tab { background:#1b1b1b; border:1px solid #333; border-radius:4px 4px 0 0; padding:6px 10px; color:#9a9a9a; font-size:12px; display:flex; align-items:center; gap:6px; cursor:pointer; }
  .tab.active { background:#232323; color:#e6e6e6; border-color:#4da3ff; }
  .tab .tabBtn { color:#6f6f6f; cursor:pointer; padding:0 2px; font-size:11px; }
  .tab .tabBtn:hover { color:#e6e6e6; }
  .tabAddBtn { background:transparent; border:1px dashed #383838; color:#9a9a9a; }
  .tabAddBtn:hover { color:#e6e6e6; border-color:#4da3ff; }

  #rows { flex: 1 1 auto; overflow-y: auto; padding: 4px 18px; }
  .quest-row { display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid #202020; border-radius:4px; }
  .quest-row.done { background: rgba(127,208,138,0.08); }
  .quest-row.dragging { opacity:0.4; }
  .quest-row.drag-over { border-top:2px solid #4da3ff; }
  .quest-row .drag-handle { flex:0 0 auto; color:#6f6f6f; cursor:grab; padding:0 2px; user-select:none; font-size:13px; }
  .quest-row .drag-handle:active { cursor:grabbing; }
  .quest-row .qname { flex:1 1 160px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .quest-row .qname.member { color:#ffd76a; }
  .quest-row .qtype { flex:0 0 62px; font-size:11px; color:#6f6f6f; text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .quest-row .qcategory {
    flex:0 0 92px; font-size:10px; padding:2px 7px; border-radius:10px;
    text-transform:uppercase; white-space:nowrap; letter-spacing:.02em;
    text-align:center; overflow:hidden; text-overflow:ellipsis; box-sizing:border-box;
  }
  .qcategory.class { background:rgba(147,112,219,0.18); color:#c3aaf0; }
  .qcategory.ultra { background:rgba(230,126,34,0.18); color:#f5a45d; }
  .qcategory.other { background:rgba(154,154,154,0.18); color:#b0b0b0; }
  .quest-row .qseasonal {
    flex:0 0 40px; font-size:10px; padding:2px 4px; border-radius:10px;
    text-transform:uppercase; white-space:nowrap; letter-spacing:.02em;
    text-align:center; box-sizing:border-box;
  }
  .qseasonal.active { background:rgba(255,182,193,0.18); color:#ffb6c1; }
  .quest-row .qjoin {
    flex:0 0 190px; font-family:"Consolas","Courier New",monospace;
    background:#1b1b1b; border:1px solid #333; border-radius:4px;
    padding:5px 8px; color:#dcdcdc; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .quest-row .qtime { flex:0 0 70px; font-size:12px; color:#9cc9ff; text-align:right; }

  .icon-btn { display:inline-flex; align-items:center; justify-content:center; padding:5px 7px; line-height:0; }

  #archiveSection, #seasonalSection { flex:0 0 auto; border-top:1px solid #2c2c2c; }
  #archiveSection.hidden, #seasonalSection.hidden { display:none; }
  .archive-toggle { cursor:pointer; padding:8px 18px; color:#9a9a9a; font-size:12px; user-select:none; }
  .archive-toggle:hover { color:#e6e6e6; }
  /* Padding lives on the scrolling element itself (like #rows does), not a non-scrolling
     wrapper around it - otherwise the scrollbar renders inset from the window edge instead
     of flush with #rows's scrollbar above it. */
  #archiveRows, #seasonalRows { max-height:180px; overflow-y:auto; padding:0 18px; box-sizing:border-box; }
  #archiveRows .quest-row { opacity:0.7; }

  .form-checkbox { display:flex; align-items:center; gap:5px; font-size:12px; color:#9a9a9a; white-space:nowrap; }
  .form-checkbox input { cursor:pointer; }

  .text-input { flex:0 0 190px; font-family:inherit; background:#1b1b1b; border:1px solid #333; border-radius:4px; padding:5px 8px; color:#dcdcdc; }
  .text-input:focus { outline:none; border-color:#4da3ff; }
  .select-input { flex:0 0 100px; font-family:inherit; background:#1b1b1b; border:1px solid #333; border-radius:4px; padding:5px 8px; color:#dcdcdc; cursor:pointer; }
  .select-input:focus { outline:none; border-color:#4da3ff; }

  .switch { position:relative; display:inline-block; flex:0 0 38px; width:38px; height:22px; }
  .switch input { position:absolute; opacity:0; width:0; height:0; }
  .switch .slider { position:absolute; top:0; left:0; right:0; bottom:0; background:#1b1b1b; border:1px solid #383838; border-radius:22px; cursor:pointer; transition:background-color .15s, border-color .15s; }
  .switch .slider::before { content:""; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:#9a9a9a; transition:transform .15s, background-color .15s; }
  .switch input:checked + .slider { background:#2b6fce; border-color:#2b6fce; }
  .switch input:checked + .slider::before { transform:translateX(16px); background:#fff; }
  .switch input:focus-visible + .slider { outline: 2px solid #4da3ff; outline-offset: 2px; }

  button { background:#232323; color:#e6e6e6; border:1px solid #383838; border-radius:4px; padding:6px 12px; cursor:pointer; font-size:12px; }
  button:hover { background:#2c2c2c; }
  button:active { background:#1a1a1a; }
  button.small { padding:5px 10px; font-size:11px; }
  button.primary { background:#2b6fce; border-color:#2b6fce; color:#fff; }
  button.primary:hover { background:#3a7fe0; }

  footer { flex:0 0 auto; padding:8px 18px 12px 18px; border-top:1px solid #2c2c2c; }
  #status { min-height:15px; color:#7fd08a; font-size:12px; }
  #noCharsHint { color:#6f6f6f; padding:20px 0; }

  #toolbar { display:flex; align-items:center; gap:14px; padding:8px 18px; flex:0 0 auto; flex-wrap:wrap; row-gap:6px; background:#161616; border-bottom:1px solid #2c2c2c; }
  .toolbar-option { display:flex; align-items:center; gap:6px; }
  .toolbar-label { font-size:12px; color:#9a9a9a; }

  #filterBar { display:flex; gap:8px; align-items:center; padding:8px 18px; border-bottom:1px solid #2c2c2c; flex:0 0 auto; flex-wrap:wrap; }
  #filterBar .text-input { flex:1 1 200px; }
  #filterBar .select-input { flex:0 0 130px; }

  /* Electron does not implement window.prompt() (it silently resolves to null with no
     UI shown) - alert()/confirm() map to native dialogs and work fine, but text-entry
     prompts need this hand-rolled modal instead. */
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.55); display:none; align-items:center; justify-content:center; z-index:1000; }
  .modal-overlay.open { display:flex; }
  .modal-box { background:#1b1b1b; border:1px solid #333; border-radius:6px; padding:16px; width:260px; display:flex; flex-direction:column; gap:10px; box-shadow:0 18px 48px rgba(0,0,0,.35); }
  .modal-box.wide { width:min(520px, calc(100vw - 36px)); max-height:calc(100vh - 36px); overflow-y:auto; }
  .modal-box .modal-label { font-size:12px; color:#e6e6e6; }
  .modal-box .text-input { flex:0 0 auto; width:100%; box-sizing:border-box; }
  .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .form-grid .full { grid-column:1 / -1; }
  .form-grid .select-input { width:100%; box-sizing:border-box; }
  .modal-toggle-row { display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .modal-buttons { display:flex; justify-content:flex-end; gap:8px; }
</style>
<link rel="stylesheet" href="../common/focus.css">
</head>
<body>
<div id="app">
  <header>
    <div class="header-row">
      <div>
        <h1 id="heading">Reminders</h1>
        <p id="description"></p>
      </div>
      <div id="serverTime">
        <span class="label" id="serverTimeLabel"></span><span id="serverTimeValue"></span>
        <div id="nextFriday13Row"><span class="label" id="nextFriday13Label"></span><span id="nextFriday13Value"></span></div>
      </div>
    </div>
  </header>
  <div id="workspaceBar">
    <div id="tabs"></div>
    <div class="workspace-actions"><button id="openAddQuestBtn" class="primary small"></button></div>
  </div>
  <div id="toolbar">
    <label class="toolbar-option">
      <span class="switch">
      <input type="checkbox" id="showCompletedToggle">
      <span class="slider"></span>
      </span>
    <span id="showCompletedLabel" class="toolbar-label"></span>
    </label>
    <label class="toolbar-option">
      <span class="switch">
      <input type="checkbox" id="showMemberDailiesToggle">
      <span class="slider"></span>
      </span>
    <span id="showMemberDailiesLabel" class="toolbar-label"></span>
    </label>
    <label class="toolbar-option">
      <span class="switch">
      <input type="checkbox" id="individualHiddenToggle">
      <span class="slider"></span>
      </span>
    <span id="individualHiddenLabel" class="toolbar-label"></span>
    </label>
  </div>
  <div id="filterBar">
    <input id="filterNameInput" class="text-input" type="text" spellcheck="false">
    <select id="filterTypeInput" class="select-input">
      <option value="all"></option>
      <option value="daily"></option>
      <option value="weekly"></option>
      <option value="monthly"></option>
    </select>
    <select id="filterCategoryInput" class="select-input">
      <option value="all"></option>
      <option value="class"></option>
      <option value="ultra"></option>
      <option value="other"></option>
    </select>
  </div>
  <div id="addQuestOverlay" class="modal-overlay">
    <div class="modal-box wide">
      <div id="addQuestTitle" class="modal-label"></div>
      <div id="addQuestForm" class="form-grid">
    <input id="questNameInput" class="text-input" type="text" spellcheck="false">
    <input id="questJoinInput" class="text-input" type="text" spellcheck="false">
    <select id="questTypeInput" class="select-input">
      <option value="daily"></option>
      <option value="weekly"></option>
      <option value="monthly"></option>
    </select>
    <select id="questCategoryInput" class="select-input">
      <option value="class"></option>
      <option value="ultra"></option>
      <option value="other"></option>
    </select>
    <div class="modal-toggle-row full">
    <label class="form-checkbox">
      <input type="checkbox" id="questMemberInput">
      <span id="questMemberLabel"></span>
    </label>
    <label class="form-checkbox">
      <input type="checkbox" id="questSeasonalInput">
      <span id="questSeasonalLabel"></span>
    </label>
    </div>
    <select id="questSeasonalEventInput" class="select-input" disabled>
      <option value="nulgathBirthday"></option>
      <option value="carnival"></option>
      <option value="dageBirthday"></option>
      <option value="aprilFools"></option>
      <option value="mayThe4th"></option>
      <option value="starFestival"></option>
      <option value="kalaSeason"></option>
      <option value="friday13"></option>
      <option value="pirateDay"></option>
      <option value="anniversary"></option>
      <option value="blackFriday"></option>
      <option value="frostval"></option>
    </select>
      </div>
      <div class="modal-buttons">
        <button id="cancelAddQuestBtn" class="small"></button>
        <button id="addQuestBtn" class="primary small"></button>
      </div>
    </div>
  </div>
  <div id="rows"></div>
  <div id="seasonalSection" class="hidden">
    <div id="seasonalToggle" class="archive-toggle"></div>
    <div id="seasonalRows" style="display:none;"></div>
  </div>
  <div id="archiveSection" class="hidden">
    <div id="archiveToggle" class="archive-toggle"></div>
    <div id="archiveRows" style="display:none;"></div>
  </div>
  <footer><span id="status"></span></footer>
</div>

<div id="promptOverlay" class="modal-overlay">
  <div class="modal-box">
    <div id="promptLabel" class="modal-label"></div>
    <input id="promptInput" class="text-input" type="text" spellcheck="false">
    <div class="modal-buttons">
      <button id="promptCancelBtn" class="small"></button>
      <button id="promptOkBtn" class="primary small"></button>
    </div>
  </div>
</div>

<div id="baseCharOverlay" class="modal-overlay">
  <div class="modal-box">
    <div id="baseCharLabel" class="modal-label"></div>
    <select id="baseCharSelect" class="select-input" style="flex:0 0 auto; width:100%; box-sizing:border-box;"></select>
    <div class="modal-buttons">
      <button id="baseCharCancelBtn" class="small"></button>
      <button id="baseCharOkBtn" class="primary small"></button>
    </div>
  </div>
</div>

<script src="../../core/list-state.js"></script>
<script src="../../core/reset-time.js"></script>
<script src="../../ui/workspace/modals.js"></script>
<script src="../../ui/workspace/character-tabs.js"></script>
<script src="../common/list_window_common.js"></script>
<script>
(function () {
  const api = window.aquastarReminders;
  const Common = window.ListWindowCommon;
  let messages, state, activeCharId = null;
  let draggedQuestId = null;
  let archiveExpanded = false;
  let seasonalExpanded = false;
  // Filter bar state - transient/in-memory only (not persisted to disk), same as any
  // search box: it resets to "show everything" the next time the window is opened.
  let filterName = '';
  let filterType = 'all';
  let filterCategory = 'all';

  // Plain inline SVGs (not emoji) so the copy button's icon renders identically across
  // platforms/fonts - swapped to a checkmark briefly after a successful copy.
  const COPY_ICON = '<svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="5.5" y="5.5" width="8.5" height="8.5" rx="1.3"/><path d="M3.3 10.2H2.7A1.2 1.2 0 0 1 1.5 9V2.7A1.2 1.2 0 0 1 2.7 1.5H9a1.2 1.2 0 0 1 1.2 1.2v.6"/></svg>';
  const CHECK_ICON = '<svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3 3 7-7"/></svg>';

  // Date/reset math, seasonal keys, hidden-map helpers, drag-reorder and the modal helpers
  // all live in list_window_common.js now, shared with the To-Do window - see that file for
  // the DST-aware implementation details.
  function genId(prefix) { return Common.genId(prefix); }

  function isDoneForCurrentPeriod(quest, lastDoneMs, now) {
    if (!lastDoneMs) return false;
    const periodStart = quest.type === 'weekly' ? Common.getPreviousWeeklyReset(now)
      : quest.type === 'monthly' ? Common.getPreviousMonthlyReset(now)
      : Common.getPreviousDailyReset(now);
    return lastDoneMs >= periodStart.getTime();
  }

  // --- UI ---

  function showPromptModal(labelText, defaultValue) {
    return Common.showPromptModal(messages, labelText, defaultValue);
  }

  // Shown when switching the hidden-list mode from individual back to shared - the user
  // picks which character's current hidden set becomes the new shared one for everybody.
  function showBaseCharacterModal() {
    return Common.showChoiceModal(messages, messages.baseCharacterPrompt,
      state.characters.map((c) => ({ id: c.id, label: c.name })));
  }

  function setStatus(text) { document.getElementById('status').textContent = text || ''; }

  function persistState() {
    setStatus(messages.savingLabel);
    api.saveReminders(state).then(() => setStatus(messages.savedLabel));
  }

  let characterTabs;
  function renderTabs() {
    if (!characterTabs) {
      characterTabs = window.AquaStarWorkspace.createCharacterTabs({
        tabsElement: document.getElementById('tabs'),
        messages: messages,
        characters: () => state.characters,
        activeId: () => activeCharId,
        setActiveId: (id) => { activeCharId = id; },
        genId: genId,
        prompt: showPromptModal,
        beforeRemove: (character) => {
          state.characters = Common.removeCharacter(state.characters, state.quests, character.id,
            (quest, id) => { if (quest && quest.done) delete quest.done[id]; });
        },
        onActiveChanged: renderQuestRows,
        onChanged: () => { persistState(); renderQuestRows(); }
      });
    }
    characterTabs.render();
  }

  function isDoneNow(quest) {
    return isDoneForCurrentPeriod(quest, quest.done[activeCharId], new Date());
  }

  // Hidden state is a map (quest.hiddenBy), same shape as `done` - either shared across every
  // character (the historical/default behavior) or tracked separately per character
  // (state.individualHiddenMode), depending on the toolbar toggle. Map mechanics live in
  // list_window_common.js (shared with the To-Do window's "completed" state).
  function isQuestHidden(quest) {
    return Common.isItemHidden(quest, state.individualHiddenMode, activeCharId);
  }
  function setQuestHidden(quest, value) {
    Common.setItemHidden(quest, value, state.individualHiddenMode, activeCharId);
  }

  const CATEGORY_KEYS = ['class', 'ultra', 'other'];
  function categoryKeyOf(quest) {
    return CATEGORY_KEYS.indexOf(quest.category) !== -1 ? quest.category : 'other';
  }
  function categoryLabelOf(quest) {
    const key = categoryKeyOf(quest);
    if (key === 'class') return messages.categoryClassLabel;
    if (key === 'ultra') return messages.categoryUltraLabel;
    return messages.categoryOtherLabel;
  }

  function matchesFilters(quest) {
    if (filterName && quest.name.toLowerCase().indexOf(filterName) === -1) return false;
    if (filterType !== 'all' && quest.type !== filterType) return false;
    if (filterCategory !== 'all' && categoryKeyOf(quest) !== filterCategory) return false;
    return true;
  }

  // Seasonal is a separate, orthogonal tag from category (class/ultra/other) - a quest can
  // be both (e.g. a seasonal ultra boss (iara)) or seasonal on its own. Event keys/labels
  // live in list_window_common.js, shared with the To-Do window.
  const SEASONAL_EVENT_KEYS = Common.SEASONAL_EVENT_KEYS;
  function isSeasonal(quest) {
    return Common.isSeasonal(quest);
  }
  function seasonalShortOf(quest) {
    return (messages.seasonalEvents[quest.seasonalEvent] || {}).short || '';
  }
  function seasonalLabelOf(quest) {
    return (messages.seasonalEvents[quest.seasonalEvent] || {}).label || '';
  }

  // Member is a simple orthogonal boolean tag (unlike seasonal, it has no sub-type) -
  // flags quests that need an active membership to access.
  function isMember(quest) {
    return !!quest.member;
  }

  // "Next Friday the 13th" shown near Server Time - deliberately does NOT check whether
  // the 13th has already passed this month, per design: if the current calendar month
  // contains a Friday the 13th at all, it counts as "This Month".
  function getNextFriday13Text(now) {
    return Common.getNextFriday13Text(now, messages);
  }

  function nextResetText(quest) {
    const now = new Date();
    const nextReset = quest.type === 'weekly' ? Common.getNextWeeklyReset(now)
      : quest.type === 'monthly' ? Common.getNextMonthlyReset(now)
      : Common.getNextDailyReset(now);
    return Common.formatTimeRemaining(nextReset.getTime() - now.getTime());
  }

  function typeLabelOf(quest) {
    if (quest.type === 'weekly') return messages.weeklyLabel;
    if (quest.type === 'monthly') return messages.monthlyLabel;
    return messages.dailyLabel;
  }

  // Reorders within whichever section (main / seasonal / hidden) the dragged quest belongs
  // to - dragging across sections is a no-op since each renders as its own separate list.
  // Quests outside that section keep their original relative position in state.quests.
  function questSectionOf(quest) {
    if (isQuestHidden(quest)) return 'hidden';
    if (isSeasonal(quest)) return 'seasonal';
    return 'main';
  }
  function reorderQuest(draggedId, targetId) {
    const reordered = Common.reorderInSection(state.quests, draggedId, targetId, questSectionOf);
    if (reordered === state.quests) return; // no-op: same id, not found, or cross-section drag
    state.quests = reordered;
    persistState();
    renderQuestRows();
  }

  // opts.archived controls the Hide/Unhide button label; opts.draggable controls whether
  // the row gets a drag handle - kept separate since the Seasonal section shows normal
  // (non-hidden) rows that still shouldn't be reorderable there.
  function buildQuestRow(quest, opts) {
    opts = opts || {};
    const row = document.createElement('div');
    row.className = 'quest-row' + (isDoneNow(quest) ? ' done' : '');

    if (opts.draggable) {
      const handle = document.createElement('span');
      handle.className = 'drag-handle';
      handle.draggable = true;
      handle.title = messages.dragHandleTitle;
      handle.textContent = '⠿'; // braille all-dots glyph, reads as a plain 2x3 grip icon
      row.appendChild(handle);

      row.addEventListener('dragstart', () => {
        draggedQuestId = quest.id;
        row.classList.add('dragging');
      });
      row.addEventListener('dragend', () => {
        row.classList.remove('dragging');
        document.querySelectorAll('.quest-row.drag-over').forEach((el) => el.classList.remove('drag-over'));
        draggedQuestId = null;
      });
      row.addEventListener('dragover', (e) => {
        if (!draggedQuestId || draggedQuestId === quest.id) return;
        e.preventDefault();
        row.classList.add('drag-over');
      });
      row.addEventListener('dragleave', () => { row.classList.remove('drag-over'); });
      row.addEventListener('drop', (e) => {
        e.preventDefault();
        row.classList.remove('drag-over');
        if (draggedQuestId && draggedQuestId !== quest.id) reorderQuest(draggedQuestId, quest.id);
      });
    }

    // Member has no dedicated column - it's a rare tag (most quests aren't member-only),
    // so reserving fixed-width space for it on every row wasted horizontal space. Instead
    // it's a star prefix + gold color on the name itself, costing nothing when absent.
    const nameEl = document.createElement('div');
    nameEl.className = 'qname' + (isMember(quest) ? ' member' : '');
    nameEl.textContent = (isMember(quest) ? messages.memberBadgeShort + ' ' : '') + quest.name;
    nameEl.title = quest.name + (isMember(quest) ? ' - ' + messages.memberBadgeTitle : '');

    const typeEl = document.createElement('div');
    typeEl.className = 'qtype';
    typeEl.textContent = typeLabelOf(quest);

    const categoryEl = document.createElement('div');
    categoryEl.className = 'qcategory ' + categoryKeyOf(quest);
    categoryEl.textContent = categoryLabelOf(quest);

    // Always rendered (fixed width) even when not seasonal, so every row's columns after
    // this one stay aligned regardless of which quests happen to be seasonal.
    const seasonalEl = document.createElement('div');
    seasonalEl.className = 'qseasonal' + (isSeasonal(quest) ? ' active' : '');
    if (isSeasonal(quest)) {
      seasonalEl.textContent = seasonalShortOf(quest);
      seasonalEl.title = seasonalLabelOf(quest);
    }

    const joinEl = document.createElement('div');
    joinEl.className = 'qjoin';
    joinEl.textContent = quest.joinCommand;
    joinEl.title = quest.joinCommand;

    const copyBtn = document.createElement('button');
    copyBtn.className = 'small icon-btn';
    copyBtn.innerHTML = COPY_ICON;
    copyBtn.title = messages.copyButton;
    copyBtn.onclick = () => {
      api.copyText(quest.joinCommand);
      copyBtn.innerHTML = CHECK_ICON;
      copyBtn.title = messages.copiedLabel;
      setTimeout(() => { copyBtn.innerHTML = COPY_ICON; copyBtn.title = messages.copyButton; }, 1200);
    };

    const switchLabel = document.createElement('label');
    switchLabel.className = 'switch';
    const checkboxEl = document.createElement('input');
    checkboxEl.type = 'checkbox';
    checkboxEl.checked = isDoneNow(quest);
    const sliderEl = document.createElement('span');
    sliderEl.className = 'slider';
    switchLabel.appendChild(checkboxEl);
    switchLabel.appendChild(sliderEl);

    const timeEl = document.createElement('div');
    timeEl.className = 'qtime';
    timeEl.textContent = nextResetText(quest);

    checkboxEl.addEventListener('change', () => {
      if (checkboxEl.checked) quest.done[activeCharId] = Date.now();
      else delete quest.done[activeCharId];
      persistState();
      renderQuestRows();
    });

    const hideBtn = document.createElement('button');
    hideBtn.className = 'small';
    hideBtn.textContent = opts.archived ? messages.unhideButton : messages.hideButton;
    hideBtn.onclick = () => {
      setQuestHidden(quest, !opts.archived);
      persistState();
      renderQuestRows();
    };

    const deleteBtn = document.createElement('button');
    deleteBtn.className = 'small';
    deleteBtn.textContent = messages.deleteButton;
    deleteBtn.onclick = () => {
      if (!window.confirm(messages.confirmDeleteQuest)) return;
      state.quests = state.quests.filter((q) => q.id !== quest.id);
      persistState();
      renderQuestRows();
    };

    row.appendChild(nameEl);
    row.appendChild(typeEl);
    row.appendChild(categoryEl);
    row.appendChild(seasonalEl);
    row.appendChild(joinEl);
    row.appendChild(copyBtn);
    row.appendChild(switchLabel);
    row.appendChild(timeEl);
    row.appendChild(hideBtn);
    row.appendChild(deleteBtn);

    return row;
  }

  function renderArchiveSection(hiddenQuests) {
    const wrapEl = document.getElementById('archiveSection');
    const toggleEl = document.getElementById('archiveToggle');
    const rowsEl = document.getElementById('archiveRows');

    if (!activeCharId || hiddenQuests.length === 0) {
      wrapEl.classList.add('hidden');
      return;
    }
    wrapEl.classList.remove('hidden');
    toggleEl.textContent = (archiveExpanded ? '▾ ' : '▸ ') + messages.archiveToggleLabel + ' (' + hiddenQuests.length + ')';
    rowsEl.style.display = archiveExpanded ? '' : 'none';
    rowsEl.innerHTML = '';
    if (archiveExpanded) {
      hiddenQuests.forEach((quest) => rowsEl.appendChild(buildQuestRow(quest, { archived: true, draggable: false })));
    }
  }

  function renderSeasonalSection(seasonalQuests) {
    const wrapEl = document.getElementById('seasonalSection');
    const toggleEl = document.getElementById('seasonalToggle');
    const rowsEl = document.getElementById('seasonalRows');

    if (!activeCharId || seasonalQuests.length === 0) {
      wrapEl.classList.add('hidden');
      return;
    }
    wrapEl.classList.remove('hidden');
    toggleEl.textContent = (seasonalExpanded ? '▾ ' : '▸ ') + messages.seasonalSectionLabel + ' (' + seasonalQuests.length + ')';
    rowsEl.style.display = seasonalExpanded ? '' : 'none';
    rowsEl.innerHTML = '';
    if (seasonalExpanded) {
      // Same done-last sort/tint as the main list, but never filtered out by "Show completed" -
      // seasonal quests are occasional check-ins, not something you want to disappear once done.
      // Draggable, same as the main list - reorderQuest() only reorders within this section.
      seasonalQuests.slice()
        .sort((a, b) => (isDoneNow(a) ? 1 : 0) - (isDoneNow(b) ? 1 : 0))
        .forEach((quest) => rowsEl.appendChild(buildQuestRow(quest, { archived: false, draggable: true })));
    }
  }

  function renderQuestRows() {
    const rowsEl = document.getElementById('rows');
    rowsEl.innerHTML = '';
    if (!activeCharId) {
      const hint = document.createElement('div');
      hint.id = 'noCharsHint';
      hint.textContent = messages.noCharactersHint;
      rowsEl.appendChild(hint);
      renderSeasonalSection([]);
      renderArchiveSection([]);
      return;
    }
    // Hidden quests are pulled out first (regardless of seasonal), then the name/type/category
    // filter bar and member-dailies toggle narrow the rest, then seasonal quests get their own
    // section, so a quest lands in exactly one of: main list / Seasonal / Hidden.
    const filteredQuests = state.quests.filter((q) => matchesFilters(q));
    const nonHidden = filteredQuests.filter((q) => !isQuestHidden(q));
    const memberFiltered = state.showMemberDailies
      ? nonHidden
      : nonHidden.filter((q) => !q.member);
    const seasonalQuests = memberFiltered.filter((q) => isSeasonal(q));
    let visibleQuests = memberFiltered.filter((q) => !isSeasonal(q));
    if (state.showCompleted) {
      // Not-done quests first, done ones sink to the bottom - purely a display-time sort,
      // the underlying state.quests order (which drag-and-drop reordering controls) is untouched.
      visibleQuests = visibleQuests.slice().sort((a, b) => (isDoneNow(a) ? 1 : 0) - (isDoneNow(b) ? 1 : 0));
    } else {
      visibleQuests = visibleQuests.filter((q) => !isDoneNow(q));
    }
    visibleQuests.forEach((quest) => rowsEl.appendChild(buildQuestRow(quest, { archived: false, draggable: true })));

    renderSeasonalSection(seasonalQuests);
    renderArchiveSection(filteredQuests.filter((q) => isQuestHidden(q)));
  }

  function tick() {
    if (activeCharId) renderQuestRows();
  }

  async function init() {
    const [msgs, remindersResult] = await Promise.all([api.getMessages(), api.getReminders()]);
    messages = msgs;
    state = remindersResult.data;
    if (state.showCompleted === undefined) state.showCompleted = true;
    if (state.showMemberDailies === undefined) state.showMemberDailies = true;
    if (state.individualHiddenMode === undefined) state.individualHiddenMode = false;

    document.title = messages.title;
    document.getElementById('heading').textContent = messages.heading;
    document.getElementById('description').textContent = messages.description;
    document.getElementById('showCompletedLabel').textContent = messages.showCompletedLabel;
    const showCompletedToggle = document.getElementById('showCompletedToggle');
    showCompletedToggle.checked = state.showCompleted;
    showCompletedToggle.addEventListener('change', () => {
      state.showCompleted = showCompletedToggle.checked;
      persistState();
      renderQuestRows();
    });
    document.getElementById('showMemberDailiesLabel').textContent = messages.showMemberDailiesLabel;
    const showMemberDailiesToggle = document.getElementById('showMemberDailiesToggle');
    showMemberDailiesToggle.checked = state.showMemberDailies;
    showMemberDailiesToggle.addEventListener('change', () => {
      state.showMemberDailies = showMemberDailiesToggle.checked;
      persistState();
      renderQuestRows();
    });
    document.getElementById('individualHiddenLabel').textContent = messages.individualHiddenLabel;
    const individualHiddenToggle = document.getElementById('individualHiddenToggle');
    individualHiddenToggle.checked = state.individualHiddenMode;
    individualHiddenToggle.addEventListener('change', async () => {
      const turningOn = individualHiddenToggle.checked;
      if (turningOn) {
        // Shared -> Individual: every character starts out identical to the current shared
        // state, then diverges independently from here on.
        state.quests.forEach((q) => {
          if (!q.hiddenBy) q.hiddenBy = {};
          const sharedVal = !!q.hiddenBy[Common.SHARED_HIDDEN_KEY];
          state.characters.forEach((c) => { q.hiddenBy[c.id] = sharedVal; });
        });
        state.individualHiddenMode = true;
        persistState();
        renderQuestRows();
      } else {
        // Individual -> Shared: adopt one character's hidden set as the new shared one.
        // Skip the picker when there's nothing to choose (0 or 1 characters).
        let baseCharId = null;
        if (state.characters.length === 1) {
          baseCharId = state.characters[0].id;
        } else if (state.characters.length > 1) {
          baseCharId = await showBaseCharacterModal();
          if (baseCharId === null) {
            individualHiddenToggle.checked = true; // cancelled - revert the visual toggle
            return;
          }
        }
        if (baseCharId) {
          state.quests.forEach((q) => {
            if (!q.hiddenBy) q.hiddenBy = {};
            q.hiddenBy[Common.SHARED_HIDDEN_KEY] = !!q.hiddenBy[baseCharId];
          });
        }
        state.individualHiddenMode = false;
        persistState();
        renderQuestRows();
      }
    });
    document.getElementById('filterNameInput').placeholder = messages.filterNamePlaceholder;
    document.getElementById('filterNameInput').addEventListener('input', (e) => {
      filterName = e.target.value.trim().toLowerCase();
      renderQuestRows();
    });
    const filterTypeInput = document.getElementById('filterTypeInput');
    filterTypeInput.options[0].textContent = messages.filterAllLabel;
    filterTypeInput.options[1].textContent = messages.dailyLabel;
    filterTypeInput.options[2].textContent = messages.weeklyLabel;
    filterTypeInput.options[3].textContent = messages.monthlyLabel;
    filterTypeInput.addEventListener('change', (e) => {
      filterType = e.target.value;
      renderQuestRows();
    });
    const filterCategoryInput = document.getElementById('filterCategoryInput');
    filterCategoryInput.options[0].textContent = messages.filterAllLabel;
    filterCategoryInput.options[1].textContent = messages.categoryClassLabel;
    filterCategoryInput.options[2].textContent = messages.categoryUltraLabel;
    filterCategoryInput.options[3].textContent = messages.categoryOtherLabel;
    filterCategoryInput.addEventListener('change', (e) => {
      filterCategory = e.target.value;
      renderQuestRows();
    });
    document.getElementById('questNameInput').placeholder = messages.questNamePlaceholder;
    document.getElementById('questJoinInput').placeholder = messages.questJoinPlaceholder;
    document.getElementById('questTypeInput').options[0].textContent = messages.dailyLabel;
    document.getElementById('questTypeInput').options[1].textContent = messages.weeklyLabel;
    document.getElementById('questTypeInput').options[2].textContent = messages.monthlyLabel;
    document.getElementById('questCategoryInput').options[0].textContent = messages.categoryClassLabel;
    document.getElementById('questCategoryInput').options[1].textContent = messages.categoryUltraLabel;
    document.getElementById('questCategoryInput').options[2].textContent = messages.categoryOtherLabel;
    document.getElementById('questMemberLabel').textContent = messages.memberToggleLabel;
    document.getElementById('questSeasonalLabel').textContent = messages.seasonalToggleLabel;
    SEASONAL_EVENT_KEYS.forEach((key, i) => {
      document.getElementById('questSeasonalEventInput').options[i].textContent = messages.seasonalEvents[key].label;
    });
    const addQuestOverlay = document.getElementById('addQuestOverlay');
    document.getElementById('openAddQuestBtn').textContent = messages.addQuestButton;
    document.getElementById('addQuestTitle').textContent = messages.addQuestButton;
    document.getElementById('cancelAddQuestBtn').textContent = messages.promptCancelButton;
    document.getElementById('openAddQuestBtn').onclick = () => {
      addQuestOverlay.classList.add('open');
      document.getElementById('questNameInput').focus();
    };
    document.getElementById('cancelAddQuestBtn').onclick = () => addQuestOverlay.classList.remove('open');
    addQuestOverlay.onclick = (event) => {
      if (event.target === addQuestOverlay) addQuestOverlay.classList.remove('open');
    };
    document.getElementById('addQuestBtn').textContent = messages.addQuestButton;
    document.getElementById('serverTimeLabel').textContent = messages.serverTimeLabel;
    document.getElementById('nextFriday13Label').textContent = messages.nextFriday13Label;

    const seasonalToggleInput = document.getElementById('questSeasonalInput');
    const seasonalEventInput = document.getElementById('questSeasonalEventInput');
    seasonalToggleInput.addEventListener('change', () => {
      seasonalEventInput.disabled = !seasonalToggleInput.checked;
    });

    document.getElementById('addQuestBtn').onclick = () => {
      const nameInput = document.getElementById('questNameInput');
      const joinInput = document.getElementById('questJoinInput');
      const typeInput = document.getElementById('questTypeInput');
      const categoryInput = document.getElementById('questCategoryInput');
      const memberInput = document.getElementById('questMemberInput');
      const name = nameInput.value.trim();
      if (!name) return;
      const type = (typeInput.value === 'weekly' || typeInput.value === 'monthly') ? typeInput.value : 'daily';
      state.quests.push({
        id: genId('q'), name: name,
        joinCommand: joinInput.value.trim(),
        type: type,
        category: categoryInput.value,
        member: memberInput.checked,
        seasonal: seasonalToggleInput.checked,
        seasonalEvent: seasonalToggleInput.checked ? seasonalEventInput.value : null,
        done: {},
        hiddenBy: {}
      });
      nameInput.value = ''; joinInput.value = '';
      memberInput.checked = false;
      seasonalToggleInput.checked = false;
      seasonalEventInput.disabled = true;
      addQuestOverlay.classList.remove('open');
      persistState();
      renderQuestRows();
    };

    document.getElementById('archiveToggle').onclick = () => {
      archiveExpanded = !archiveExpanded;
      renderQuestRows();
    };
    document.getElementById('seasonalToggle').onclick = () => {
      seasonalExpanded = !seasonalExpanded;
      renderQuestRows();
    };

    const serverTimeValueEl = document.getElementById('serverTimeValue');
    const nextFriday13ValueEl = document.getElementById('nextFriday13Value');
    function refreshClock() {
      const now = new Date();
      serverTimeValueEl.textContent = Common.formatServerTimeText(now);
      nextFriday13ValueEl.textContent = getNextFriday13Text(now);
    }
    refreshClock();
    setInterval(refreshClock, 1000);

    activeCharId = state.characters.length ? state.characters[0].id : null;
    renderTabs();
    renderQuestRows();
    setInterval(tick, 30000);
  }

  init();
})();
</script>
</body>

<!DOCTYPE html>
<html style="margin:0;padding:0;width:100%;height:100%;">
<head>
<meta charset="UTF-8">
<title>AquaStar - Settings</title>
<style>
  :root {
    color-scheme: dark;
  }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #121212; color: #e6e6e6;
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    font-size: 13px;
  }
  #app { display: flex; flex-direction: column; height: 100%; box-sizing: border-box; }

  header {
    padding: 14px 18px 12px 18px;
    border-bottom: 1px solid #2c2c2c;
    flex: 0 0 auto;
  }
  header h1 { margin: 0 0 4px 0; font-size: 16px; }
  header p#description { margin: 0 0 8px 0; color: #9a9a9a; line-height: 1.4; }
  #saveLocation { color: #9a9a9a; font-size: 11px; word-break: break-all; }
  #saveLocation code { color: #cfcfcf; }

  #rows { flex: 1 1 auto; overflow-y: auto; padding: 4px 18px; }
  .row {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 0; border-bottom: 1px solid #202020;
  }
  .row .label { flex: 1 1 auto; min-width: 0; }
  .row .label .mac { color: #6f6f6f; font-size: 11px; }
  .combo {
    flex: 0 0 190px;
    font-family: "Consolas", "Courier New", monospace;
    background: #1b1b1b; border: 1px solid #333; border-radius: 4px;
    padding: 5px 8px; text-align: center; color: #dcdcdc;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .combo.recording { color: #ffcf5c; border-color: #7a6323; animation: pulse 1s infinite; }
  .combo.changed { border-color: #4da3ff; color: #9cc9ff; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .55 } }

  .section-heading {
    padding: 12px 0 6px; font-size: 11px; color: #9a9a9a;
    text-transform: uppercase; letter-spacing: .04em;
  }
  .row .label .hint { color: #6f6f6f; font-size: 11px; display: block; margin-top: 2px; }
  .text-input {
    flex: 0 0 190px;
    font-family: inherit;
    background: #1b1b1b; border: 1px solid #333; border-radius: 4px;
    padding: 5px 8px; color: #dcdcdc;
  }
  .text-input:focus { outline: none; border-color: #4da3ff; }
  .text-input.changed { border-color: #4da3ff; color: #9cc9ff; }
  .select-input {
    flex: 0 0 190px;
    font-family: inherit;
    background: #1b1b1b; border: 1px solid #333; border-radius: 4px;
    padding: 5px 8px; color: #dcdcdc; cursor: pointer;
  }
  .select-input:focus { outline: none; border-color: #4da3ff; }
  .select-input.changed { border-color: #4da3ff; color: #9cc9ff; }
  .switch {
    position: relative; display: inline-block;
    flex: 0 0 38px; width: 38px; height: 22px;
  }
  .switch input { position: absolute; opacity: 0; width: 0; height: 0; }
  .switch .slider {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: #1b1b1b; border: 1px solid #383838; border-radius: 22px;
    cursor: pointer; transition: background-color .15s, border-color .15s;
  }
  .switch .slider::before {
    content: ""; position: absolute; top: 2px; left: 2px;
    width: 16px; height: 16px; border-radius: 50%;
    background: #9a9a9a; transition: transform .15s, background-color .15s;
  }
  .switch input:checked + .slider { background: #2b6fce; border-color: #2b6fce; }
  .switch input:checked + .slider::before { transform: translateX(16px); background: #fff; }
  .switch input:focus-visible + .slider { outline: 2px solid #4da3ff; outline-offset: 2px; }

  button {
    background: #232323; color: #e6e6e6; border: 1px solid #383838;
    border-radius: 4px; padding: 6px 12px; cursor: pointer; font-size: 12px;
  }
  button:hover { background: #2c2c2c; }
  button:active { background: #1a1a1a; }
  button.small { padding: 5px 10px; font-size: 11px; }
  button.primary { background: #2b6fce; border-color: #2b6fce; color: #fff; }
  button.primary:hover { background: #3a7fe0; }
  button.danger { background: #8d3030; border-color: #a64646; color: #fff; }
  button.danger:hover { background: #a63a3a; }
  button:disabled { opacity: .45; cursor: default; }

  footer {
    flex: 0 0 auto; padding: 12px 18px 14px 18px; border-top: 1px solid #2c2c2c;
    display: flex; flex-direction: column; gap: 8px;
  }
  #status { min-height: 15px; color: #7fd08a; font-size: 12px; }
  #status.pending { color: #ffcf5c; }
  #footerButtons { display: flex; align-items: center; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }

  .swf-status { flex: 1 1 auto; min-width: 0; font-size: 11px; color: #9a9a9a; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .swf-status.active { color: #7fd08a; }

  .tabs {
    flex: 0 0 auto;
    display: flex; gap: 4px; padding: 0 18px;
    border-bottom: 1px solid #2c2c2c; background: #121212;
  }
  .tab {
    background: transparent; border: none; border-bottom: 2px solid transparent;
    border-radius: 0; color: #9a9a9a; padding: 10px 12px; font-size: 12px;
  }
  .tab:hover { background: #1a1a1a; color: #e6e6e6; }
  .tab.active { color: #e6e6e6; border-bottom-color: #4da3ff; }
  .panels { flex: 1 1 auto; min-height: 0; position: relative; }
  .panel {
    display: none; height: 100%; overflow-y: auto; padding: 4px 18px; box-sizing: border-box;
  }
  .panel.active { display: block; }
  .empty-state {
    margin: 24px 0; padding: 16px; border: 1px dashed #333; border-radius: 6px;
    color: #9a9a9a; line-height: 1.45;
  }
  .keybind-group-heading {
    padding: 14px 0 4px; font-size: 11px; color: #7a7a7a;
    text-transform: uppercase; letter-spacing: .04em;
  }
</style>
<link rel="stylesheet" href="../common/focus.css">
</head>
<body>
<div id="app">
  <header>
    <h1 id="heading">Keybind Settings</h1>
    <p id="description"></p>
    <div id="saveLocation"></div>
  </header>

  <nav id="tabs" class="tabs" role="tablist" aria-label="Settings sections">
    <button type="button" class="tab active" data-tab="general" id="tab-general"></button>
    <button type="button" class="tab" data-tab="plugin" id="tab-plugin"></button>
    <button type="button" class="tab" data-tab="keybinds" id="tab-keybinds"></button>
  </nav>
  <div id="panels" class="panels">
    <div id="panel-general" class="panel active" role="tabpanel"></div>
    <div id="panel-plugin" class="panel" role="tabpanel"></div>
    <div id="panel-keybinds" class="panel" role="tabpanel"></div>
  </div>

  <footer>
    <span id="status"></span>
    <div id="footerButtons">
      <button id="resetAllBtn" class="small"></button>
      <button id="restartBtn" class="small" disabled></button>
      <button id="saveBtn" class="primary"></button>
    </div>
  </footer>
</div>

<script>
(function () {
  const api = window.aquastarSettings;

  const MODIFIER_CODES = new Set([
    'ControlLeft', 'ControlRight', 'AltLeft', 'AltRight',
    'ShiftLeft', 'ShiftRight', 'MetaLeft', 'MetaRight'
  ]);

  const CODE_KEY_MAP = {
    Escape: 'Esc', Space: 'Space', Enter: 'Return', Tab: 'Tab',
    ArrowUp: 'Up', ArrowDown: 'Down', ArrowLeft: 'Left', ArrowRight: 'Right',
    Backspace: 'Backspace', Delete: 'Delete', Insert: 'Insert',
    Home: 'Home', End: 'End', PageUp: 'PageUp', PageDown: 'PageDown',
    Minus: '-', Equal: '=', Comma: ',', Period: '.', Slash: '/',
    Semicolon: ';', Quote: "'", BracketLeft: '[', BracketRight: ']',
    Backslash: '\\', Backquote: '`'
  };

  const MAC_ONLY_KEYS = new Set(['forward', 'backward']);
  const CHARPAGE_ONLY_KEYS = new Set(['cpSshot']);

  // Platform-owned options on the General tab (plugin fields come from registerSettingsSection).
  const PLATFORM_OPTION_TYPES = {
    customUrl:         'text',
    recordingFormat:   'select',
    renderMode:        'select',
    ruffleUpdateChannel: 'select',
    ruffleAutoUpdate:  'boolean',
    showGameMenu:      'boolean',
    enableDevTools:    'boolean'
  };

  // Plugin field keys that need alphanumeric sanitization (filled from layout).
  const SANITIZE_ALPHANUMERIC_KEYS = new Set(['playerCharacter']);

  // Rendered inside the primary-game override section instead of the generic options loop.
  const CUSTOM_SWF_SECTION_KEYS = new Set(['customUrl']);

  const PLATFORM_RESERVED_KEYBIND_IDS = new Set([
    'settings', 'fullscreen', 'sshot', 'record', 'reload', 'reloadCache',
    'help', 'about', 'forward', 'backward'
  ]);

  // Boolean options that need an explicit confirm before flipping on.
  const WARN_ON_ENABLE_KEYS = new Set(['enableDevTools']);

  // Select options that need an explicit confirm when switched to a specific value.
  const SELECT_WARN_ON_VALUE = { renderMode: 'ruffle' };

  // Accelerators are stored/sent as Electron's "CmdOrCtrl" internally (that's what
  // electron-localshortcut expects); only the on-screen text is swapped per OS.
  const modLabel = (api.platform === 'darwin') ? 'Cmd' : 'Ctrl';
  function formatForDisplay(str) {
    return (str || '').replace(/CmdOrCtrl/g, modLabel);
  }

  function normalizeKey(e) {
    const code = e.code || '';
    if (MODIFIER_CODES.has(code)) return null;
    if (/^Key[A-Z]$/.test(code)) return code.slice(3);
    if (/^Digit[0-9]$/.test(code)) return code.slice(5);
    if (/^Numpad[0-9]$/.test(code)) return 'num' + code.slice(6);
    if (/^F([1-9]|1[0-9]|2[0-4])$/.test(code)) return code;
    if (CODE_KEY_MAP[code]) return CODE_KEY_MAP[code];
    return null;
  }

  function isBareEscape(e) {
    return e.code === 'Escape' && !e.ctrlKey && !e.altKey && !e.shiftKey && !e.metaKey;
  }

  function acceleratorFromEvent(e) {
    const key = normalizeKey(e);
    if (key === null) return null;
    const parts = [];
    if (e.ctrlKey || e.metaKey) parts.push('CmdOrCtrl');
    if (e.altKey) parts.push('Alt');
    if (e.shiftKey) parts.push('Shift');
    parts.push(key);
    return parts.join('+');
  }

  function toDisplay(value) {
    return Array.isArray(value) ? value.join(', ') : (value || '');
  }

  function resetRowToDefault(key) {
    const st = rowState[key];
    if (!st) return;
    if (st.recording) stopRecording(key);
    if (st.type === 'object-option') {
      st.value = _cloneTrustedMap(st.initial);
      return;
    }
    if (st.type === 'text-option' || st.type === 'select-option') {
      if (key === 'activePluginId' || key === 'enableLocalPlugins' || key === 'allowLocalPluginOverride') {
        st.value = st.initial;
        if (st.comboEl) {
          if (st.type === 'boolean-option' || st.comboEl.type === 'checkbox') st.comboEl.checked = st.value;
          else st.comboEl.value = st.value;
          if (st.comboEl.classList && st.comboEl.classList.toggle) {
            st.comboEl.classList.toggle('changed', st.value !== st.initial);
          }
        }
        return;
      }
      st.value = options[key] || '';
      st.comboEl.value = st.value;
      st.comboEl.classList.toggle('changed', st.value !== st.initial);
    } else if (st.type === 'boolean-option') {
      if (key === 'enableLocalPlugins' || key === 'allowLocalPluginOverride') {
        st.value = st.initial;
        st.comboEl.checked = st.value;
        return;
      }
      st.value = options[key] === true;
      st.comboEl.checked = st.value;
    } else {
      st.value = toDisplay(defaults[key]);
      st.comboEl.textContent = formatForDisplay(st.value) || '(none)';
      st.comboEl.classList.toggle('changed', st.value !== st.initial);
    }
  }

  let messages, defaults, current, options;
  let updateChannelChoices = [];
  // key -> { comboEl, initial: string, value: string, recording: bool, type: 'keybind'|'option' }
  const rowState = {};
  let activeRecordingKey = null;

  function setStatus(text, pending) {
    const el = document.getElementById('status');
    el.textContent = text || '';
    el.classList.toggle('pending', !!pending);
  }

  function anyChanges() {
    return Object.keys(rowState).some((k) => {
      const st = rowState[k];
      if (st.type === 'object-option') return !_trustedMapsEqual(st.value, st.initial);
      return st.value !== st.initial;
    });
  }

  function refreshSaveState() {
    document.getElementById('saveBtn').disabled = !anyChanges();
    if (anyChanges()) setStatus(null);
  }

  function stopRecording(key) {
    const st = rowState[key];
    if (!st) return;
    st.recording = false;
    st.comboEl.classList.remove('recording');
    st.comboEl.textContent = formatForDisplay(st.value) || '(none)';
    st.comboEl.classList.toggle('changed', st.value !== st.initial);
    if (activeRecordingKey === key) activeRecordingKey = null;
    document.removeEventListener('keydown', st.handler, true);
  }

  function startRecording(key) {
    if (activeRecordingKey && activeRecordingKey !== key) {
      stopRecording(activeRecordingKey);
    }
    const st = rowState[key];
    st.recording = true;
    activeRecordingKey = key;
    st.comboEl.textContent = messages.recordingLabel;
    st.comboEl.classList.add('recording');

    st.handler = function (e) {
      e.preventDefault();
      e.stopPropagation();
      if (isBareEscape(e)) {
        stopRecording(key);
        return;
      }
      const accel = acceleratorFromEvent(e);
      if (accel === null) return; // waiting for a real key, modifier alone isn't enough
      st.value = accel;
      stopRecording(key);
      refreshSaveState();
    };
    document.addEventListener('keydown', st.handler, true);
  }

  function buildRow(key) {
    const initialValue = toDisplay(current[key] !== undefined ? current[key] : defaults[key]);
    const label = (messages.labels && messages.labels[key]) || key;

    const row = document.createElement('div');
    row.className = 'row';

    const labelEl = document.createElement('div');
    labelEl.className = 'label';
    labelEl.textContent = label;
    const restrictionText =
      (MAC_ONLY_KEYS.has(key) ? messages.macOnlyLabel : '') +
      (CHARPAGE_ONLY_KEYS.has(key) ? messages.charpageOnly : '');
    if (restrictionText) {
      const mac = document.createElement('span');
      mac.className = 'mac';
      mac.textContent = restrictionText;
      labelEl.appendChild(mac);
    }

    const comboEl = document.createElement('div');
    comboEl.className = 'combo';
    comboEl.textContent = formatForDisplay(initialValue) || '(none)';

    const recordBtn = document.createElement('button');
    recordBtn.className = 'small';
    recordBtn.textContent = messages.recordButton;
    recordBtn.onclick = () => startRecording(key);

    const resetBtn = document.createElement('button');
    resetBtn.className = 'small';
    resetBtn.textContent = messages.resetButton;
    resetBtn.onclick = () => { resetRowToDefault(key); refreshSaveState(); };

    row.appendChild(labelEl);
    row.appendChild(comboEl);
    row.appendChild(recordBtn);
    row.appendChild(resetBtn);

    rowState[key] = { comboEl: comboEl, initial: initialValue, value: initialValue, recording: false, type: 'keybind' };

    return row;
  }

  function _buildOptionLabel(key) {
    const label = (messages.optionLabels && messages.optionLabels[key]) || key;
    const hintText = messages.optionHints && messages.optionHints[key];

    const labelEl = document.createElement('div');
    labelEl.className = 'label';
    labelEl.textContent = label;
    if (hintText) {
      const hint = document.createElement('span');
      hint.className = 'hint';
      hint.textContent = hintText;
      labelEl.appendChild(hint);
    }
    return labelEl;
  }

  function buildTextOptionRow(key) {
    const initialValue = (current[key] !== undefined ? current[key] : options[key]) || '';

    const row = document.createElement('div');
    row.className = 'row';

    const inputEl = document.createElement('input');
    inputEl.type = 'text';
    inputEl.className = 'text-input';
    inputEl.spellcheck = false;
    inputEl.value = initialValue;
    inputEl.addEventListener('input', () => {
      if (SANITIZE_ALPHANUMERIC_KEYS.has(key)) {
        const sanitized = inputEl.value.replace(/[^a-zA-Z0-9]/g, '');
        if (sanitized !== inputEl.value) inputEl.value = sanitized;
      }
      const st = rowState[key];
      st.value = inputEl.value;
      st.comboEl.classList.toggle('changed', st.value !== st.initial);
      refreshSaveState();
    });

    const resetBtn = document.createElement('button');
    resetBtn.className = 'small';
    resetBtn.textContent = messages.resetButton;
    resetBtn.onclick = () => { resetRowToDefault(key); refreshSaveState(); };

    row.appendChild(_buildOptionLabel(key));
    row.appendChild(inputEl);
    row.appendChild(resetBtn);

    rowState[key] = { comboEl: inputEl, initial: initialValue, value: initialValue, recording: false, type: 'text-option' };

    return row;
  }

  function buildSelectOptionRow(key, choices) {
    const initialValue = (current[key] !== undefined ? current[key] : options[key]) || '';

    const row = document.createElement('div');
    row.className = 'row';

    const selectEl = document.createElement('select');
    selectEl.className = 'select-input';
    (choices || []).forEach((choice) => {
      const optionEl = document.createElement('option');
      optionEl.value = choice.id;
      optionEl.textContent = choice.label;
      selectEl.appendChild(optionEl);
    });
    selectEl.value = initialValue;
    selectEl.addEventListener('change', () => {
      const st = rowState[key];
      const warnValue = SELECT_WARN_ON_VALUE[key];
      if (warnValue && selectEl.value === warnValue) {
        const warnText = messages.optionWarnings && messages.optionWarnings[key];
        if (warnText && !window.confirm(warnText)) {
          selectEl.value = st.value;
          return;
        }
      }
      st.value = selectEl.value;
      st.comboEl.classList.toggle('changed', st.value !== st.initial);
      refreshSaveState();
    });

    const resetBtn = document.createElement('button');
    resetBtn.className = 'small';
    resetBtn.textContent = messages.resetButton;
    resetBtn.onclick = () => { resetRowToDefault(key); refreshSaveState(); };

    row.appendChild(_buildOptionLabel(key));
    row.appendChild(selectEl);
    row.appendChild(resetBtn);

    rowState[key] = { comboEl: selectEl, initial: initialValue, value: initialValue, recording: false, type: 'select-option' };

    return row;
  }

  function buildBooleanOptionRow(key) {
    const initialValue = (current[key] !== undefined ? current[key] : options[key]) === true;

    const row = document.createElement('div');
    row.className = 'row';

    const switchLabel = document.createElement('label');
    switchLabel.className = 'switch';

    const inputEl = document.createElement('input');
    inputEl.type = 'checkbox';
    inputEl.checked = initialValue;
    inputEl.addEventListener('change', () => {
      if (inputEl.checked && WARN_ON_ENABLE_KEYS.has(key)) {
        const warnText = messages.optionWarnings && messages.optionWarnings[key];
        if (warnText && !window.confirm(warnText)) {
          inputEl.checked = false;
          return;
        }
      }
      const st = rowState[key];
      st.value = inputEl.checked;
      refreshSaveState();
    });

    const sliderEl = document.createElement('span');
    sliderEl.className = 'slider';

    switchLabel.appendChild(inputEl);
    switchLabel.appendChild(sliderEl);

    const resetBtn = document.createElement('button');
    resetBtn.className = 'small';
    resetBtn.textContent = messages.resetButton;
    resetBtn.onclick = () => { resetRowToDefault(key); refreshSaveState(); };

    row.appendChild(_buildOptionLabel(key));
    row.appendChild(switchLabel);
    row.appendChild(resetBtn);

    rowState[key] = { comboEl: inputEl, initial: initialValue, value: initialValue, recording: false, type: 'boolean-option' };

    return row;
  }

  // Primary-game override (platform): customUrl + local SWF file. Applies to whichever
  // plugin is active; the on-disk SWF wins over the URL when both are set.
  let customSwfStatusEl, customSwfRemoveBtn;
  function buildCustomSwfSection() {
    const heading = document.createElement('div');
    heading.className = 'section-heading';
    heading.textContent = messages.customSwfHeading || '';

    const urlRow = buildTextOptionRow('customUrl');

    const row = document.createElement('div');
    row.className = 'row';

    const labelEl = document.createElement('div');
    labelEl.className = 'label';
    labelEl.textContent = messages.customSwfLabel || '';
    if (messages.customSwfHint) {
      const hint = document.createElement('span');
      hint.className = 'hint';
      hint.textContent = messages.customSwfHint;
      labelEl.appendChild(hint);
    }

    customSwfStatusEl = document.createElement('span');
    customSwfStatusEl.className = 'swf-status';

    const chooseBtn = document.createElement('button');
    chooseBtn.className = 'small';
    chooseBtn.textContent = messages.customSwfChooseButton;
    chooseBtn.onclick = async () => {
      const result = await api.chooseCustomSwf();
      if (result.canceled) return;
      await refreshCustomSwfStatus();
      setStatus(messages.customSwfChosenMessage, true);
      document.getElementById('restartBtn').disabled = false;
    };

    customSwfRemoveBtn = document.createElement('button');
    customSwfRemoveBtn.className = 'small';
    customSwfRemoveBtn.textContent = messages.customSwfRemoveButton;
    customSwfRemoveBtn.onclick = async () => {
      if (!window.confirm(messages.customSwfRemoveConfirm)) return;
      await api.removeCustomSwf();
      await refreshCustomSwfStatus();
      setStatus(messages.customSwfRemovedMessage, true);
      document.getElementById('restartBtn').disabled = false;
    };

    row.appendChild(labelEl);
    row.appendChild(customSwfStatusEl);
    row.appendChild(chooseBtn);
    row.appendChild(customSwfRemoveBtn);

    return [heading, urlRow, row];
  }

  function buildRuffleSection() {
    const heading = document.createElement('div');
    heading.className = 'section-heading';
    heading.textContent = messages.ruffleHeading || 'Ruffle';
    const statusRow = document.createElement('div');
    statusRow.className = 'row';
    const statusLabel = document.createElement('div');
    statusLabel.className = 'label';
    statusLabel.textContent = messages.ruffleStatusLabel || 'Ruffle selected at startup';
    const statusValue = document.createElement('span');
    statusValue.className = 'swf-status';
    statusRow.appendChild(statusLabel);
    statusRow.appendChild(statusValue);
    const updateRow = document.createElement('div');
    updateRow.className = 'row';
    const label = document.createElement('div');
    label.className = 'label';
    label.textContent = messages.ruffleUpdateLabel || 'Update Ruffle';
    const hint = document.createElement('span');
    hint.className = 'hint';
    hint.textContent = messages.ruffleUpdateHint || '';
    label.appendChild(hint);
    const update = document.createElement('button');
    update.className = 'small';
    update.textContent = messages.ruffleUpdateButton || 'Download Update';
    update.onclick = async () => {
      update.disabled = true;
      setStatus(messages.ruffleDownloadingMessage || 'Downloading Ruffle update...', true);
      const selectedChannel = rowState.ruffleUpdateChannel ? rowState.ruffleUpdateChannel.value : 'latest';
      const result = await api.updateRuffle(selectedChannel);
      update.disabled = false;
      if (result.ok) {
        if (result.restartRequired) {
          setStatus(messages.ruffleUpdatedMessage || 'Ruffle update downloaded. Restart AquaStar to apply it.', true);
          document.getElementById('restartBtn').disabled = false;
        } else if (result.bundledAlreadyCurrent) setStatus(messages.ruffleBundledAlreadyCurrentMessage || 'The bundled Ruffle is already the latest stable version.');
        else setStatus(messages.ruffleAlreadyCurrentMessage || 'Ruffle is already up to date.');
      } else setStatus((messages.ruffleUpdateFailedMessage || 'Could not update Ruffle: ') + result.error);
    };
    updateRow.appendChild(label);
    updateRow.appendChild(update);
    api.getRuffleStatus().then((ruffle) => {
      const configuredChannel = ruffle.configuredChannel === 'nightly'
        ? (messages.ruffleNightlyLabel || 'Nightly') : (messages.ruffleLatestLabel || 'Latest (Stable)');
      const selected = ruffle.loaded.source === 'downloaded'
        ? ((ruffle.loaded.channel === 'nightly' ? (messages.ruffleNightlyLabel || 'Nightly') :
            ruffle.loaded.channel === 'latest' ? (messages.ruffleLatestLabel || 'Latest (Stable)') :
            (messages.ruffleDownloadedLabel || 'Downloaded version')))
        : (messages.ruffleBundledLabel || 'Bundled fallback');
      statusValue.textContent = (ruffle.isActive ? '' : (messages.ruffleInactiveLabel || 'Ruffle is not active; Flash Player is selected.\n')) +
        (messages.ruffleConfiguredChannelLabel || 'Configured update channel: ') + configuredChannel + '\n' +
        (messages.ruffleLoadedLabel || 'Selected at startup: ') + selected + ' — ' + ruffle.loaded.version + '\n' +
        (messages.ruffleFallbackLabel || 'Fallback: ') + ruffle.fallback.version;
      statusValue.style.whiteSpace = 'pre-line';
      statusValue.classList.add('active');
    }).catch(() => { statusValue.textContent = messages.ruffleStatusUnavailable || 'Runtime status unavailable.'; });
    const restoreRow = document.createElement('div');
    restoreRow.className = 'row';
    const restoreLabel = document.createElement('div');
    restoreLabel.className = 'label';
    restoreLabel.textContent = messages.ruffleRestoreLabel || 'Restore bundled Ruffle';
    const restoreHint = document.createElement('span');
    restoreHint.className = 'hint';
    restoreHint.textContent = messages.ruffleRestoreHint || '';
    restoreLabel.appendChild(restoreHint);
    const restore = document.createElement('button');
    restore.className = 'small danger';
    restore.textContent = messages.ruffleRestoreButton || 'Restore bundled version';
    restore.onclick = async () => {
      if (!window.confirm(messages.ruffleRestoreConfirm || 'Restore the bundled Ruffle version after restart?')) return;
      await api.restoreBundledRuffle();
      setStatus(messages.ruffleRestoreMessage || 'Bundled Ruffle will be restored after restart.', true);
      document.getElementById('restartBtn').disabled = false;
    };
    restoreRow.appendChild(restoreLabel);
    restoreRow.appendChild(restore);
    // The selected channel controls this button. Keeping it beside the action
    // makes the stable release the normal path and nightly an explicit opt-in.
    const updateChannelRow = buildSelectOptionRow('ruffleUpdateChannel', updateChannelChoices);
    return [heading, statusRow, updateChannelRow, updateRow, buildBooleanOptionRow('ruffleAutoUpdate'), restoreRow];
  }

  async function refreshCustomSwfStatus() {
    const status = await api.getCustomSwfStatus();
    customSwfStatusEl.textContent = status.exists
      ? messages.customSwfActiveLabel + status.path
      : messages.customSwfInactiveLabel;
    customSwfStatusEl.classList.toggle('active', status.exists);
    customSwfRemoveBtn.disabled = !status.exists;
    return status;
  }

  function _cloneTrustedMap(map) {
    const out = {};
    Object.keys(map || {}).forEach((id) => { out[id] = map[id]; });
    return out;
  }

  function _trustedMapsEqual(a, b) {
    const ak = Object.keys(a || {}).sort();
    const bk = Object.keys(b || {}).sort();
    if (ak.length !== bk.length) return false;
    for (let i = 0; i < ak.length; i++) {
      if (ak[i] !== bk[i]) return false;
      if (!!a[ak[i]] !== !!b[bk[i]]) return false;
    }
    return true;
  }

  function buildPluginsSection(pluginList, pluginSettings) {
    const nodes = [];
    const heading = document.createElement('div');
    heading.className = 'section-heading';
    heading.textContent = messages.pluginsHeading || 'Plugins';
    nodes.push(heading);

    const initialTrusted = _cloneTrustedMap(pluginSettings.trustedLocalPlugins);
    rowState.trustedLocalPlugins = {
      initial: initialTrusted,
      value: _cloneTrustedMap(initialTrusted),
      recording: false,
      type: 'object-option',
      comboEl: { classList: { toggle: function () {} } }
    };

    function currentPluginQuery() {
      return {
        enableLocalPlugins: rowState.enableLocalPlugins
          ? rowState.enableLocalPlugins.value === true
          : !!pluginSettings.enableLocalPlugins,
        allowLocalPluginOverride: rowState.allowLocalPluginOverride
          ? rowState.allowLocalPluginOverride.value === true
          : !!pluginSettings.allowLocalPluginOverride,
        trustedLocalPlugins: rowState.trustedLocalPlugins
          ? rowState.trustedLocalPlugins.value
          : initialTrusted
      };
    }

    function fillActivePluginSelect(selectEl, list, preferredId) {
      const plugins = (list && list.plugins) || [];
      selectEl.innerHTML = '';
      if (!plugins.length) {
        const empty = document.createElement('option');
        empty.value = preferredId || '';
        empty.textContent = messages.pluginsEmptyLabel || 'No plugins discovered.';
        selectEl.appendChild(empty);
        selectEl.disabled = true;
        return preferredId || '';
      }
      selectEl.disabled = false;
      plugins.forEach((plugin) => {
        const optionEl = document.createElement('option');
        optionEl.value = plugin.id;
        const sourceLabel = plugin.source === 'local'
          ? (messages.pluginsSourceLocal || 'local')
          : (messages.pluginsSourceBundled || 'bundled');
        optionEl.textContent = plugin.name + ' (' + sourceLabel + ')' +
          (plugin.version ? ' · ' + plugin.version : '');
        selectEl.appendChild(optionEl);
      });
      const ids = plugins.map((p) => p.id);
      const chosen = ids.indexOf(preferredId) !== -1 ? preferredId : ids[0];
      selectEl.value = chosen;
      return chosen;
    }

    // --- enableLocalPlugins toggle ---
    function buildFlagRow(key, labelText, hintText, initialBool) {
      const row = document.createElement('div');
      row.className = 'row';
      const labelEl = document.createElement('div');
      labelEl.className = 'label';
      labelEl.textContent = labelText;
      if (hintText) {
        const hint = document.createElement('span');
        hint.className = 'hint';
        hint.textContent = hintText;
        labelEl.appendChild(hint);
      }
      const switchLabel = document.createElement('label');
      switchLabel.className = 'switch';
      const inputEl = document.createElement('input');
      inputEl.type = 'checkbox';
      inputEl.checked = initialBool === true;
      const sliderEl = document.createElement('span');
      sliderEl.className = 'slider';
      switchLabel.appendChild(inputEl);
      switchLabel.appendChild(sliderEl);
      const resetBtn = document.createElement('button');
      resetBtn.className = 'small';
      resetBtn.textContent = messages.resetButton;
      row.appendChild(labelEl);
      row.appendChild(switchLabel);
      row.appendChild(resetBtn);
      rowState[key] = {
        comboEl: inputEl,
        initial: initialBool === true,
        value: initialBool === true,
        recording: false,
        type: 'boolean-option'
      };
      inputEl.addEventListener('change', () => {
        rowState[key].value = inputEl.checked;
        refreshSaveState();
        refreshPluginDiscovery();
      });
      resetBtn.onclick = () => {
        rowState[key].value = rowState[key].initial;
        inputEl.checked = rowState[key].initial;
        refreshSaveState();
        refreshPluginDiscovery();
      };
      return row;
    }

    nodes.push(buildFlagRow(
      'enableLocalPlugins',
      messages.pluginsEnableLocalLabel || 'Load local plugins from AppData',
      messages.pluginsEnableLocalHint || '',
      pluginSettings.enableLocalPlugins
    ));
    nodes.push(buildFlagRow(
      'allowLocalPluginOverride',
      messages.pluginsAllowOverrideLabel || 'Allow local plugins to override bundled ids',
      messages.pluginsAllowOverrideHint || '',
      pluginSettings.allowLocalPluginOverride
    ));

    // --- active plugin select ---
    const activeRow = document.createElement('div');
    activeRow.className = 'row';
    const activeLabel = document.createElement('div');
    activeLabel.className = 'label';
    activeLabel.textContent = messages.pluginsActiveLabel || 'Active plugin';
    const activeHint = document.createElement('span');
    activeHint.className = 'hint';
    activeHint.textContent = messages.pluginsActiveHint ||
      'Only one plugin can be active. Changing it requires restarting AquaStar.';
    activeLabel.appendChild(activeHint);
    const selectEl = document.createElement('select');
    selectEl.className = 'select-input';
    const initialActive = fillActivePluginSelect(
      selectEl,
      pluginList,
      pluginSettings.activePluginId
    );
    selectEl.addEventListener('change', () => {
      const st = rowState.activePluginId;
      st.value = selectEl.value;
      st.comboEl.classList.toggle('changed', st.value !== st.initial);
      refreshSaveState();
    });
    const activeReset = document.createElement('button');
    activeReset.className = 'small';
    activeReset.textContent = messages.resetButton;
    activeReset.onclick = () => {
      const st = rowState.activePluginId;
      st.value = st.initial;
      selectEl.value = st.initial;
      selectEl.classList.remove('changed');
      refreshSaveState();
    };
    activeRow.appendChild(activeLabel);
    activeRow.appendChild(selectEl);
    activeRow.appendChild(activeReset);
    rowState.activePluginId = {
      comboEl: selectEl,
      initial: initialActive,
      value: initialActive,
      recording: false,
      type: 'select-option'
    };
    nodes.push(activeRow);

    const dirRow = document.createElement('div');
    dirRow.className = 'row';
    const dirLabel = document.createElement('div');
    dirLabel.className = 'label';
    dirLabel.innerHTML = (messages.pluginsLocalDirLabel || 'Local plugins folder: ') +
      '<code style="color:#cfcfcf;word-break:break-all;">' +
      String((pluginList && pluginList.localPluginsDir) || '').replace(/</g, '&lt;') +
      '</code>';
    dirRow.appendChild(dirLabel);
    nodes.push(dirRow);

    const notesEl = document.createElement('div');
    notesEl.className = 'row';
    const notesLabel = document.createElement('div');
    notesLabel.className = 'label';
    notesEl.appendChild(notesLabel);
    notesEl.style.display = 'none';
    nodes.push(notesEl);

    const trustHeading = document.createElement('div');
    trustHeading.className = 'section-heading';
    trustHeading.textContent = messages.pluginsTrustHeading || 'Trust local plugins';
    nodes.push(trustHeading);

    const trustHintRow = document.createElement('div');
    trustHintRow.className = 'row';
    const trustHintLabel = document.createElement('div');
    trustHintLabel.className = 'label';
    const trustHint = document.createElement('span');
    trustHint.className = 'hint';
    trustHint.textContent = messages.pluginsTrustHint || '';
    trustHintLabel.appendChild(trustHint);
    trustHintRow.appendChild(trustHintLabel);
    nodes.push(trustHintRow);

    const trustContainer = document.createElement('div');
    nodes.push(trustContainer);

    function renderTrustRows(list) {
      trustContainer.innerHTML = '';
      const localPlugins = ((list && list.plugins) || []).filter((p) => p.source === 'local');
      trustHeading.style.display = localPlugins.length ? '' : 'none';
      trustHintRow.style.display = localPlugins.length ? '' : 'none';
      localPlugins.forEach((plugin) => {
        const row = document.createElement('div');
        row.className = 'row';
        const labelEl = document.createElement('div');
        labelEl.className = 'label';
        labelEl.textContent = plugin.name + ' (' + plugin.id + ')' +
          (plugin.version ? ' · ' + plugin.version : '');
        const switchLabel = document.createElement('label');
        switchLabel.className = 'switch';
        const inputEl = document.createElement('input');
        inputEl.type = 'checkbox';
        inputEl.checked = !!rowState.trustedLocalPlugins.value[plugin.id];
        inputEl.addEventListener('change', () => {
          if (inputEl.checked) rowState.trustedLocalPlugins.value[plugin.id] = true;
          else delete rowState.trustedLocalPlugins.value[plugin.id];
          refreshSaveState();
        });
        const sliderEl = document.createElement('span');
        sliderEl.className = 'slider';
        switchLabel.appendChild(inputEl);
        switchLabel.appendChild(sliderEl);
        const trustText = document.createElement('span');
        trustText.style.flex = '0 0 auto';
        trustText.style.color = '#9a9a9a';
        trustText.style.fontSize = '11px';
        trustText.textContent = messages.pluginsTrustLabel || 'Trust';
        row.appendChild(labelEl);
        row.appendChild(trustText);
        row.appendChild(switchLabel);
        trustContainer.appendChild(row);
      });
    }

    function renderDiscoveryNotes(list) {
      const errors = (list && list.errors) || [];
      if (!errors.length) {
        notesEl.style.display = 'none';
        notesLabel.textContent = '';
        return;
      }
      notesEl.style.display = '';
      notesLabel.innerHTML = '';
      const title = document.createElement('div');
      title.textContent = messages.pluginsCollisionLabel || 'Discovery notes:';
      notesLabel.appendChild(title);
      errors.forEach((err) => {
        const line = document.createElement('span');
        line.className = 'hint';
        line.style.display = 'block';
        line.textContent = err;
        notesLabel.appendChild(line);
      });
    }

    async function refreshPluginDiscovery() {
      const list = await api.getPluginList(currentPluginQuery());
      const preferred = rowState.activePluginId ? rowState.activePluginId.value : pluginSettings.activePluginId;
      const chosen = fillActivePluginSelect(selectEl, list, preferred);
      if (rowState.activePluginId) {
        rowState.activePluginId.value = chosen;
        rowState.activePluginId.comboEl.classList.toggle(
          'changed',
          rowState.activePluginId.value !== rowState.activePluginId.initial
        );
      }
      renderDiscoveryNotes(list);
      renderTrustRows(list);
      refreshSaveState();
    }

    renderDiscoveryNotes(pluginList);
    renderTrustRows(pluginList);
    return nodes;
  }

  function descriptionForTab(name) {
    if (name === 'general') {
      return messages.descriptionGeneral || messages.description || '';
    }
    if (name === 'plugin') {
      return messages.descriptionPlugin || messages.description || '';
    }
    if (name === 'keybinds') {
      return messages.descriptionKeybinds || messages.description || '';
    }
    return messages.description || '';
  }

  function setActiveTab(name) {
    const tabs = document.querySelectorAll('#tabs .tab');
    tabs.forEach((t) => t.classList.toggle('active', t.getAttribute('data-tab') === name));
    ['general', 'plugin', 'keybinds'].forEach((id) => {
      const panel = document.getElementById('panel-' + id);
      if (panel) panel.classList.toggle('active', id === name);
    });
    const descEl = document.getElementById('description');
    if (descEl) descEl.textContent = descriptionForTab(name);
  }

  function setupTabs() {
    const tabs = document.querySelectorAll('#tabs .tab');
    tabs.forEach((tab) => {
      tab.addEventListener('click', () => {
        setActiveTab(tab.getAttribute('data-tab'));
      });
    });
  }

  function appendNodes(parent, nodes) {
    (nodes || []).forEach((el) => parent.appendChild(el));
  }

  function buildPluginSectionsPanel(layout, optionChoices) {
    const nodes = [];
    const sections = (layout && layout.pluginSections) || [];
    if (!sections.length) {
      const empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.textContent = messages.pluginSettingsEmpty ||
        'This plugin has no extra settings.';
      nodes.push(empty);
      return nodes;
    }
    sections.forEach((section) => {
      const heading = document.createElement('div');
      heading.className = 'section-heading';
      const localized = section.titleKey && messages.settingsSections
        ? messages.settingsSections[section.titleKey]
        : null;
      heading.textContent = localized || section.title || section.id;
      nodes.push(heading);
      (section.fields || []).forEach((field) => {
        if (!field || !field.key) return;
        if (field.sanitize === 'alphanumeric') SANITIZE_ALPHANUMERIC_KEYS.add(field.key);
        const type = field.type || 'text';
        if (type === 'boolean') nodes.push(buildBooleanOptionRow(field.key));
        else if (type === 'select') {
          nodes.push(buildSelectOptionRow(field.key, optionChoices[field.key] || []));
        } else nodes.push(buildTextOptionRow(field.key));
      });
    });
    return nodes;
  }

  function buildKeybindPanels(visibleIds) {
    const appKeys = [];
    const gameKeys = [];
    Object.keys(defaults).forEach((key) => {
      if (visibleIds && !visibleIds.has(key)) return;
      if (PLATFORM_RESERVED_KEYBIND_IDS.has(key)) appKeys.push(key);
      else gameKeys.push(key);
    });
    const nodes = [];
    if (appKeys.length) {
      const h = document.createElement('div');
      h.className = 'keybind-group-heading';
      h.textContent = messages.keybindsAppHeading || 'App';
      nodes.push(h);
      appKeys.forEach((key) => nodes.push(buildRow(key)));
    }
    if (gameKeys.length) {
      const h = document.createElement('div');
      h.className = 'keybind-group-heading';
      h.textContent = messages.keybindsGameHeading || 'Game';
      nodes.push(h);
      gameKeys.forEach((key) => nodes.push(buildRow(key)));
    }
    return nodes;
  }

  async function init() {
    const [kb, msgs, pluginList, pluginSettings, layout] = await Promise.all([
      api.getKeybindings(),
      api.getMessages(),
      api.getPluginList(),
      api.getPluginSettings(),
      api.getSettingsLayout()
    ]);
    current = kb.current;
    defaults = kb.defaults;
    options = kb.options || {};
    messages = msgs;

    document.title = messages.title;
    document.getElementById('heading').textContent = messages.heading || 'Settings';
    document.getElementById('saveLocation').innerHTML =
      messages.saveLocationLabel + '<code>' + kb.savePath.replace(/</g, '&lt;') + '</code>';

    const pluginName = (layout && layout.plugin && layout.plugin.name) ||
      messages.tabPluginFallback || 'Active plugin';
    document.getElementById('tab-general').textContent = messages.tabGeneral || 'General';
    document.getElementById('tab-plugin').textContent = pluginName;
    document.getElementById('tab-keybinds').textContent = messages.tabKeybinds || 'Keybinds';
    setupTabs();
    setActiveTab('general');

    const generalEl = document.getElementById('panel-general');
    const pluginEl = document.getElementById('panel-plugin');
    const keybindsEl = document.getElementById('panel-keybinds');

    const visibleIds = Array.isArray(kb.visibleKeybindIds) ? new Set(kb.visibleKeybindIds) : null;
    appendNodes(keybindsEl, buildKeybindPanels(visibleIds));

    const optionChoices = {
      recordingFormat: kb.recordingFormatChoices || [],
      renderMode:      kb.renderModeChoices || []
    };
    updateChannelChoices = kb.ruffleUpdateChannelChoices || [];

    // General: plugins meta first, then platform options, primary SWF override, Ruffle.
    appendNodes(generalEl, buildPluginsSection(pluginList, pluginSettings || layout.pluginSettings || {}));

    const platformOptionKeys = Object.keys(options).filter((key) =>
      PLATFORM_OPTION_TYPES[key] &&
      !CUSTOM_SWF_SECTION_KEYS.has(key) &&
      key !== 'ruffleUpdateChannel' &&
      key !== 'ruffleAutoUpdate'
    );
    if (platformOptionKeys.length) {
      const heading = document.createElement('div');
      heading.className = 'section-heading';
      heading.textContent = messages.optionsHeading || 'General options';
      generalEl.appendChild(heading);
      platformOptionKeys.forEach((key) => {
        const type = PLATFORM_OPTION_TYPES[key];
        if (type === 'boolean') generalEl.appendChild(buildBooleanOptionRow(key));
        else if (type === 'select') generalEl.appendChild(buildSelectOptionRow(key, optionChoices[key]));
        else generalEl.appendChild(buildTextOptionRow(key));
      });
    }

    appendNodes(generalEl, buildCustomSwfSection());
    appendNodes(generalEl, buildRuffleSection());
    await refreshCustomSwfStatus();

    appendNodes(pluginEl, buildPluginSectionsPanel(layout, optionChoices));

    document.getElementById('saveBtn').textContent = messages.saveButton;
    document.getElementById('resetAllBtn').textContent = messages.resetAllButton;
    document.getElementById('restartBtn').textContent = messages.restartButton;

    document.getElementById('resetAllBtn').onclick = () => {
      Object.keys(rowState).forEach((key) => resetRowToDefault(key));
      refreshSaveState();
    };

    document.getElementById('saveBtn').onclick = async () => {
      const changed = {};
      Object.keys(rowState).forEach((key) => {
        const st = rowState[key];
        if (st.type === 'object-option') {
          if (!_trustedMapsEqual(st.value, st.initial)) changed[key] = _cloneTrustedMap(st.value);
          return;
        }
        if (st.value !== st.initial) changed[key] = st.value;
      });
      if (Object.keys(changed).length === 0) return;

      const pluginChanged = Object.prototype.hasOwnProperty.call(changed, 'activePluginId') ||
        Object.prototype.hasOwnProperty.call(changed, 'enableLocalPlugins') ||
        Object.prototype.hasOwnProperty.call(changed, 'allowLocalPluginOverride') ||
        Object.prototype.hasOwnProperty.call(changed, 'trustedLocalPlugins');
      document.getElementById('saveBtn').disabled = true;
      try {
        const result = await api.saveKeybindings(changed);
        Object.keys(changed).forEach((key) => {
          const st = rowState[key];
          if (st.type === 'object-option') st.initial = _cloneTrustedMap(st.value);
          else st.initial = st.value;
        });
        setStatus(
          pluginChanged
            ? (messages.pluginsRestartHint || messages.savedMessage)
            : messages.savedMessage,
          true
        );
        document.getElementById('saveLocation').innerHTML =
          messages.saveLocationLabel + '<code>' + result.savedTo.replace(/</g, '&lt;') + '</code>';
        document.getElementById('restartBtn').disabled = false;
        if (Object.prototype.hasOwnProperty.call(changed, 'activePluginId')) {
          const prompt = messages.pluginsRestartPrompt ||
            'Active plugin changed. Restart AquaStar now to apply it?';
          if (window.confirm(prompt)) api.restartApp();
        }
      } finally {
        refreshSaveState();
      }
    };

    document.getElementById('restartBtn').onclick = () => api.restartApp();
  }

  init();
})();
</script>
</body>
</html>

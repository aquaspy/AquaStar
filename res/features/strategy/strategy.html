<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>AquaStar - Strategy</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: #121212;
        color: #e6e6e6;
        font:
          13px -apple-system,
          Segoe UI,
          Roboto,
          Arial,
          sans-serif;
      }
      #app {
        height: 100%;
        display: flex;
        flex-direction: column;
      }
      header,
      .bar {
        padding: 14px 18px;
        border-bottom: 1px solid #2c2c2c;
      }
      header h1 {
        font-size: 16px;
        margin: 0 0 4px;
      }
      header p {
        margin: 0;
        color: #9a9a9a;
      }
      .bar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding-block: 9px;
        flex-wrap: wrap;
      }
      .spacer {
        flex: 1;
      }
      .content {
        padding: 18px;
        overflow: auto;
        flex: 1;
      }
      .hidden {
        display: none !important;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button {
        color: #e6e6e6;
        background: #242424;
        border: 1px solid #3a3a3a;
        border-radius: 4px;
        padding: 6px 11px;
        cursor: pointer;
        font-size: 12px;
      }
      button:hover {
        background: #303030;
      }
      .primary {
        color: #fff;
        background: #2b6fce;
        border-color: #2b6fce;
      }
      .primary:hover {
        background: #3a7fe0;
      }
      .danger {
        color: #f28b7a;
      }
      .ghost {
        background: transparent;
        color: #a7a7a7;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 12px;
      }
      .card,
      .section {
        background: #191919;
        border: 1px solid #303030;
        border-radius: 7px;
        padding: 14px;
      }
      .card {
        min-height: 160px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .card:hover {
        border-color: #4da3ff;
      }
      .card h2 {
        margin: 0;
        font-size: 15px;
        color: #c9e2ff;
      }
      .meta {
        color: #999;
        font-size: 12px;
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .badge {
        font-size: 10px;
        padding: 3px 7px;
        border-radius: 12px;
        background: #292929;
        color: #bbb;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .ultra {
        background: rgba(147, 112, 219, 0.18);
        color: #c3aaf0;
      }
      .challenge {
        background: rgba(230, 126, 34, 0.18);
        color: #f5a45d;
      }
      .actions {
        margin-top: auto;
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
      }
      .empty {
        padding: 28px 0;
        color: #777;
      }
      .detail {
        max-width: 1000px;
        margin: auto;
      }
      .detail-header {
        display: flex;
        align-items: start;
        justify-content: space-between;
        gap: 14px;
        margin-bottom: 14px;
      }
      .detail-header h2 {
        margin: 0 0 5px;
        font-size: 18px;
      }
      .detail-header p {
        margin: 0;
        color: #9a9a9a;
      }
      .section {
        margin-bottom: 12px;
      }
      .section h3 {
        margin: 0 0 10px;
        color: #aaa;
        font-size: 11px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 9px;
      }
      .field label,
      .slot label {
        display: block;
        color: #999;
        font-size: 11px;
        margin-bottom: 4px;
      }
      .field input,
      .field select,
      .field textarea,
      .slot select {
        width: 100%;
        padding: 7px;
        background: #111;
        border: 1px solid #363636;
        border-radius: 4px;
        color: #e6e6e6;
      }
      .field textarea {
        height: 150px;
        resize: vertical;
        line-height: 1.45;
      }
      .full {
        grid-column: 1/-1;
      }
      .slots {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 8px;
      }
      .strategy-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .strategy-row,
      .timer-row {
        display: flex;
        align-items: center;
        gap: 8px;
        background: #151515;
        border: 1px solid #2a2a2a;
        border-radius: 5px;
        padding: 9px;
      }
      .strategy-row strong {
        flex: 1;
      }
      .timer-row {
        display: grid;
        grid-template-columns: 70px 1fr 105px 105px 95px 1fr auto;
        align-items: end;
      }
      .timer-row input,
      .timer-row select {
        width: 100%;
        padding: 6px;
        background: #101010;
        border: 1px solid #363636;
        border-radius: 4px;
        color: #e6e6e6;
      }
      .timer-list {
        display: flex;
        flex-direction: column;
        gap: 7px;
      }
      .timer-actions {
        display: flex;
        gap: 8px;
        margin-top: 9px;
      }
      .run-panel {
        border-color: #2b6fce;
        background: linear-gradient(105deg, #18283b, #181818);
      }
      .run-state {
        font-size: 22px;
        font-family: Consolas, monospace;
        color: #9cc9ff;
      }
      .run-detail {
        color: #dcecff;
        margin-top: 6px;
      }
      .status {
        font-size: 12px;
        color: #7fd08a;
      }
      .overlay {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        background: rgba(0, 0, 0, 0.6);
        align-items: center;
        justify-content: center;
      }
      .overlay.open {
        display: flex;
      }
      .modal {
        width: min(560px, calc(100vw - 34px));
        max-height: calc(100vh - 34px);
        overflow: auto;
        background: #1b1b1b;
        border: 1px solid #393939;
        border-radius: 7px;
        padding: 16px;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.4);
      }
      .modal h2 {
        margin: 0 0 14px;
        font-size: 15px;
      }
      .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 14px;
      }
      .manage-row {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 8px;
        border-bottom: 1px solid #292929;
      }
      .manage-row span {
        flex: 1;
      }
      .check {
        display: flex;
        align-items: center;
        gap: 6px;
        color: #aaa;
      }
      .shortcut {
        font-family: Consolas, monospace;
        color: #9cc9ff;
      }
      @media (max-width: 760px) {
        .timer-row {
          grid-template-columns: 70px 1fr 1fr;
          gap: 6px;
        }
        .timer-row .wide {
          grid-column: span 2;
        }
        .grid {
          grid-template-columns: 1fr;
        }
        .full {
          grid-column: auto;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header>
        <h1 id="heading"></h1>
        <p id="description"></p>
      </header>
      <div id="topbar" class="bar">
        <button id="addBoss" class="primary"></button><button id="manageClasses"></button
        ><button id="managePotions"></button><button id="manageTypes"></button><span class="spacer"></span
        ><span id="status" class="status"></span>
      </div>
      <main id="bossView" class="content"><div id="bossCards" class="cards"></div></main>
      <main id="strategyView" class="content hidden">
        <div class="detail">
          <button id="backBosses" class="ghost"></button>
          <div id="bossInfo" class="detail-header"></div>
          <div class="section">
            <h3 id="strategiesTitle"></h3>
            <div id="strategyList" class="strategy-list"></div>
            <div class="timer-actions"><button id="addStrategy" class="primary"></button></div>
          </div>
        </div>
      </main>
      <main id="editorView" class="content hidden">
        <div class="detail">
          <button id="backStrategies" class="ghost"></button>
          <div id="strategyInfo" class="detail-header"></div>
          <div class="section">
            <h3 id="teamTitle"></h3>
            <div id="slots" class="slots"></div>
          </div>
          <div class="section">
            <h3 id="bossNotesTitle"></h3>
            <div class="field"><textarea id="bossNotes"></textarea></div>
          </div>
          <div class="section">
            <h3 id="strategyNotesTitle"></h3>
            <div class="field"><textarea id="strategyNotes"></textarea></div>
          </div>
          <div class="section">
            <h3 id="timersTitle"></h3>
            <div id="introTimers">
              <h4 id="introTitle"></h4>
              <div class="timer-list"></div>
              <div class="timer-actions"><button data-add-timer="intro"></button></div>
            </div>
            <hr />
            <div id="loopTimers">
              <h4 id="loopTitle"></h4>
              <div class="timer-list"></div>
              <div class="timer-actions"><button data-add-timer="loop"></button></div>
            </div>
          </div>
          <div class="section run-panel">
            <h3 id="runnerTitle"></h3>
            <div id="runState" class="run-state">00:00</div>
            <div id="runDetail" class="run-detail"></div>
            <div class="timer-actions">
              <button id="timerToggle" class="primary"></button><span id="shortcutHint" class="shortcut"></span>
            </div>
            <div class="field" style="margin-top: 12px">
              <label id="shortcutLabel"></label><input id="shortcutInput" />
            </div>
          </div>
          <button id="saveStrategy" class="primary"></button>
        </div>
      </main>
    </div>
    <div id="bossModal" class="overlay">
      <div class="modal">
        <h2 id="bossModalTitle"></h2>
        <div class="grid">
          <div class="field full"><label id="nameLabel"></label><input id="bossName" /></div>
          <div class="field full"><label id="joinLabel"></label><input id="bossJoin" /></div>
          <div class="field">
            <label id="resetLabel"></label
            ><select id="bossReset">
              <option value="weekly"></option>
              <option value="daily"></option>
            </select>
          </div>
          <div class="field">
            <label id="kindLabel"></label
            ><select id="bossKind">
              <option value="ultra"></option>
              <option value="challenge"></option>
            </select>
          </div>
          <label class="check full"><input id="bossZone" type="checkbox" /><span id="zoneLabel"></span></label>
        </div>
        <div class="modal-actions">
          <button data-close="bossModal" id="cancelBoss"></button><button id="saveBoss" class="primary"></button>
        </div>
      </div>
    </div>
    <div id="strategyModal" class="overlay">
      <div class="modal">
        <h2 id="strategyModalTitle"></h2>
        <div class="field"><label id="strategyNameLabel"></label><input id="strategyName" /></div>
        <div class="modal-actions">
          <button data-close="strategyModal" id="cancelStrategy"></button
          ><button id="saveStrategyName" class="primary"></button>
        </div>
      </div>
    </div>
    <div id="manageModal" class="overlay">
      <div class="modal">
        <h2 id="manageTitle"></h2>
        <div id="manageFields" class="grid"></div>
        <div class="modal-actions"><button id="manageAdd" class="primary"></button></div>
        <div id="manageList"></div>
        <div class="modal-actions"><button data-close="manageModal" id="manageClose"></button></div>
      </div>
    </div>
    <script>
      (function () {
        const A = window.aquastarStrategy,
          $ = (id) => document.getElementById(id);
        let m,
          s,
          bossId = null,
          strategyId = null,
          editBoss = null,
          editStrategy = null,
          manageKind = null,
          timer = null;
        const id = (p) => p + "_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 7);
        const boss = () => s.bosses.find((x) => x.id === bossId),
          strat = () => boss().strategies.find((x) => x.id === strategyId),
          limit = () => (boss().kind === "challenge" ? 7 : 4),
          close = (x) => $(x).classList.remove("open"),
          open = (x) => $(x).classList.add("open");
        function save() {
          return A.save(s).then((r) => {
            s = r.data;
            $("status").textContent = m.saved;
            setTimeout(() => {
              $("status").textContent = "";
            }, 1300);
          });
        }
        function labelType(v) {
          return m.timerTypes[v] || v;
        }
        function renderBosses() {
          let c = $("bossCards");
          c.innerHTML = "";
          if (!s.bosses.length) {
            c.innerHTML = '<div class="empty">' + m.emptyBosses + "</div>";
            return;
          }
          s.bosses.forEach((b) => {
            let x = document.createElement("article");
            x.className = "card";
            x.innerHTML =
              '<h2></h2><div class="meta"><span class="badge ' +
              b.kind +
              '">' +
              (b.kind === "challenge" ? m.challenge : m.ultra) +
              '</span><span class="badge">' +
              (b.reset === "daily" ? m.daily : m.weekly) +
              '</span><span class="badge">' +
              (b.kind === "challenge" ? 7 : 4) +
              " " +
              m.players +
              '</span></div><div class="meta"></div><div class="card-actions"><button class="primary">' +
              m.open +
              "</button><button>" +
              m.edit +
              '</button><button class="danger">' +
              m.delete +
              "</button></div>";
            x.querySelector("h2").textContent = b.name;
            x.querySelector(".meta:nth-of-type(2)").textContent =
              (b.joinCommand || m.noJoin) + (b.hasZone ? " · " + m.zone : "");
            let bs = x.querySelectorAll("button");
            bs[0].onclick = () => showStrategies(b.id);
            bs[1].onclick = () => showBoss(b);
            bs[2].onclick = () => {
              if (confirm(m.deleteBossConfirm)) {
                s.bosses = s.bosses.filter((q) => q.id !== b.id);
                save().then(renderBosses);
              }
            };
            c.append(x);
          });
        }
        function showStrategies(key) {
          bossId = key;
          $("bossView").classList.add("hidden");
          $("topbar").classList.add("hidden");
          $("strategyView").classList.remove("hidden");
          let b = boss();
          $("bossInfo").innerHTML =
            '<div><h2></h2><p></p></div><span class="badge ' + b.kind + '">' + limit() + " " + m.players + "</span>";
          $("bossInfo").querySelector("h2").textContent = b.name;
          $("bossInfo").querySelector("p").textContent = b.joinCommand || m.noJoin;
          renderStrategies();
        }
        function renderStrategies() {
          let c = $("strategyList");
          c.innerHTML = "";
          let b = boss();
          if (!b.strategies.length) c.innerHTML = '<div class="empty">' + m.emptyStrategies + "</div>";
          b.strategies.forEach((q) => {
            let r = document.createElement("div");
            r.className = "strategy-row";
            r.innerHTML =
              '<strong></strong><button class="primary">' +
              m.open +
              "</button><button>" +
              m.edit +
              '</button><button class="danger">' +
              m.delete +
              "</button>";
            r.querySelector("strong").textContent = q.name;
            let bs = r.querySelectorAll("button");
            bs[0].onclick = () => showEditor(q.id);
            bs[1].onclick = () => showStrategyModal(q);
            bs[2].onclick = () => {
              if (confirm(m.deleteStrategyConfirm)) {
                b.strategies = b.strategies.filter((x) => x.id !== q.id);
                save().then(renderStrategies);
              }
            };
            c.append(r);
          });
        }
        function showEditor(key) {
          strategyId = key;
          $("strategyView").classList.add("hidden");
          $("editorView").classList.remove("hidden");
          let b = boss(),
            q = strat();
          $("strategyInfo").innerHTML =
            '<div><h2></h2><p></p></div><span class="badge ' + b.kind + '">' + q.name + "</span>";
          $("strategyInfo").querySelector("h2").textContent = b.name;
          $("strategyInfo").querySelector("p").textContent = q.name;
          $("bossNotes").value = q.bossNotes;
          $("strategyNotes").value = q.strategyNotes;
          renderSlots();
          renderTimers();
          applyShortcut();
          renderRunner();
        }
        function renderSlots() {
          let c = $("slots"),
            q = strat();
          c.innerHTML = "";
          while (q.classIds.length < limit()) q.classIds.push("");
          q.classIds = q.classIds.slice(0, limit());
          q.classIds.forEach((v, i) => {
            let w = document.createElement("div");
            w.className = "slot";
            let l = document.createElement("label");
            l.textContent = m.player + " " + (i + 1);
            let sel = document.createElement("select");
            sel.innerHTML = '<option value="">' + m.noClass + "</option>";
            s.classes.forEach((cl) => {
              let o = document.createElement("option");
              o.value = cl.id;
              o.textContent = cl.name + " — " + m.roles[cl.role];
              o.selected = v === cl.id;
              sel.append(o);
            });
            sel.onchange = () => (q.classIds[i] = sel.value);
            w.append(l, sel);
            c.append(w);
          });
        }
        function timerRow(event, phase) {
          let r = document.createElement("div");
          r.className = "timer-row";
          r.innerHTML =
            "<div><label>" +
            m.delay +
            '</label><input type="number" min="0"></div><div><label>' +
            m.timerType +
            "</label><select></select></div><div><label>" +
            m.target +
            '</label><select><option value="main">' +
            m.main +
            '</option><option value="left">' +
            m.left +
            '</option><option value="right">' +
            m.right +
            "</option></select></div><div><label>" +
            m.player +
            "</label><select></select></div><div><label>" +
            m.assignment +
            '</label><input></div><div class="wide"><label>' +
            m.timerLabel +
            '</label><input></div><button class="danger">×</button>';
          let [delay, type, target, player, assignment, label] = r.querySelectorAll("input,select");
          delay.value = event.delay;
          s.timerTypes.forEach((t) => {
            let o = document.createElement("option");
            o.value = t.id;
            o.textContent = t.name;
            o.selected = t.id === event.typeId;
            type.append(o);
          });
          target.value = event.target;
          for (let i = 0; i < limit(); i++) {
            let o = document.createElement("option");
            o.value = i;
            o.textContent = m.player + " " + (i + 1);
            o.selected = i === event.player;
            player.append(o);
          }
          assignment.value = event.assignment;
          label.value = event.label;
          delay.onchange = () => (event.delay = Math.max(0, Number(delay.value) || 0));
          type.onchange = () => (event.typeId = type.value);
          target.onchange = () => (event.target = target.value);
          player.onchange = () => (event.player = Number(player.value));
          assignment.onchange = () => (event.assignment = assignment.value);
          label.onchange = () => (event.label = label.value);
          r.querySelector("button").onclick = () => {
            strat().timers[phase] = strat().timers[phase].filter((x) => x.id !== event.id);
            renderTimers();
          };
          return r;
        }
        function renderTimers() {
          ["intro", "loop"].forEach((phase) => {
            let wrap = $(phase + "Timers"),
              list = wrap.querySelector(".timer-list");
            list.innerHTML = "";
            strat().timers[phase].forEach((e) => list.append(timerRow(e, phase)));
            wrap.querySelector("[data-add-timer]").textContent = m.addTimer;
          });
        }
        function timerEvents() {
          let q = strat();
          return q.timers.intro
            .map((x) => Object.assign({ phase: "intro" }, x))
            .concat(q.timers.loop.map((x) => Object.assign({ phase: "loop" }, x)));
        }
        function stopTimer() {
          if (timer) {
            clearTimeout(timer.timeout);
            timer = null;
          }
          renderRunner();
        }
        function startTimer() {
          let events = timerEvents();
          if (!events.length) return;
          timer = { events: events, index: 0, started: Date.now(), timeout: null };
          nextTimer();
        }
        function nextTimer() {
          if (!timer) return;
          let e = timer.events[timer.index],
            wait = Math.max(0, e.delay * 1000);
          timer.timeout = setTimeout(() => {
            if (!timer) return;
            timer.index++;
            if (timer.index >= timer.events.length) {
              let intro = timer.events.filter((x) => x.phase === "intro").length;
              timer.index = intro < timer.events.length ? intro : 0;
            }
            timer.started = Date.now();
            nextTimer();
          }, wait);
          renderRunner();
        }
        function renderRunner() {
          let e = timer && timer.events[timer.index];
          $("runState").textContent = timer ? timer.index + 1 + " / " + timer.events.length : "00:00";
          $("runDetail").textContent = e
            ? labelType(e.typeId) +
              " · " +
              m[e.target] +
              " · " +
              m.player +
              " " +
              (e.player + 1) +
              (e.assignment ? " · " + e.assignment : "") +
              (e.label ? " — " + e.label : "")
            : m.timerIdle;
          $("timerToggle").textContent = timer ? m.stopTimer : m.startTimer;
        }
        async function applyShortcut() {
          let key = $("shortcutInput").value.trim();
          let r = await A.setTimerShortcut(key);
          $("shortcutHint").textContent = r.ok ? (key ? "[" + key + "]" : "") : m.shortcutError;
        }
        function showBoss(b) {
          editBoss = b || null;
          $("bossModalTitle").textContent = b ? m.editBoss : m.addBoss;
          $("bossName").value = b ? b.name : "";
          $("bossJoin").value = b ? b.joinCommand : "";
          $("bossReset").value = b ? b.reset : "weekly";
          $("bossKind").value = b ? b.kind : "ultra";
          $("bossZone").checked = b ? b.hasZone : false;
          open("bossModal");
        }
        function showStrategyModal(q) {
          editStrategy = q || null;
          $("strategyModalTitle").textContent = q ? m.editStrategy : m.addStrategy;
          $("strategyName").value = q ? q.name : "";
          open("strategyModal");
        }
        function manage(kind) {
          manageKind = kind;
          $("manageTitle").textContent = m["manage" + kind];
          let f = $("manageFields");
          f.innerHTML = '<div class="field"><label>' + m.name + '</label><input id="manageName"></div>';
          if (kind === "Classes")
            f.innerHTML +=
              '<div class="field"><label>' +
              m.role +
              '</label><select id="manageRole"><option value="support">' +
              m.roles.support +
              '</option><option value="dps">' +
              m.roles.dps +
              '</option><option value="tank">' +
              m.roles.tank +
              '</option><option value="dot">' +
              m.roles.dot +
              "</option></select></div>";
          if (kind === "Potions")
            f.innerHTML +=
              '<div class="field"><label>' +
              m.potionKind +
              '</label><select id="managePotionKind"><option value="tonic">' +
              m.tonic +
              '</option><option value="elixir">' +
              m.elixir +
              '</option><option value="potion">' +
              m.potion +
              "</option></select></div>";
          $("manageAdd").textContent = m.add;
          renderManage();
          open("manageModal");
        }
        function renderManage() {
          let c = $("manageList");
          c.innerHTML = "";
          let list = manageKind === "Classes" ? s.classes : manageKind === "Potions" ? s.potions : s.timerTypes;
          list.forEach((x) => {
            let r = document.createElement("div");
            r.className = "manage-row";
            r.innerHTML = '<span></span><button class="danger">' + m.delete + "</button>";
            r.querySelector("span").textContent = x.name;
            r.querySelector("button").onclick = () => {
              if (manageKind === "Classes") {
                s.classes = s.classes.filter((y) => y.id !== x.id);
                s.bosses.forEach((b) =>
                  b.strategies.forEach((q) => (q.classIds = q.classIds.map((v) => (v === x.id ? "" : v))))
                );
              } else if (manageKind === "Potions") s.potions = s.potions.filter((y) => y.id !== x.id);
              else if (!["taunt", "decay", "zone"].includes(x.id))
                s.timerTypes = s.timerTypes.filter((y) => y.id !== x.id);
              save().then(renderManage);
            };
            c.append(r);
          });
        }
        async function init() {
          [m, s] = await Promise.all([A.messages(), A.get().then((r) => r.data)]);
          document.title = m.title;
          $("heading").textContent = m.heading;
          $("description").textContent = m.description;
          $("addBoss").textContent = m.addBoss;
          $("manageClasses").textContent = m.manageClasses;
          $("managePotions").textContent = m.managePotions;
          $("manageTypes").textContent = m.manageTimerTypes;
          $("backBosses").textContent = "← " + m.bosses;
          $("strategiesTitle").textContent = m.strategies;
          $("addStrategy").textContent = m.addStrategy;
          $("backStrategies").textContent = "← " + m.strategies;
          $("teamTitle").textContent = m.team;
          $("bossNotesTitle").textContent = m.bossNotes;
          $("strategyNotesTitle").textContent = m.strategyNotes;
          $("timersTitle").textContent = m.timers;
          $("introTitle").textContent = m.intro;
          $("loopTitle").textContent = m.loop;
          $("runnerTitle").textContent = m.timerRunner;
          $("shortcutLabel").textContent = m.shortcut;
          $("shortcutInput").value = s.timerShortcut;
          $("saveStrategy").textContent = m.save;
          $("nameLabel").textContent = m.name;
          $("joinLabel").textContent = m.join;
          $("resetLabel").textContent = m.reset;
          $("kindLabel").textContent = m.kind;
          $("zoneLabel").textContent = m.zone;
          $("bossReset").options[0].textContent = m.weekly;
          $("bossReset").options[1].textContent = m.daily;
          $("bossKind").options[0].textContent = m.ultra;
          $("bossKind").options[1].textContent = m.challenge;
          $("cancelBoss").textContent = m.cancel;
          $("saveBoss").textContent = m.save;
          $("strategyNameLabel").textContent = m.name;
          $("cancelStrategy").textContent = m.cancel;
          $("saveStrategyName").textContent = m.save;
          $("manageClose").textContent = m.close;
          $("addBoss").onclick = () => showBoss();
          $("manageClasses").onclick = () => manage("Classes");
          $("managePotions").onclick = () => manage("Potions");
          $("manageTypes").onclick = () => manage("TimerTypes");
          $("backBosses").onclick = () => {
            $("strategyView").classList.add("hidden");
            $("bossView").classList.remove("hidden");
            $("topbar").classList.remove("hidden");
            renderBosses();
          };
          $("backStrategies").onclick = () => {
            stopTimer();
            A.clearTimerShortcut();
            $("editorView").classList.add("hidden");
            $("strategyView").classList.remove("hidden");
            renderStrategies();
          };
          $("addStrategy").onclick = () => showStrategyModal();
          $("timerToggle").onclick = () => (timer ? stopTimer() : startTimer());
          $("shortcutInput").onchange = () => {
            s.timerShortcut = $("shortcutInput").value.trim();
            save();
            applyShortcut();
          };
          A.onTimerToggle(() => (timer ? stopTimer() : startTimer()));
          $("saveStrategy").onclick = () => {
            let q = strat();
            q.bossNotes = $("bossNotes").value;
            q.strategyNotes = $("strategyNotes").value;
            save();
          };
          $("saveBoss").onclick = () => {
            let n = $("bossName").value.trim();
            if (!n) return;
            let b = editBoss || { id: id("boss"), strategies: [] };
            Object.assign(b, {
              name: n,
              joinCommand: $("bossJoin").value.trim(),
              reset: $("bossReset").value,
              kind: $("bossKind").value,
              hasZone: $("bossZone").checked,
            });
            if (!editBoss) s.bosses.push(b);
            b.strategies.forEach((q) => (q.classIds = q.classIds.slice(0, b.kind === "challenge" ? 7 : 4)));
            save().then(() => {
              close("bossModal");
              renderBosses();
            });
          };
          $("saveStrategyName").onclick = () => {
            let n = $("strategyName").value.trim();
            if (!n) return;
            let q = editStrategy || {
              id: id("strategy"),
              name: n,
              classIds: Array(limit()).fill(""),
              bossNotes: "",
              strategyNotes: "",
              timers: { intro: [], loop: [] },
            };
            q.name = n;
            if (!editStrategy) boss().strategies.push(q);
            save().then(() => {
              close("strategyModal");
              renderStrategies();
            });
          };
          $("manageAdd").onclick = () => {
            let n = $("manageName").value.trim();
            if (!n) return;
            if (manageKind === "Classes")
              s.classes.push({
                id: id("class"),
                name: n,
                role: $("manageRole").value,
                favorites: { tonicId: "", elixirId: "", potionId: "" },
              });
            else if (manageKind === "Potions")
              s.potions.push({ id: id("potion"), name: n, kind: $("managePotionKind").value });
            else s.timerTypes.push({ id: id("type"), name: n });
            $("manageName").value = "";
            save().then(renderManage);
          };
          document.querySelectorAll("[data-add-timer]").forEach(
            (b) =>
              (b.onclick = () => {
                let p = b.dataset.addTimer;
                strat().timers[p].push({
                  id: id("timer"),
                  delay: 5,
                  typeId: "taunt",
                  target: "main",
                  player: 0,
                  assignment: "",
                  label: "",
                });
                renderTimers();
              })
          );
          document.querySelectorAll("[data-close]").forEach((b) => (b.onclick = () => close(b.dataset.close)));
          document.querySelectorAll(".overlay").forEach(
            (o) =>
              (o.onclick = (e) => {
                if (e.target === o) close(o.id);
              })
          );
          window.addEventListener("beforeunload", () => A.clearTimerShortcut());
          renderBosses();
        }
        init();
      })();
    </script>
  </body>
</html>

<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>AquaStar - Strategy</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#121212;color:#e6e6e6;font:13px -apple-system,Segoe UI,Roboto,Arial,sans-serif}#app{height:100%;display:flex;flex-direction:column}header{padding:14px 18px;border-bottom:1px solid #2c2c2c}h1{font-size:16px;margin:0 0 4px}header p{margin:0;color:#9a9a9a}.bar{display:flex;gap:8px;align-items:center;padding:10px 18px;border-bottom:1px solid #2c2c2c;flex-wrap:wrap}.spacer{flex:1}button,select,input,textarea{font:inherit}button{background:#232323;border:1px solid #383838;border-radius:4px;color:#e6e6e6;padding:6px 11px;cursor:pointer;font-size:12px}button:hover{background:#2c2c2c}.primary{background:#2b6fce;border-color:#2b6fce;color:#fff}.primary:hover{background:#3a7fe0}.ghost{background:transparent;color:#9a9a9a}.content{overflow:auto;padding:18px;flex:1}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}.card{border:1px solid #303030;background:#1a1a1a;border-radius:7px;padding:14px;display:flex;flex-direction:column;gap:10px;min-height:155px}.card:hover{border-color:#4da3ff}.card h2{margin:0;font-size:14px;color:#c9e2ff}.meta{color:#9a9a9a;font-size:12px;display:flex;gap:6px;flex-wrap:wrap}.badge{padding:3px 7px;border-radius:12px;background:#252525;color:#b8b8b8;font-size:10px;text-transform:uppercase;letter-spacing:.03em}.badge.challenge{background:rgba(230,126,34,.18);color:#f5a45d}.badge.ultra{background:rgba(147,112,219,.18);color:#c3aaf0}.card-actions{margin-top:auto;display:flex;gap:7px}.empty{color:#777;padding:28px 0}.hidden{display:none!important}.detail{max-width:900px;margin:0 auto}.back{margin-bottom:14px}.detail-head{display:flex;justify-content:space-between;align-items:start;gap:16px;margin-bottom:16px}.detail h2{margin:0 0 5px;font-size:18px}.detail p{margin:0;color:#9a9a9a}.section{border:1px solid #303030;border-radius:7px;background:#181818;padding:14px;margin-bottom:12px}.section h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:#9a9a9a;margin:0 0 10px}.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}.slot label,.field label{display:block;color:#999;font-size:11px;margin-bottom:4px}.field input,.field select,.field textarea,.slots select{width:100%;background:#121212;border:1px solid #353535;border-radius:4px;color:#e6e6e6;padding:7px}.field textarea{height:260px;resize:vertical;line-height:1.45}.status{color:#7fd08a;font-size:12px}.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.58);z-index:2}.overlay.open{display:flex}.modal{width:min(540px,calc(100vw - 36px));max-height:calc(100vh - 36px);overflow:auto;background:#1b1b1b;border:1px solid #373737;border-radius:7px;padding:16px;box-shadow:0 18px 48px rgba(0,0,0,.35)}.modal h2{margin:0 0 14px;font-size:15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.check{display:flex;align-items:center;gap:6px;color:#aaa}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.manage-list{display:flex;flex-direction:column;gap:7px}.manage-row{display:flex;align-items:center;gap:8px;padding:8px;background:#151515;border:1px solid #292929;border-radius:4px}.manage-row span{flex:1}.danger{color:#f28b7a}@media(max-width:580px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body><div id="app"><header><h1 id="heading"></h1><p id="description"></p></header><div id="listBar" class="bar"><button id="addBossBtn" class="primary"></button><button id="manageClassesBtn"></button><span class="spacer"></span><span id="status" class="status"></span></div><main id="listView" class="content"><div id="cards" class="cards"></div></main><main id="detailView" class="content hidden"><div class="detail"><button id="backBtn" class="ghost"></button><div id="detailHead" class="detail-head"></div><div class="section"><h3 id="teamHeading"></h3><div id="slots" class="slots"></div></div><div class="section"><h3 id="notesHeading"></h3><div class="field"><textarea id="notesInput"></textarea></div></div><button id="saveStrategyBtn" class="primary"></button></div></main></div>
<div id="bossModal" class="overlay"><div class="modal"><h2 id="bossModalTitle"></h2><div class="grid"><div class="field full"><label id="bossNameLabel"></label><input id="bossNameInput"></div><div class="field full"><label id="bossJoinLabel"></label><input id="bossJoinInput"></div><div class="field"><label id="bossResetLabel"></label><select id="bossResetInput"><option value="weekly"></option><option value="daily"></option></select></div><div class="field"><label id="bossKindLabel"></label><select id="bossKindInput"><option value="ultra"></option><option value="challenge"></option></select></div><label class="check full"><input id="bossZoneInput" type="checkbox"><span id="bossZoneLabel"></span></label></div><div class="modal-actions"><button data-close="bossModal" id="bossCancelBtn"></button><button id="bossSaveBtn" class="primary"></button></div></div></div>
<div id="classesModal" class="overlay"><div class="modal"><h2 id="classesModalTitle"></h2><div class="grid"><div class="field"><label id="classNameLabel"></label><input id="classNameInput"></div><div class="field"><label id="classRoleLabel"></label><select id="classRoleInput"><option value="support"></option><option value="dps"></option><option value="tank"></option><option value="dot"></option></select></div></div><div class="modal-actions"><button id="classAddBtn" class="primary"></button></div><div id="classList" class="manage-list"></div><div class="modal-actions"><button data-close="classesModal" id="classesCloseBtn"></button></div></div></div>
<script>(function(){const api=window.aquastarStrategy;let m,s,activeBoss=null,editingBoss=null;const $=id=>document.getElementById(id);const limit=b=>b.kind==='challenge'?7:4;const boss=()=>s.bosses.find(x=>x.id===activeBoss);const strategy=()=>{let x=s.strategies.find(q=>q.bossId===activeBoss);if(!x){x={id:'s_'+Date.now().toString(36),bossId:activeBoss,classIds:Array(limit(boss())).fill(''),notes:''};s.strategies.push(x)}while(x.classIds.length<limit(boss()))x.classIds.push('');x.classIds=x.classIds.slice(0,limit(boss()));return x};function save(){api.save(s).then(r=>{s=r.data;$('status').textContent=m.saved;setTimeout(()=>{$('status').textContent=''},1500)})}function open(id){$(id).classList.add('open')}function close(id){$(id).classList.remove('open')}function role(x){return m.roles[x]||x}function renderCards(){const c=$('cards');c.innerHTML='';if(!s.bosses.length){c.innerHTML='<div class="empty">'+m.empty+'</div>';return}s.bosses.forEach(b=>{const has=s.strategies.some(x=>x.bossId===b.id);const e=document.createElement('article');e.className='card';e.innerHTML='<h2></h2><div class="meta"><span class="badge '+b.kind+'">'+(b.kind==='challenge'?m.challenge:m.ultra)+'</span><span class="badge">'+(b.reset==='daily'?m.daily:m.weekly)+'</span><span class="badge">'+limit(b)+' '+m.players+'</span></div><div class="meta">'+(b.joinCommand||m.noJoin)+(b.hasZone?' · '+m.zone:'')+'</div><div class="card-actions"><button class="primary">'+(has?m.open:m.create)+'</button><button>'+m.edit+'</button><button class="danger">'+m.delete+'</button></div>';e.querySelector('h2').textContent=b.name;const bs=e.querySelectorAll('button');bs[0].onclick=()=>showStrategy(b.id);bs[1].onclick=()=>showBoss(b);bs[2].onclick=()=>{if(confirm(m.confirmDelete)) {s.bosses=s.bosses.filter(x=>x.id!==b.id);s.strategies=s.strategies.filter(x=>x.bossId!==b.id);save();renderCards()}};c.appendChild(e)})}function showStrategy(id){activeBoss=id;const b=boss(),x=strategy();$('listView').classList.add('hidden');$('listBar').classList.add('hidden');$('detailView').classList.remove('hidden');$('detailHead').innerHTML='<div><h2></h2><p></p></div><span class="badge '+b.kind+'">'+limit(b)+' '+m.players+'</span>';$('detailHead').querySelector('h2').textContent=b.name;$('detailHead').querySelector('p').textContent=(b.joinCommand||m.noJoin)+' · '+(b.reset==='daily'?m.daily:m.weekly);$('notesInput').value=x.notes;$('slots').innerHTML='';for(let i=0;i<limit(b);i++){const wrap=document.createElement('div');wrap.className='slot';const lab=document.createElement('label');lab.textContent=m.slot+' '+(i+1);const sel=document.createElement('select');sel.innerHTML='<option value="">'+m.noClass+'</option>';s.classes.forEach(cl=>{const o=document.createElement('option');o.value=cl.id;o.textContent=cl.name+' — '+role(cl.role);if(x.classIds[i]===cl.id)o.selected=true;sel.appendChild(o)});sel.onchange=()=>x.classIds[i]=sel.value;wrap.append(lab,sel);$('slots').appendChild(wrap)}}function back(){activeBoss=null;$('detailView').classList.add('hidden');$('listView').classList.remove('hidden');$('listBar').classList.remove('hidden');renderCards()}function showBoss(b){editingBoss=b||null;$('bossModalTitle').textContent=b?m.editBoss:m.addBoss;$('bossNameInput').value=b?b.name:'';$('bossJoinInput').value=b?b.joinCommand:'';$('bossResetInput').value=b?b.reset:'weekly';$('bossKindInput').value=b?b.kind:'ultra';$('bossZoneInput').checked=b?b.hasZone:false;open('bossModal')}function showClasses(){renderClasses();open('classesModal')}function renderClasses(){const c=$('classList');c.innerHTML='';s.classes.forEach(cl=>{const r=document.createElement('div');r.className='manage-row';r.innerHTML='<span></span><small>'+role(cl.role)+'</small><button class="danger">'+m.delete+'</button>';r.querySelector('span').textContent=cl.name;r.querySelector('button').onclick=()=>{s.classes=s.classes.filter(x=>x.id!==cl.id);s.strategies.forEach(x=>x.classIds=x.classIds.map(v=>v===cl.id?'':v));save();renderClasses()};c.appendChild(r)})}async function init(){[m,s]=await Promise.all([api.messages(),api.get().then(x=>x.data)]);document.title=m.title;$('heading').textContent=m.heading;$('description').textContent=m.description;$('addBossBtn').textContent=m.addBoss;$('manageClassesBtn').textContent=m.manageClasses;$('backBtn').textContent='← '+m.back;$('teamHeading').textContent=m.team;$('notesHeading').textContent=m.notes;$('saveStrategyBtn').textContent=m.save;$('bossNameLabel').textContent=m.name;$('bossJoinLabel').textContent=m.join;$('bossResetLabel').textContent=m.reset;$('bossKindLabel').textContent=m.kind;$('bossZoneLabel').textContent=m.zone;$('bossResetInput').options[0].textContent=m.weekly;$('bossResetInput').options[1].textContent=m.daily;$('bossKindInput').options[0].textContent=m.ultra;$('bossKindInput').options[1].textContent=m.challenge;$('bossCancelBtn').textContent=m.cancel;$('bossSaveBtn').textContent=m.save;$('classesModalTitle').textContent=m.manageClasses;$('classNameLabel').textContent=m.name;$('classRoleLabel').textContent=m.role;['support','dps','tank','dot'].forEach((r,i)=>$('classRoleInput').options[i].textContent=role(r));$('classAddBtn').textContent=m.addClass;$('classesCloseBtn').textContent=m.close;$('addBossBtn').onclick=()=>showBoss();$('manageClassesBtn').onclick=showClasses;$('backBtn').onclick=back;$('saveStrategyBtn').onclick=()=>{strategy().notes=$('notesInput').value;save()};$('bossSaveBtn').onclick=()=>{const name=$('bossNameInput').value.trim();if(!name)return;const b=editingBoss||{id:'b_'+Date.now().toString(36)};Object.assign(b,{name:name,joinCommand:$('bossJoinInput').value.trim(),reset:$('bossResetInput').value,kind:$('bossKindInput').value,hasZone:$('bossZoneInput').checked});if(!editingBoss)s.bosses.push(b);const x=s.strategies.find(q=>q.bossId===b.id);if(x)x.classIds=x.classIds.slice(0,limit(b));save();close('bossModal');renderCards()};$('classAddBtn').onclick=()=>{const name=$('classNameInput').value.trim();if(!name)return;s.classes.push({id:'c_'+Date.now().toString(36),name:name,role:$('classRoleInput').value});$('classNameInput').value='';save();renderClasses()};document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>close(b.dataset.close));document.querySelectorAll('.overlay').forEach(o=>o.onclick=e=>{if(e.target===o)close(o.id)});renderCards()}init()})();</script></body></html>

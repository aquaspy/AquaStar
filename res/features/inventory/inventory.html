<!DOCTYPE html>
<html style="margin:0;padding:0;width:100%;height:100%;">
<head>
<meta charset="UTF-8">
<title>AquaStar - Inventory</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #121212; color: #e6e6e6;
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    font-size: 13px;
  }
  #app { display: flex; flex-direction: column; height: 100%; box-sizing: border-box; }

  header { padding: 14px 18px 8px 18px; border-bottom: 1px solid #2c2c2c; flex: 0 0 auto; }
  header h1 { margin: 0 0 4px 0; font-size: 16px; }
  header p#description { margin: 0; color: #9a9a9a; line-height: 1.4; }

  #workspaceBar { display:flex; align-items:center; padding:10px 18px 0; border-bottom:1px solid #2c2c2c; flex:0 0 auto; }
  #tabs { display:flex; align-items:center; gap:6px; flex-wrap:wrap; flex:1 1 auto; }
  .tab { background:#1b1b1b; border:1px solid #333; border-radius:4px 4px 0 0; padding:6px 10px; color:#9a9a9a; font-size:12px; cursor:pointer; }
  .tab.active { background:#232323; color:#e6e6e6; border-color:#4da3ff; }

  #controls { flex:0 0 auto; background:#161616; border-bottom:1px solid #2c2c2c; }
  #primaryControls { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:8px 18px 0; flex-wrap:wrap; }
  #syncBar { display:flex; align-items:center; gap:10px; flex:0 0 auto; flex-wrap:wrap; }
  #syncStatus { font-size:12px; color:#9a9a9a; }
  #syncStatus.error { color:#f28b7a; }

  #viewToggle { display:flex; gap:6px; flex:0 0 auto; }
  #viewToggle button.active { background:#2b6fce; border-color:#2b6fce; color:#fff; }

  #filterBar { display:flex; gap:8px; align-items:center; padding:8px 18px; flex:0 0 auto; flex-wrap:wrap; }
  #filterBar .text-input { flex:1 1 200px; }
  #filterBar .select-input { flex:0 0 140px; }

  #rows { flex: 1 1 auto; overflow-y: auto; padding: 4px 18px; }
  .column-header { position:sticky; top:-4px; z-index:2; display:flex; align-items:center; gap:8px; padding:5px 0 4px; border-bottom:1px solid #353535; background:#121212; }
  .column-header button {
    min-width:0; border:0; border-radius:0; padding:0; background:transparent; color:#9a9a9a;
    font:inherit; font-size:10px; font-weight:600; letter-spacing:.04em; text-align:left;
    text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .column-header button:hover, .column-header button.active { background:transparent; color:#c9e2ff; }
  .column-header button.active::after { content:attr(data-direction); margin-left:4px; color:#79b8ff; }
  .column-header .col-name { flex:1 1 160px; }
  .column-header .col-type { flex:0 0 130px; text-align:center; }
  .column-header .col-count { flex:0 0 50px; text-align:right; }
  .column-header .col-badge { flex:0 0 60px; text-align:center; }
  .column-header .col-date { flex:0 0 150px; text-align:right; }
  .item-row { height:37px; display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid #202020; box-sizing:border-box; }
  .virtual-list { position:relative; min-height:1px; }
  .virtual-row { position:absolute; left:0; right:0; }
  .item-row .iname { flex:1 1 160px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#c9e2ff; cursor:pointer; }
  .item-row .iname.member { color:#ffd76a; }
  .item-row .iname:hover { color:#79b8ff; text-decoration:underline; }
  .item-row .iname.member:hover { color:#ffe49a; }
  .iname-icon { display:inline-flex; align-items:center; height:1em; vertical-align:-0.12em; margin-left:4px; color:#ffd76a; line-height:1; text-decoration:none; }
  .iname-icon.ac { width:12px; height:12px; }
  .item-row .itype {
    flex:0 0 130px; font-size:10px; padding:2px 7px; border-radius:10px;
    text-transform:uppercase; white-space:nowrap; letter-spacing:.02em;
    text-align:center; overflow:hidden; text-overflow:ellipsis; box-sizing:border-box;
    background:rgba(154,154,154,0.18); color:#b0b0b0;
  }
  .item-row .icount { flex:0 0 50px; text-align:right; font-family:"Consolas","Courier New",monospace; color:#9cc9ff; }
  .item-row .ibadge { flex:0 0 60px; font-size:10px; text-align:center; padding:2px 6px; border-radius:10px; box-sizing:border-box; }
  .ibadge.bank { background:rgba(52,152,219,0.18); color:#7ec8f2; }
  .ibadge.ac { background:rgba(255,215,106,0.18); color:#ffd76a; }
  .ibadge.inv, .ibadge.normal { background:rgba(154,154,154,0.14); color:#8a8a8a; }
  .item-row .idate { flex:0 0 150px; text-align:right; color:#6f6f6f; font-size:11px; }

  .text-input { flex:0 0 190px; font-family:inherit; background:#1b1b1b; border:1px solid #333; border-radius:4px; padding:5px 8px; color:#dcdcdc; }
  .text-input:focus { outline:none; border-color:#4da3ff; }
  .select-input { flex:0 0 130px; font-family:inherit; background:#1b1b1b; border:1px solid #333; border-radius:4px; padding:5px 8px; color:#dcdcdc; cursor:pointer; }
  .select-input:focus { outline:none; border-color:#4da3ff; }
  .label-filter { position:relative; flex:0 0 auto; }
  .label-filter-trigger { min-width:150px; text-align:left; display:flex; justify-content:space-between; gap:14px; background:#1b1b1b; border-color:#333; }
  .label-filter-trigger:hover,.label-filter-trigger[aria-expanded=true] { background:#232323; border-color:#4da3ff; }
  .label-filter-menu { position:absolute; z-index:8; top:calc(100% + 5px); left:0; width:280px; padding:9px; background:#1b1b1b; border:1px solid #383838; border-radius:4px; box-shadow:0 12px 28px rgba(0,0,0,.45); }
  .label-filter-menu[hidden] { display:none; }
  .label-filter-actions,.label-filter-options { display:flex; flex-wrap:wrap; gap:6px; }
  .label-filter-actions { margin-bottom:8px; }
  .label-filter-actions button { padding:4px 7px; font-size:11px; }
  .label-chip { display:inline-flex; align-items:center; gap:5px; border-radius:12px; padding:4px 8px; background:#242424; border:1px solid #444; color:#ddd; font-size:11px; }
  .label-chip.active { color:#fff; border-color:var(--label-color); background:#303030; }
  .label-dot { width:8px; height:8px; border-radius:50%; background:var(--label-color); display:inline-block; }
  .item-labels { display:inline-flex; gap:3px; margin-left:12px; vertical-align:middle; }
  .item-label { width:11px; height:11px; border-radius:50%; background:var(--label-color); display:inline-block; }
  .assign-label-button { margin-left:8px; padding:1px 5px; color:#9cc9ff; border-color:#345875; background:#192534; }
  .assign-label-button:hover { background:#22384f; }
  .label-manage { margin-left:auto; }
  #itemCount { color:#8e9cab; font-size:11px; white-space:nowrap; }
  .overlay { display:none; position:fixed; inset:0; z-index:20; background:rgba(0,0,0,.62); align-items:center; justify-content:center; }
  .overlay.open { display:flex; }
  #preview { z-index:30; }
  .modal { width:min(560px,calc(100vw - 36px)); max-height:calc(100vh - 36px); overflow:auto; padding:16px; border:1px solid #3e3e3e; border-radius:7px; background:#1b1b1b; box-shadow:0 18px 50px rgba(0,0,0,.45); }
  .modal h2 { margin:0 0 12px; font-size:15px; }
  .modal-row { display:flex; gap:7px; align-items:center; padding:8px 0; border-bottom:1px solid #2a2a2a; }
  .modal-row input[type=text] { flex:1; }
  .modal-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:14px; }
  .label-scope-select { flex:0 0 170px; }
  .label-scope-note { margin:10px 0; color:#9a9a9a; font-size:12px; line-height:1.4; }

  .form-checkbox { display:flex; align-items:center; gap:5px; font-size:12px; color:#9a9a9a; white-space:nowrap; }
  .form-checkbox input { cursor:pointer; }

  button { background:#232323; color:#e6e6e6; border:1px solid #383838; border-radius:4px; padding:6px 12px; cursor:pointer; font-size:12px; }
  button:hover { background:#2c2c2c; }
  button:active { background:#1a1a1a; }
  button.small { padding:5px 10px; font-size:11px; }
  button.primary { background:#2b6fce; border-color:#2b6fce; color:#fff; }
  button.primary:hover { background:#3a7fe0; }
  button:disabled { opacity:0.6; cursor:default; }

  #noCharsHint, #emptyHint { color:#6f6f6f; padding:20px 0; }
</style>
<link rel="stylesheet" href="../common/focus.css">
</head>
<body>
<div id="app">
  <header>
    <h1 id="heading">Inventory</h1>
    <p id="description"></p>
  </header>
  <div id="workspaceBar"><div id="tabs"></div></div>
  <div id="controls">
    <div id="primaryControls">
      <div id="viewToggle">
        <button id="viewInventoryBtn" class="small active"></button>
        <button id="viewBuyBackBtn" class="small"></button>
      </div>
      <div id="syncBar">
        <span id="syncStatus"></span>
        <button id="syncBtn" class="primary small"></button>
      </div>
    </div>
    <div id="filterBar">
      <input id="filterNameInput" class="text-input" type="text" spellcheck="false">
      <select id="filterTypeInput" class="select-input">
        <option value="all"></option>
      </select>
      <select id="filterLocationInput" class="select-input">
        <option value="all"></option>
        <option value="bank"></option>
        <option value="inventory"></option>
      </select>
      <select id="filterMemberInput" class="select-input">
        <option value="all"></option>
        <option value="member"></option>
        <option value="nonmember"></option>
      </select>
      <select id="filterCoinsInput" class="select-input">
        <option value="all"></option>
        <option value="ac"></option>
        <option value="nonac"></option>
      </select>
      <div class="label-filter"><button id="labelFilterBtn" class="label-filter-trigger small" aria-expanded="false"><span id="labelFilterText">Labels</span><span>⌄</span></button><div id="labelFilterMenu" class="label-filter-menu" hidden><div class="label-filter-actions"><button id="labelFilterAll" type="button"></button><button id="labelFilterClear" type="button"></button></div><div id="labelFilterOptions" class="label-filter-options"></div></div></div>
      <span id="itemCount"></span>
      <button id="manageLabelsBtn" class="small label-manage" type="button"></button>
    </div>
  </div>
  <div id="rows"></div>
</div>
<div id="labelsModal" class="overlay"><div class="modal"><h2 id="labelsModalTitle"></h2><div class="modal-row"><input id="newLabelName" class="text-input" type="text"><input id="newLabelColor" type="color" value="#4da3ff"><select id="newLabelScope" class="select-input label-scope-select"><option value="character"></option><option value="global"></option></select><button id="addLabelBtn" class="primary" type="button"></button></div><div id="labelsList"></div><div class="modal-actions"><button id="closeLabelsBtn" type="button"></button></div></div></div>
<div id="assignLabelsModal" class="overlay"><div class="modal"><h2 id="assignLabelsTitle"></h2><p id="assignLabelsHint" class="label-scope-note"></p><div id="assignLabelsOptions" class="label-filter-options"></div><div class="modal-actions"><button id="cancelAssignLabelsBtn" type="button"></button><button id="saveAssignLabelsBtn" class="primary" type="button"></button></div></div></div>

<script src="../wikiview/jquery.min.js"></script>
<script src="../wikiview/nameVariants.js"></script>
<script src="../wikiview/hoverPreview.js"></script>
<script>
(function () {
  const api = window.aquastarInventory;
  let messages, state, activeCharId = null, activeView = 'inventory';
  let labels = { tags: [], globalItemLabels: {}, characterItemLabels: {} }, selectedLabelIds = new Set(), assigningItem = null;
  let filterName = '', filterType = 'all', filterLocation = 'all', filterMember = 'all', filterCoins = 'all';
  const VIRTUAL_ROW_HEIGHT = 37, VIRTUAL_OVERSCAN = 10;
  let virtualItems = [], virtualListEl = null, virtualFrame = null;
  let inventoryWorker = null, workerDatasetKey = '', workerRequestId = 0, latestWorkerRequestId = 0, workerSourceItems = [];
  let nameFilterTimer = null;
  // Sort criteria are ordered from most to least important. Keeping earlier criteria
  // as tie-breakers gives the expected Type -> Name result after clicking Name, then Type.
  let sortCriteria = [{ key: 'name', direction: 'asc' }];

  function setStatus(text, isError) {
    const el = document.getElementById('syncStatus');
    el.textContent = text || '';
    el.classList.toggle('error', !!isError);
  }

  function formatRelativeTime(isoString) {
    if (!isoString) return null;
    const then = new Date(isoString).getTime();
    if (isNaN(then)) return null;
    const diffMs = Date.now() - then;
    const mins = Math.floor(diffMs / 60000);
    if (mins < 1) return messages.justNowLabel;
    if (mins < 60) return mins + 'm';
    const hours = Math.floor(mins / 60);
    if (hours < 24) return hours + 'h';
    const days = Math.floor(hours / 24);
    return days + 'd';
  }

  function formatDate(isoString) {
    if (!isoString) return '';
    const d = new Date(isoString);
    if (isNaN(d.getTime())) return '';
    return d.toLocaleDateString();
  }

  function activeCharacter() {
    return activeCharId ? state.characters[activeCharId] : null;
  }

  function itemLabelKey(item) {
    return item && item.id !== null && item.id !== undefined ? 'id:' + item.id : 'name:' + String(item && item.name || '').trim().toLowerCase();
  }

  function itemLabelIds(item) {
    const key = itemLabelKey(item);
    const local = activeCharId && labels.characterItemLabels[activeCharId] ? labels.characterItemLabels[activeCharId][key] || [] : [];
    return Array.from(new Set((labels.globalItemLabels[key] || []).concat(local))).filter((id) => {
      const tag = labels.tags.find((entry) => entry.id === id);
      return tag && (tag.scope === 'global' ? (labels.globalItemLabels[key] || []).indexOf(id) !== -1 : local.indexOf(id) !== -1);
    });
  }

  function saveLabels() { return api.saveLabels(labels).then((result) => { labels = result.labels; }); }

  function renderLabelFilter() {
    const options = document.getElementById('labelFilterOptions');
    const label = document.getElementById('labelFilterText');
    options.innerHTML = '';
    labels.tags.forEach((tag) => {
      const chip = document.createElement('button');
      chip.type = 'button'; chip.className = 'label-chip' + (selectedLabelIds.has(tag.id) ? ' active' : '');
      chip.style.setProperty('--label-color', tag.color); chip.innerHTML = '<span class="label-dot"></span><span></span>';
      chip.querySelector('span:last-child').textContent = tag.name;
      chip.onclick = () => { if (selectedLabelIds.has(tag.id)) selectedLabelIds.delete(tag.id); else selectedLabelIds.add(tag.id); renderLabelFilter(); renderRows(); };
      options.appendChild(chip);
    });
    label.textContent = selectedLabelIds.size ? selectedLabelIds.size + ' ' + messages.labelsSelected : messages.filterLabels;
  }

  function renderLabelsManager() {
    const list = document.getElementById('labelsList'); list.innerHTML = '';
    labels.tags.forEach((tag) => {
      const row = document.createElement('div'); row.className = 'modal-row';
      row.innerHTML = '<input type="color"><input class="text-input" type="text"><span style="color:#9a9a9a;font-size:11px;white-space:nowrap"></span><button type="button"></button><button type="button"></button>';
      const [color, name] = row.querySelectorAll('input'); const buttons = row.querySelectorAll('button');
      row.querySelector('span').textContent = tag.scope === 'global' ? messages.labelScopeGlobal : messages.labelScopeCharacter;
      color.value = tag.color; name.value = tag.name; buttons[0].textContent = messages.saveLabel; buttons[1].textContent = messages.delete;
      buttons[0].onclick = () => { tag.name = name.value.trim() || tag.name; tag.color = color.value; saveLabels().then(() => { renderLabelsManager(); renderLabelFilter(); renderRows(); }); };
      buttons[1].onclick = () => { labels.tags = labels.tags.filter((entry) => entry.id !== tag.id); Object.keys(labels.globalItemLabels).forEach((key) => { labels.globalItemLabels[key] = labels.globalItemLabels[key].filter((id) => id !== tag.id); }); Object.keys(labels.characterItemLabels).forEach((charId) => Object.keys(labels.characterItemLabels[charId]).forEach((key) => { labels.characterItemLabels[charId][key] = labels.characterItemLabels[charId][key].filter((id) => id !== tag.id); })); selectedLabelIds.delete(tag.id); saveLabels().then(() => { renderLabelsManager(); renderLabelFilter(); renderRows(); }); };
      list.appendChild(row);
    });
  }

  function openAssignLabels(item) {
    assigningItem = item;
    const options = document.getElementById('assignLabelsOptions'); options.innerHTML = '';
    const key = itemLabelKey(item);
    const local = activeCharId && labels.characterItemLabels[activeCharId] ? labels.characterItemLabels[activeCharId][key] || [] : [];
    const global = labels.globalItemLabels[key] || [];
    labels.tags.forEach((tag) => { const label = document.createElement('label'); label.className = 'label-chip'; label.style.setProperty('--label-color', tag.color); label.dataset.tagId = tag.id; label.innerHTML = '<input type="checkbox"><span class="label-dot"></span><span></span>'; label.querySelector('input').checked = tag.scope === 'global' ? global.indexOf(tag.id) !== -1 : local.indexOf(tag.id) !== -1; label.querySelector('span:last-child').textContent = tag.name + (tag.scope === 'global' ? ' · ' + messages.labelScopeGlobal : ' · ' + messages.labelScopeCharacter); options.appendChild(label); });
    document.getElementById('assignLabelsModal').classList.add('open');
  }

  function renderTabs() {
    const tabsEl = document.getElementById('tabs');
    tabsEl.innerHTML = '';
    Object.keys(state.characters).forEach((charId) => {
      const character = state.characters[charId];
      const tab = document.createElement('div');
      tab.className = 'tab' + (charId === activeCharId ? ' active' : '');
      tab.textContent = character.name || ('Character ' + charId);
      tab.onclick = () => {
        activeCharId = charId;
        api.setActiveChar(charId);
        renderTabs();
        renderFilterTypeOptions();
        renderRows();
      };
      tabsEl.appendChild(tab);
    });
  }

  // Type options are rebuilt per character/view since each character's synced data (and
  // Inventory vs BuyBack) has its own distinct set of item types.
  function renderFilterTypeOptions() {
    const select = document.getElementById('filterTypeInput');
    const character = activeCharacter();
    const items = character ? (activeView === 'inventory' ? character.inventory : character.buyback) : [];
    const types = Array.from(new Set(items.map((it) => it.type).filter(Boolean))).sort();
    select.innerHTML = '';
    const allOpt = document.createElement('option');
    allOpt.value = 'all';
    allOpt.textContent = messages.filterTypeAll;
    select.appendChild(allOpt);
    types.forEach((type) => {
      const opt = document.createElement('option');
      opt.value = type;
      opt.textContent = type;
      select.appendChild(opt);
    });
    select.value = types.indexOf(filterType) !== -1 ? filterType : 'all';
    if (select.value === 'all') filterType = 'all';
  }

  // Hover-preview (hoverPreview.js, shared with WikiView's injected script). Goes through
  // hoveredName() rather than hovered() since we only have the item's plain name, not a
  // real wiki URL - it retries the wiki's disambiguation suffixes ((AC), (Merge)...) when
  // the bare name has no page of its own (e.g. "Proto Legion Dark Caster" only exists as
  // "Proto Legion Dark Caster (Merge)").
  function wireHoverPreview(el, itemName) {
    el.addEventListener('mouseover', () => { hoveredName(itemName); });
    el.addEventListener('mouseout', () => { unhovered(); });
  }

  function buildInventoryRow(item) {
    const row = document.createElement('div');
    row.className = 'item-row';

    const nameEl = document.createElement('div');
    nameEl.className = 'iname' + (item.member ? ' member' : '');
    nameEl.textContent = item.name;
    nameEl.title = item.name;
    if (item.member) {
      const memberIcon = document.createElement('span');
      memberIcon.className = 'iname-icon';
      memberIcon.textContent = '★';
      memberIcon.title = messages.memberBadge;
      nameEl.appendChild(memberIcon);
    }
    if (item.coins) {
      const acIcon = document.createElement('span');
      acIcon.className = 'iname-icon ac';
      acIcon.title = messages.acBadge;
      acIcon.innerHTML = '<svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><circle cx="8" cy="8" r="5.7"/><path d="M8 4.4v7.2M10 5.8C9.5 5.2 8.8 5 8 5c-1 0-1.8.5-1.8 1.3 0 2 3.6.9 3.6 2.8 0 .9-.8 1.4-1.8 1.4-.9 0-1.7-.3-2.2-1"/></svg>';
      nameEl.appendChild(acIcon);
    }
    const itemTags = itemLabelIds(item).map((id) => labels.tags.find((tag) => tag.id === id)).filter(Boolean);
    if (itemTags.length) {
      const tagsEl = document.createElement('span'); tagsEl.className = 'item-labels';
      itemTags.forEach((tag) => { const dot = document.createElement('span'); dot.className = 'item-label'; dot.style.setProperty('--label-color', tag.color); dot.title = tag.name; tagsEl.appendChild(dot); });
      nameEl.appendChild(tagsEl);
    }
    const tagButton = document.createElement('button'); tagButton.type = 'button'; tagButton.className = 'small assign-label-button'; tagButton.textContent = '+'; tagButton.title = messages.assignLabels; tagButton.setAttribute('aria-label', messages.assignLabels);
    tagButton.onclick = (event) => { event.stopPropagation(); openAssignLabels(item); };
    nameEl.appendChild(tagButton);
    wireHoverPreview(nameEl, item.name);
    nameEl.addEventListener('click', () => { api.openItemWiki(item.name); });

    const typeEl = document.createElement('div');
    typeEl.className = 'itype';
    typeEl.textContent = item.type;

    const countEl = document.createElement('div');
    countEl.className = 'icount';
    countEl.textContent = item.count;

    const bankEl = document.createElement('div');
    bankEl.className = 'ibadge ' + (item.bank ? 'bank' : 'inv');
    bankEl.textContent = item.bank ? messages.bankBadge : messages.inventoryBadge;

    const dateEl = document.createElement('div');
    dateEl.className = 'idate';
    dateEl.textContent = formatDate(item.added);

    row.appendChild(nameEl);
    row.appendChild(typeEl);
    row.appendChild(countEl);
    row.appendChild(bankEl);
    row.appendChild(dateEl);
    return row;
  }

  function buildBuyBackRow(item) {
    const row = document.createElement('div');
    row.className = 'item-row';

    const nameEl = document.createElement('div');
    nameEl.className = 'iname';
    nameEl.textContent = item.name;
    nameEl.title = item.name;
    wireHoverPreview(nameEl, item.name);
    nameEl.addEventListener('click', () => { api.openItemWiki(item.name); });

    const typeEl = document.createElement('div');
    typeEl.className = 'itype';
    typeEl.textContent = item.type;

    const costEl = document.createElement('div');
    costEl.className = 'icount';
    costEl.textContent = item.cost;

    const rarityEl = document.createElement('div');
    rarityEl.className = 'ibadge bank';
    rarityEl.textContent = item.rarityName || '';

    const dateEl = document.createElement('div');
    dateEl.className = 'idate';
    dateEl.textContent = formatDate(item.inserted);

    row.appendChild(nameEl);
    row.appendChild(typeEl);
    row.appendChild(costEl);
    row.appendChild(rarityEl);
    row.appendChild(dateEl);
    return row;
  }

  function getColumns() {
    if (activeView === 'inventory') {
      return [
        { key: 'name', label: messages.columnName, className: 'col-name' },
        { key: 'type', label: messages.columnType, className: 'col-type' },
        { key: 'count', label: messages.columnCount, className: 'col-count' },
        { key: 'bank', label: messages.columnBank, className: 'col-badge' },
        { key: 'added', label: messages.columnAdded, className: 'col-date' }
      ];
    }
    return [
      { key: 'name', label: messages.columnName, className: 'col-name' },
      { key: 'type', label: messages.columnType, className: 'col-type' },
      { key: 'cost', label: messages.columnCost, className: 'col-count' },
      { key: 'rarityName', label: messages.columnRarity, className: 'col-badge' },
      { key: 'inserted', label: messages.columnInserted, className: 'col-date' }
    ];
  }

  function renderColumnHeader(rowsEl) {
    const header = document.createElement('div');
    header.className = 'column-header';
    getColumns().forEach((column) => {
      if (!column.key) {
        const spacer = document.createElement('div');
        spacer.className = column.className;
        spacer.setAttribute('aria-hidden', 'true');
        header.appendChild(spacer);
        return;
      }
      const button = document.createElement('button');
      button.type = 'button';
      const sortIndex = sortCriteria.findIndex((criterion) => criterion.key === column.key);
      const isPrimarySort = sortIndex === 0;
      button.className = column.className + (isPrimarySort ? ' active' : '');
      button.textContent = column.label;
      button.title = column.label;
      if (isPrimarySort) button.dataset.direction = sortCriteria[0].direction === 'asc' ? '▲' : '▼';
      button.setAttribute('aria-sort', isPrimarySort ? (sortCriteria[0].direction === 'asc' ? 'ascending' : 'descending') : 'none');
      button.onclick = () => {
        if (isPrimarySort) {
          sortCriteria[0].direction = sortCriteria[0].direction === 'asc' ? 'desc' : 'asc';
        } else if (sortIndex !== -1) {
          sortCriteria.unshift(sortCriteria.splice(sortIndex, 1)[0]);
        } else {
          sortCriteria.unshift({ key: column.key, direction: 'asc' });
        }
        renderRows();
      };
      header.appendChild(button);
    });
    rowsEl.appendChild(header);
  }

  function compareItems(a, b) {
    const numericColumns = ['count', 'cost'];
    const booleanColumns = ['bank'];
    const dateColumns = ['added', 'inserted'];
    for (const criterion of sortCriteria) {
      const key = criterion.key;
      let comparison;
      if (numericColumns.indexOf(key) !== -1) {
        comparison = (Number(a[key]) || 0) - (Number(b[key]) || 0);
      } else if (booleanColumns.indexOf(key) !== -1) {
        comparison = Number(!!a[key]) - Number(!!b[key]);
      } else if (dateColumns.indexOf(key) !== -1) {
        comparison = (new Date(a[key]).getTime() || 0) - (new Date(b[key]).getTime() || 0);
      } else {
        comparison = String(a[key] || '').localeCompare(String(b[key] || ''), undefined, { numeric: true, sensitivity: 'base' });
      }
      if (comparison) return comparison * (criterion.direction === 'asc' ? 1 : -1);
    }
    return 0;
  }

  function matchesFilters(item) {
    if (filterName && item.name.toLowerCase().indexOf(filterName) === -1) return false;
    if (filterType !== 'all' && item.type !== filterType) return false;
    if (selectedLabelIds.size && !itemLabelIds(item).some((id) => selectedLabelIds.has(id))) return false;
    if (activeView === 'inventory') {
      if (filterLocation === 'bank' && !item.bank) return false;
      if (filterLocation === 'inventory' && item.bank) return false;
      if (filterMember === 'member' && !item.member) return false;
      if (filterMember === 'nonmember' && item.member) return false;
      if (filterCoins === 'ac' && !item.coins) return false;
      if (filterCoins === 'nonac' && item.coins) return false;
    }
    return true;
  }

  function renderSyncStatus() {
    const character = activeCharacter();
    if (!character) { setStatus(''); return; }
    const time = activeView === 'inventory' ? character.lastInventorySync : character.lastBuyBackSync;
    if (!time) { setStatus(messages.neverSyncedLabel); return; }
    setStatus(messages.syncedLabel + formatRelativeTime(time));
  }

  function renderVirtualRows() {
    virtualFrame = null;
    if (!virtualListEl) return;
    const rowsEl = document.getElementById('rows');
    const visibleRows = Math.ceil(rowsEl.clientHeight / VIRTUAL_ROW_HEIGHT);
    const listScrollTop = Math.max(0, rowsEl.scrollTop - virtualListEl.offsetTop);
    const first = Math.max(0, Math.floor(listScrollTop / VIRTUAL_ROW_HEIGHT) - VIRTUAL_OVERSCAN);
    const last = Math.min(virtualItems.length, first + visibleRows + VIRTUAL_OVERSCAN * 2);
    virtualListEl.innerHTML = '';
    const buildRow = activeView === 'inventory' ? buildInventoryRow : buildBuyBackRow;
    const fragment = document.createDocumentFragment();
    for (let index = first; index < last; index++) {
      const row = buildRow(virtualItems[index]);
      row.classList.add('virtual-row');
      row.dataset.sourceIndex = String(workerSourceItems.indexOf(virtualItems[index]));
      row.style.transform = 'translateY(' + (index * VIRTUAL_ROW_HEIGHT) + 'px)';
      fragment.appendChild(row);
    }
    virtualListEl.appendChild(fragment);
  }

  function scheduleVirtualRows() {
    if (!virtualListEl || virtualFrame) return;
    virtualFrame = requestAnimationFrame(renderVirtualRows);
  }

  function refreshVisibleItem(item) {
    if (activeView !== 'inventory' || !virtualListEl) return;
    const sourceIndex = workerSourceItems.indexOf(item);
    const oldRow = virtualListEl.querySelector('[data-source-index="' + sourceIndex + '"]');
    if (!oldRow) return;
    const newRow = buildInventoryRow(item);
    newRow.classList.add('virtual-row'); newRow.dataset.sourceIndex = String(sourceIndex); newRow.style.transform = oldRow.style.transform;
    oldRow.replaceWith(newRow);
  }

  function workerItems(sourceItems) {
    return sourceItems.map((item, sourceIndex) => ({
      sourceIndex: sourceIndex, searchName: item.searchName || String(item.name || '').toLowerCase(), sortName: item.sortName || String(item.name || '').toLowerCase(),
      name: item.name, type: item.type, count: item.count, cost: item.cost, bank: item.bank, member: item.member, coins: item.coins,
      addedAt: item.addedAt || new Date(item.added).getTime() || 0, insertedAt: item.insertedAt || new Date(item.inserted).getTime() || 0,
      rarityName: item.rarityName, labelIds: itemLabelIds(item)
    }));
  }

  function ensureWorkerData(sourceItems) {
    const key = [activeCharId, activeView, activeView === 'inventory' ? activeCharacter().lastInventorySync : activeCharacter().lastBuyBackSync, JSON.stringify(labels)].join('|');
    if (key === workerDatasetKey) return;
    workerDatasetKey = key;
    inventoryWorker.postMessage({ type: 'setItems', items: workerItems(sourceItems) });
  }

  function requestFilteredItems(sourceItems) {
    workerSourceItems = sourceItems;
    ensureWorkerData(sourceItems);
    const requestId = ++workerRequestId;
    latestWorkerRequestId = requestId;
    inventoryWorker.postMessage({ type: 'query', requestId: requestId, query: {
      name: filterName, itemType: filterType, location: filterLocation, member: filterMember, coins: filterCoins,
      inventory: activeView === 'inventory', labelIds: Array.from(selectedLabelIds), sortCriteria: sortCriteria
    } });
  }

  function applyWorkerResult(sourceItems, indexes) {
    const rowsEl = document.getElementById('rows');
    const items = indexes.map((index) => sourceItems[index]);
    document.getElementById('itemCount').textContent = messages.itemCountLabel.replace('{shown}', items.length).replace('{total}', sourceItems.length);
    if (!items.length) {
      const hint = document.createElement('div'); hint.id = 'emptyHint'; hint.textContent = messages.emptyStateLabel; rowsEl.appendChild(hint); return;
    }
    renderColumnHeader(rowsEl);
    virtualItems = items;
    virtualListEl = document.createElement('div'); virtualListEl.className = 'virtual-list'; virtualListEl.style.height = (items.length * VIRTUAL_ROW_HEIGHT) + 'px';
    rowsEl.appendChild(virtualListEl); rowsEl.scrollTop = 0; renderVirtualRows();
  }

  function renderRows() {
    const rowsEl = document.getElementById('rows');
    rowsEl.innerHTML = '';
    virtualItems = []; virtualListEl = null;
    renderSyncStatus();

    const character = activeCharacter();
    if (!character) {
      document.getElementById('itemCount').textContent = '';
      const hint = document.createElement('div');
      hint.id = 'noCharsHint';
      hint.textContent = messages.noCharactersLabel;
      rowsEl.appendChild(hint);
      return;
    }

    const sourceItems = activeView === 'inventory' ? character.inventory : character.buyback;
    requestFilteredItems(sourceItems);
  }

  function setView(view) {
    activeView = view;
    sortCriteria = [{ key: 'name', direction: 'asc' }];
    document.getElementById('viewInventoryBtn').classList.toggle('active', view === 'inventory');
    document.getElementById('viewBuyBackBtn').classList.toggle('active', view === 'buyback');
    filterType = 'all';
    renderFilterTypeOptions();
    renderRows();
  }

  async function doSync() {
    const btn = document.getElementById('syncBtn');
    btn.disabled = true;
    setStatus(messages.syncingLabel);
    const result = await api.syncNow();
    btn.disabled = false;
    if (!result.ok) {
      setStatus(result.error === 'unauthenticated' ? messages.syncErrorUnauthenticated : messages.syncErrorNetwork, true);
      return;
    }
    const reloaded = await api.getInventory();
    state = reloaded.data;
    labels = state.labels || labels;
    activeCharId = String(result.charId);
    renderTabs();
    renderFilterTypeOptions();
    renderRows();
  }

  async function init() {
    if (!api) throw new Error('The Inventory preload bridge was not loaded.');
    const [msgs, invResult] = await Promise.all([api.getMessages(), api.getInventory()]);
    if (!invResult || invResult.error || !invResult.data) {
      throw new Error(invResult && invResult.error === 'blocked'
        ? 'A solicitação foi bloqueada pela verificação de origem do Inventário.'
        : 'Não foi possível ler os dados do Inventário.');
    }
    messages = msgs;
    state = invResult.data;
    labels = state.labels || labels;

    document.title = messages.title;
    document.getElementById('heading').textContent = messages.heading;
    document.getElementById('description').textContent = messages.description;
    document.getElementById('syncBtn').textContent = messages.syncButton;
    document.getElementById('syncBtn').onclick = doSync;
    document.getElementById('viewInventoryBtn').textContent = messages.inventoryTabLabel;
    document.getElementById('viewBuyBackBtn').textContent = messages.buyBackTabLabel;
    document.getElementById('viewInventoryBtn').onclick = () => setView('inventory');
    document.getElementById('viewBuyBackBtn').onclick = () => setView('buyback');
    inventoryWorker = new Worker('inventory_worker.js');
    inventoryWorker.onmessage = (event) => {
      const result = event.data || {};
      if (result.type === 'result' && result.requestId === latestWorkerRequestId) applyWorkerResult(workerSourceItems, result.indexes || []);
    };
    document.getElementById('rows').addEventListener('scroll', scheduleVirtualRows, { passive: true });
    window.addEventListener('resize', scheduleVirtualRows);

    document.getElementById('filterNameInput').placeholder = messages.filterNamePlaceholder;
    document.getElementById('filterNameInput').addEventListener('input', (e) => {
      const query = e.target.value.trim().toLowerCase();
      // Large inventories are costly to filter/render on every keystroke. Wait until the
      // query is specific enough to be useful before narrowing the list. In particular,
      // don't even re-render for the first two characters unless clearing an active search.
      const nextFilterName = query.length >= 3 ? query : '';
      if (nextFilterName === filterName) return;
      filterName = nextFilterName;
      clearTimeout(nameFilterTimer);
      nameFilterTimer = setTimeout(renderRows, 150);
    });
    document.getElementById('filterTypeInput').addEventListener('change', (e) => {
      filterType = e.target.value;
      renderRows();
    });
    const filterLocationInput = document.getElementById('filterLocationInput');
    filterLocationInput.options[0].textContent = messages.filterAllLabel;
    filterLocationInput.options[1].textContent = messages.filterBankLabel;
    filterLocationInput.options[2].textContent = messages.filterInventoryOnlyLabel;
    filterLocationInput.addEventListener('change', (e) => {
      filterLocation = e.target.value;
      renderRows();
    });
    const filterMemberInput = document.getElementById('filterMemberInput');
    filterMemberInput.options[0].textContent = messages.filterAllLabel;
    filterMemberInput.options[1].textContent = messages.filterMemberLabel;
    filterMemberInput.options[2].textContent = messages.filterNonMemberOnlyLabel;
    filterMemberInput.addEventListener('change', (e) => {
      filterMember = e.target.value;
      renderRows();
    });
    const filterCoinsInput = document.getElementById('filterCoinsInput');
    filterCoinsInput.options[0].textContent = messages.filterAllLabel;
    filterCoinsInput.options[1].textContent = messages.filterAcLabel;
    filterCoinsInput.options[2].textContent = messages.filterNonAcLabel;
    filterCoinsInput.addEventListener('change', (e) => {
      filterCoins = e.target.value;
      renderRows();
    });
    document.getElementById('labelFilterBtn').onclick = () => { const menu = document.getElementById('labelFilterMenu'); menu.hidden = !menu.hidden; document.getElementById('labelFilterBtn').setAttribute('aria-expanded', String(!menu.hidden)); };
    document.getElementById('labelFilterAll').textContent = messages.filterAllLabel;
    document.getElementById('labelFilterClear').textContent = messages.labelFilterClear;
    document.getElementById('labelFilterAll').onclick = () => { labels.tags.forEach((tag) => selectedLabelIds.add(tag.id)); renderLabelFilter(); renderRows(); };
    document.getElementById('labelFilterClear').onclick = () => { selectedLabelIds.clear(); renderLabelFilter(); renderRows(); };
    document.getElementById('manageLabelsBtn').textContent = messages.manageLabels;
    document.getElementById('manageLabelsBtn').onclick = () => { renderLabelsManager(); document.getElementById('labelsModal').classList.add('open'); };
    document.getElementById('labelsModalTitle').textContent = messages.manageLabels;
    document.getElementById('newLabelName').placeholder = messages.labelName;
    document.getElementById('newLabelScope').options[0].textContent = messages.labelScopeCharacter;
    document.getElementById('newLabelScope').options[1].textContent = messages.labelScopeGlobal;
    document.getElementById('addLabelBtn').textContent = messages.addLabel;
    document.getElementById('addLabelBtn').onclick = () => { const name = document.getElementById('newLabelName').value.trim(); if (!name) return; labels.tags.push({ id:'label_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,7), name:name, color:document.getElementById('newLabelColor').value, scope:document.getElementById('newLabelScope').value }); document.getElementById('newLabelName').value = ''; saveLabels().then(() => { renderLabelsManager(); renderLabelFilter(); }); };
    document.getElementById('closeLabelsBtn').textContent = messages.close;
    document.getElementById('closeLabelsBtn').onclick = () => document.getElementById('labelsModal').classList.remove('open');
    document.getElementById('assignLabelsTitle').textContent = messages.assignLabels;
    document.getElementById('assignLabelsHint').textContent = messages.assignLabelsHint;
    document.getElementById('cancelAssignLabelsBtn').textContent = messages.cancel;
    document.getElementById('cancelAssignLabelsBtn').onclick = () => document.getElementById('assignLabelsModal').classList.remove('open');
    document.getElementById('saveAssignLabelsBtn').textContent = messages.saveLabel;
    document.getElementById('saveAssignLabelsBtn').onclick = () => {
      if (!assigningItem) return;
      const ids = Array.from(document.querySelectorAll('#assignLabelsOptions input:checked')).map((input) => input.parentNode.dataset.tagId);
      const globalIds = ids.filter((id) => (labels.tags.find((tag) => tag.id === id) || {}).scope === 'global');
      const characterIds = ids.filter((id) => (labels.tags.find((tag) => tag.id === id) || {}).scope !== 'global');
      const key = itemLabelKey(assigningItem);
      labels.globalItemLabels[key] = globalIds;
      labels.characterItemLabels[activeCharId] = labels.characterItemLabels[activeCharId] || {};
      labels.characterItemLabels[activeCharId][key] = characterIds;
      saveLabels().then(() => {
        workerDatasetKey = '';
        document.getElementById('assignLabelsModal').classList.remove('open');
        if (selectedLabelIds.size) renderRows();
        else refreshVisibleItem(assigningItem);
      });
    };

    const charIds = Object.keys(state.characters);
    activeCharId = (state.lastActiveCharId && state.characters[state.lastActiveCharId])
      ? state.lastActiveCharId
      : (charIds.length ? charIds[0] : null);

    renderTabs();
    renderFilterTypeOptions();
    renderLabelFilter();
    renderRows();
  }

  init().catch((error) => {
    console.error('[AquaStar] Inventory initialization failed:', error);
    const rows = document.getElementById('rows');
    rows.innerHTML = '';
    const message = document.createElement('div');
    message.id = 'noCharsHint';
    message.textContent = 'Falha ao iniciar o Inventário: ' + (error && error.message ? error.message : String(error));
    rows.appendChild(message);
  });
})();
</script>
</body>
</html>

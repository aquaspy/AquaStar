<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  html, body { margin:0; height:100%; background:#111; color:#ddd; font: 15px sans-serif; }
  body { display:flex; align-items:center; justify-content:center; text-align:center; }
  #status { max-width: 36em; line-height: 1.5; padding: 1em; }
  button { margin-top: 1em; font-size: 14px; padding: .4em 1em; }
</style>
</head>
<body>
<div>
  <div id="status">Starting Ruffle desktop…</div>
  <button id="relaunch" hidden>Open the game again</button>
</div>
<script>
// Main process (res/instances.js) drives this page with setNativeStatus(); it has no IPC.
window.setNativeStatus = function (text, canRelaunch) {
  document.getElementById('status').textContent = text;
  document.getElementById('relaunch').hidden = !canRelaunch;
};
document.getElementById('relaunch').onclick = function () {
  document.getElementById('relaunch').hidden = true;
  location.hash = 'relaunch-' + Date.now();
};
</script>
</body>
</html>
